name: serving-fanout-r1-evidence-reducer-public
on:
  pull_request:
    paths:
      - 'qualification/serving_fanout_r0/analysis/**'
      - '.github/workflows/serving-fanout-r1-evidence-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reduce-and-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Run independent receipt consistency oracle
        working-directory: qualification/serving_fanout_r0/analysis
        run: |
          go version
          go test -count=3 ./...
          go run . -baseline fixtures/fifo.json -candidate fixtures/reserved.json > "$RUNNER_TEMP/reduced.json"
          python3 - "$RUNNER_TEMP/reduced.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["evidence_class"]=="SYNTHETIC_RECEIPT_REDUCTION_ONLY"
          assert r["interactive_p95_wait_reduction_ticks"]==49
          assert r["batch_makespan_difference_ticks"]==50
          assert r["matched_task_ids"]==4
          assert r["uncertainty"]=="NOT_ESTIMABLE_SINGLE_SYNTHETIC_FIXTURE"
          assert r["promotion"]=="NO_RUNTIME_PROMOTION"
          print("Receipt consistency PASS; no inference about real hardware reliability")
          PY
          go run . -live-gate fixtures/live-r7-public-cpu.json > "$RUNNER_TEMP/live-r7-screen.json"
          python3 - "$RUNNER_TEMP/live-r7-screen.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["decision"]=="INSUFFICIENT_EVIDENCE"
          assert r["automatic_promotion"]=="NEVER"
          assert "no_admitted_sovereign_host_measurements" in r["reasons"]
          assert "task_class_coverage_insufficient" in r["reasons"]
          assert r["origin_authentication"]=="NOT_PERFORMED_ON_SUMMARY_METADATA"
          print("Source-labeled G2 public-CPU 24/24 task-success correctly held from production admission")
          PY
      - name: Preserve immutable synthetic evidence output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serving-fanout-r1-reducer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reduced.json
            ${{ runner.temp }}/live-r7-screen.json
          retention-days: 14
          if-no-files-found: ignore
