name: experiment-0002-r20-control-battery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.ci/run-experiment-0002-r20'

permissions:
  contents: read

jobs:
  r20-control-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-shot arm
        id: arm
        run: |
          if [ -f .ci/run-experiment-0002-r20 ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m py_compile tools/jspace_interventions.py
          python -m py_compile tools/run_qwen35_4b_control_battery.py

      - name: Install CPU PyTorch
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install causal dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'
          rm -rf ~/.cache/pip

      - name: Run R20 falsification battery
        if: steps.arm.outputs.armed == 'true'
        run: python tools/run_qwen35_4b_control_battery.py

      - name: Summarize R20
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('artifacts/experiment-0002-r20-control-battery/summary.json').read_text())
          print('casewise_primary_beats_control', s['casewise_primary_beats_control'])
          print('dose_monotonic_hits', s['dose_monotonic_hits'])
          print('falsification_vector', s['falsification_vector'])
          for name, row in s['condition_summary'].items():
              print(name, row)
          PY

      - name: Upload R20 evidence
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-r20-control-battery-${{ github.run_id }}
          path: artifacts/experiment-0002-r20-control-battery
          if-no-files-found: error
          retention-days: 14
