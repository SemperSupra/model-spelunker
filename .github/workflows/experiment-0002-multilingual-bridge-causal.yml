name: experiment-0002-multilingual-bridge-causal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  multilingual-bridge-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-shot arm
        id: arm
        run: |
          if [ -f .ci/run-experiment-0002-multilingual-bridge-causal ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Syntax check harness
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m py_compile tools/jspace_interventions.py
          python -m py_compile tools/run_multilingual_bridge_cloze.py
          python -m py_compile tools/run_multilingual_bridge_causal.py

      - name: Install CPU PyTorch
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install experiment dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'

      - name: Behavior-calibrate ISO alpha-2 downstream function
        if: steps.arm.outputs.armed == 'true'
        run: |
          python tools/run_multilingual_bridge_cloze.py \
            --fixture fixtures/experiment-0002/multilingual-indirect-bridge-iso-alpha2.jsonl \
            --model Qwen/Qwen3.5-0.8B \
            --lens-repo neuronpedia/jacobian-lens \
            --lens-revision 4f30bb8c97e696115d4a2ef359923b5005fc860c \
            --lens-file qwen3.5-0.8b/jlens/Salesforce-wikitext/Qwen3.5-0.8B_jacobian_lens.pt \
            --positions 8 \
            --output-dir artifacts/experiment-0002-iso-alpha2-reuse/preflight

      - name: Apply second-function promotion gate
        id: gate
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('artifacts/experiment-0002-iso-alpha2-reuse/preflight/summary.json').read_text())
          langs = s['language_summary']
          earned = (
              s['evaluated_cases'] == 8
              and s['skipped_cases'] == 0
              and s['behavior_accuracy'] == 1.0
              and langs.get('en', {}).get('n') == 4
              and langs.get('de', {}).get('n') == 4
              and langs['en']['behavior_accuracy'] == 1.0
              and langs['de']['behavior_accuracy'] == 1.0
          )
          print('preflight_overall_accuracy', s['behavior_accuracy'])
          print('preflight_language_summary', langs)
          print('causal_reuse_earned', earned)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"earned={'true' if earned else 'false'}\n")
          PY

      - name: Run ISO alpha-2 second-function causal reuse matrix
        if: steps.arm.outputs.armed == 'true' && steps.gate.outputs.earned == 'true'
        run: |
          python tools/run_multilingual_bridge_causal.py \
            --fixture fixtures/experiment-0002/multilingual-indirect-bridge-iso-alpha2.jsonl \
            --model Qwen/Qwen3.5-0.8B \
            --lens-repo neuronpedia/jacobian-lens \
            --lens-revision 4f30bb8c97e696115d4a2ef359923b5005fc860c \
            --lens-file qwen3.5-0.8b/jlens/Salesforce-wikitext/Qwen3.5-0.8B_jacobian_lens.pt \
            --languages en,de \
            --late-layers 18-22 \
            --early-layers 0-4 \
            --strength 1.0 \
            --target-mode all-other \
            --output-dir artifacts/experiment-0002-iso-alpha2-reuse/causal

      - name: Summarize second-function reuse
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pre = json.loads(Path('artifacts/experiment-0002-iso-alpha2-reuse/preflight/summary.json').read_text())
          print('preflight', {
              'evaluated': pre['evaluated_cases'],
              'skipped': pre['skipped_cases'],
              'accuracy': pre['behavior_accuracy'],
              'languages': pre['language_summary'],
          })
          causal_path = Path('artifacts/experiment-0002-iso-alpha2-reuse/causal/summary.json')
          if not causal_path.exists():
              print('causal matrix not executed: behavior gate did not pass')
          else:
              s = json.loads(causal_path.read_text())
              print(f"model={s['model']} revision={s['resolved_model_revision']}")
              print(
                  f"source_cases={s['source_case_count']} target_pairs={s['target_pair_count']} "
                  f"baseline_valid={s['baseline_valid_source_cases']}"
              )
              for name, row in s['conditions'].items():
                  print(name, row)
              print('cross_language_transfer')
              for direction, row in s['cross_language_transfer'].items():
                  print(direction, row)
          PY

      - name: Upload evidence
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-iso-alpha2-reuse-${{ github.run_id }}
          path: artifacts/experiment-0002-iso-alpha2-reuse
          if-no-files-found: error
          retention-days: 14
