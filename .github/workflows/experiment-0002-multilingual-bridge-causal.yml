name: experiment-0002-multilingual-bridge-causal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  multilingual-bridge-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-shot arm
        id: arm
        run: |
          if [ -f .ci/run-experiment-0002-multilingual-bridge-causal ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check harness
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m py_compile tools/jspace_interventions.py
          python -m py_compile tools/run_multilingual_bridge_cloze.py
          python -m py_compile tools/run_qwen35_4b_cross_task_causal.py

      - name: Install CPU PyTorch
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install causal dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'

      - name: Reclaim package-cache disk
        if: steps.arm.outputs.armed == 'true'
        run: |
          rm -rf ~/.cache/pip
          df -h .
          free -h

      - name: Run paired cross-task causal reuse smoke
        if: steps.arm.outputs.armed == 'true'
        run: |
          python tools/run_qwen35_4b_cross_task_causal.py \
            --output-dir artifacts/experiment-0002-qwen35-4b-cross-task-causal

      - name: Summarize causal reuse evidence
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path(
              'artifacts/experiment-0002-qwen35-4b-cross-task-causal/summary.json'
          ).read_text())
          print('model', s['model'], s['resolved_model_revision'])
          print('lens_n_prompts', s['lens_n_prompts'])
          print('intervention_layers', s['intervention_layers'])
          print('baseline_valid_cases', s['baseline_valid_cases'])
          print('record_count', s['record_count'])
          print('function_summary')
          for name, row in s['function_summary'].items():
              print(name, row)
          print('reusable_directions')
          for name, row in s['reusable_directions'].items():
              print(name, row)
          print('promotion_pass', s['promotion_pass'])
          PY

      - name: Upload evidence
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-qwen35-4b-cross-task-causal-${{ github.run_id }}
          path: artifacts/experiment-0002-qwen35-4b-cross-task-causal
          if-no-files-found: error
          retention-days: 14
