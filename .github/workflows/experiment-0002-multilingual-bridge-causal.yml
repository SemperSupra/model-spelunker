name: experiment-0002-multilingual-bridge-causal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  multilingual-bridge-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-shot arm
        id: arm
        run: |
          if [ -f .ci/run-experiment-0002-multilingual-bridge-causal ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check harness
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m py_compile tools/run_multilingual_bridge_cloze.py
          python -m py_compile tools/run_qwen35_4b_jlens_compat.py

      - name: Install CPU PyTorch
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install compatibility dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'

      - name: Reclaim package-cache disk
        if: steps.arm.outputs.armed == 'true'
        run: |
          rm -rf ~/.cache/pip
          df -h .
          free -h

      - name: Run all-fit-position observer diagnostic
        if: steps.arm.outputs.armed == 'true'
        run: |
          python tools/run_qwen35_4b_jlens_compat.py \
            --positions 0 \
            --output-dir artifacts/experiment-0002-qwen35-4b-jlens-all-positions

      - name: Apply observer usefulness gate
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path(
              'artifacts/experiment-0002-qwen35-4b-jlens-all-positions/summary.json'
          ).read_text())
          print('model_class', s['model_class'])
          print('adapter_layout', s['adapter_layout'])
          print('model_shape', s['model_n_layers'], s['model_d_model'])
          print('lens_shape', s['lens_d_model'], s['lens_source_layers'])
          print('lens_n_prompts', s['lens_n_prompts'])
          print('hidden_bridge_best_ranks', s['median_like_best_ranks'])
          print('cases_top20', s['cases_top20'])
          earned = s['compatibility_pass'] and s['cases_top20'] == 4
          print('causal_rep_earned', earned)
          if not earned:
              raise SystemExit('Observer usefulness gate failed; causal rep remains blocked')
          PY

      - name: Upload evidence
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-qwen35-4b-jlens-all-positions-${{ github.run_id }}
          path: artifacts/experiment-0002-qwen35-4b-jlens-all-positions
          if-no-files-found: error
          retention-days: 14
