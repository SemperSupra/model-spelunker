name: serving-fanout-r11-public-bounded-prompt-treatment
on:
  pull_request:
    paths:
      - '.github/workflows/serving-fanout-r11-prompt-treatment-public.yml'
      - 'qualification/serving_fanout_r0/diverse_actor/treatments/**'
permissions:
  contents: read
  packages: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Verify original independent oracles and pinned advisory allowlist
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from qualification.adapters.learning_treatment import load_bundle
          a,b=load_bundle("memory-recall-v1")
          assert a and b.startswith("sha256:")
          for t in ("boundary-bugfix-v0","dle-cold-start-recovery-v0"):
              f=Path("qualification/tasks")/t
              doc=json.loads((f/"task.json").read_text())
              assert doc["id"]==t and (f/"verify.py").is_file()
              assert doc["limits"]["wall_seconds"]<=120
          print("ADVISORY_UNTRUSTED_BUNDLE_AND_VERIFIER_PRESENT")
          PY
  prior-failure-prompt-treatments:
    needs: [source-check]
    strategy:
      fail-fast: false
      max-parallel: 1 # Keep within public-runner ceiling while R10 queue probe runs
      matrix:
        include:
          - task: boundary-bugfix-v0
            hint: inspect-before-claim-v1
            label: r11-debugging-inspect-before-claim
          - task: dle-cold-start-recovery-v0
            hint: memory-recall-v1
            label: r11-dle-untrusted-memory-hint
    uses: ./.github/workflows/openworker-prebuilt-ollama-qualification.yml
    with:
      artifact_ref: 'ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83'
      admission_ref: 'github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json'
      task: ${{ matrix.task }}
      treatment_id: ${{ matrix.label }}
      max_iterations: '6'
      tool_hint_mode: ${{ matrix.hint }}
