name: experiment-0002-probe-swap-calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe-swap-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install experiment dependencies
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'

      - name: Run released probe-swap causal calibration
        run: |
          python tools/run_probe_swap_calibration.py \
            --model EleutherAI/pythia-70m-deduped \
            --lens-repo neuronpedia/jacobian-lens \
            --lens-revision 91271eb5b15a43eebed7bb447618738754f1379a \
            --lens-file pythia-70m-deduped/jlens/Salesforce-wikitext/pythia-70m-deduped_jacobian_lens.pt \
            --strengths 0.5,1.0,2.0 \
            --max-items 90 \
            --output-dir artifacts/experiment-0002-probe-swap-calibration

      - name: Summarize causal calibration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path('artifacts/experiment-0002-probe-swap-calibration/summary.json').read_text()
          )
          for key in (
              'model',
              'resolved_model_revision',
              'published_item_count',
              'scored_item_count',
              'baseline_greedy_correct_count',
              'baseline_prefers_answer_count',
          ):
              print(f'{key}={summary[key]}')
          for name, metrics in summary['conditions'].items():
              print(
                  name,
                  f"causal={metrics['causal_success_count']}",
                  f"pref_flip={metrics['preference_flip_count']}",
                  f"mean_margin_change={metrics['mean_margin_change']:.6f}",
              )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-probe-swap-calibration-${{ github.run_id }}
          path: artifacts/experiment-0002-probe-swap-calibration
          if-no-files-found: error
          retention-days: 14
