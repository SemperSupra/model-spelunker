name: Translation v2 Hosted Screen

on:
  push:
    branches:
      - exp/translation-v2-screen
    paths:
      - ".github/workflows/translation-v2-hosted-screen.yml"
      - "qualification/actors/openworker-deepseek-flash-gha-direct-v2.json"
      - "qualification/experiments/openworker-deepseek-translation-en-de-v2-screen.json"
      - "qualification/tasks/translation-controlled-en-de-v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-v2-hosted-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate task and experiment fixtures
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/tasks/translation-controlled-en-de-v2/verify.py
          python3 qualification/tasks/translation-controlled-en-de-v2/verify.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          task=json.loads(Path("qualification/tasks/translation-controlled-en-de-v2/task.json").read_text())
          actor=json.loads(Path("qualification/actors/openworker-deepseek-flash-gha-direct-v2.json").read_text())
          exp=json.loads(Path("qualification/experiments/openworker-deepseek-translation-en-de-v2-screen.json").read_text())
          assert task["schema_version"] == 2
          assert actor["schema_version"] == 2
          assert exp["schema_version"] == 2
          assert exp["task"]["id"] == task["id"]
          assert exp["actors"] == [actor["id"]]
          assert task["fixture"] == "fixture"
          assert "translation.json" in task["allowed_write_paths"]
          PY

  qualify:
    needs: contract
    environment: hosted-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENWORKER_UPSTREAM_SHA: "5bc10d928e0b64aae74313349a3b17bd19643ae2"
      ACTOR_PROFILE: "qualification/actors/openworker-deepseek-flash-gha-direct-v2.json"
      EXPERIMENT_PROFILE: "qualification/experiments/openworker-deepseek-translation-en-de-v2-screen.json"
      TASK_DIR: "qualification/tasks/translation-controlled-en-de-v2"
      RECEIPT: "/tmp/model-spelunker-translation-v2-receipt.json"
      SNAPSHOT_DIR: "/tmp/model-spelunker-translation-v2-snapshot"
      HOSTED_KEY_FILE: "/tmp/model-spelunker-deepseek.key"
      MODEL_SPELUNKER_MODEL: "deepseek:deepseek-flash"
      MODEL_SPELUNKER_REASONING_EFFORT: "none"
      MODEL_SPELUNKER_MAX_TOKENS: "2048"
      MODEL_SPELUNKER_MAX_ITERATIONS: "4"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Clone immutable OpenWorker source
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker in isolated environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker"

      - name: Stage DeepSeek credential and perform zero-inference admission
        env:
          SELECTED_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo "QUALIFICATION_BOUNDARY=missing-DEEPSEEK_API_KEY"; exit 78; }
          umask 077
          printf '%s' "$SELECTED_API_KEY" > "$HOSTED_KEY_FILE"
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          key=Path(os.environ["HOSTED_KEY_FILE"]).read_text(encoding="utf-8")
          req=urllib.request.Request(
              "https://api.deepseek.com/user/balance",
              headers={"Accept":"application/json","Authorization":"Bearer "+key},
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          if data.get("is_available") is not True:
              raise SystemExit("DeepSeek authenticated but API balance is unavailable")
          print("DEEPSEEK_ADMISSION="+json.dumps({"authenticated":True,"available":True},sort_keys=True))
          PY

      - name: Execute prospective v2 translation screen
        id: qualify
        env:
          SELECTED_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          export DEEPSEEK_API_KEY="$SELECTED_API_KEY"
          set +e
          python3 qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id "gha-linux-x64-openworker-hosted-api" \
            --substrate-profile-commit "$GITHUB_SHA" \
            --experiment "$EXPERIMENT_PROFILE" \
            --snapshot-dir "$SNAPSHOT_DIR" \
            "$TASK_DIR" \
            "$ACTOR_PROFILE" \
            "$RECEIPT" \
            -- "$RUNNER_TEMP/openworker-venv/bin/python" \
              "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e
          unset DEEPSEEK_API_KEY
          echo "qualification_rc=$rc" >> "$GITHUB_OUTPUT"
          test -f "$RECEIPT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ["RECEIPT"]).read_text())
          assert r["schema_version"] == 2
          assert r["experiment"]["id"] == "openworker-deepseek-translation-en-de-v2-screen"
          assert r["candidate"]["deployment_topology"]["transport"] == "provider-api"
          print(json.dumps({
              "run_id":r["run_id"],
              "success":r["observation"]["success"],
              "termination_class":r["observation"].get("termination_class"),
              "model_rounds":(r["observation"].get("workload") or {}).get("model_rounds"),
              "model_calls_started":(r["observation"].get("workload") or {}).get("model_calls_started"),
              "tool_calls":r["observation"].get("tool_calls"),
              "evidence_digest":r["evidence_digest"],
          },sort_keys=True))
          PY

      - name: Upload bounded translation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: translation-v2-${{ github.run_attempt }}
          path: |
            /tmp/model-spelunker-translation-v2-receipt.json
            /tmp/model-spelunker-translation-v2-snapshot/**
          if-no-files-found: warn
          retention-days: 7

      - name: Remove staged provider credential
        if: always()
        run: rm -f "$HOSTED_KEY_FILE"
