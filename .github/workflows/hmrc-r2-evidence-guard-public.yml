name: HMRC R2 immutable-source and exclusive-lease RDTE
on:
  pull_request:
    paths:
      - 'qualification/hmrc_evidence_r2/**'
      - '.github/workflows/hmrc-r2-evidence-guard-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Source-bound exact digest and checkpoint contract
        working-directory: qualification/hmrc_evidence_r2
        run: |
          go vet ./...
          go test -v -count=1 ./...
  adversarial-and-replay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Repeat hostile source/lease/recovery transitions under race detector
        working-directory: qualification/hmrc_evidence_r2
        run: go test -race -v -count=10 -run 'TestReject|TestCannot|TestCrash|TestNo|TestSource' ./...
