name: HMRC R8 source-bound protected context/tool state restart projection
# Adapter qualification only: original R0 policy + R2 evidence + R7
# synthetic ACKED journal. No new memory server, physical cache owner,
# privileged tool, private GitHub source or real model inference.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_rebuild_r8/**'
      - '.github/workflows/hmrc-r8-rebuild-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blue-real-checkpoint-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Restore actual source-backed R0/R2 checkpoint into low-trust harness data view
        working-directory: qualification/hmrc_rebuild_r8
        run: |
          set -euo pipefail
          go vet ./...
          go test -v -count=1 ./...
  red-tamper-tool-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Repeat 24 concurrent projections, forged transcript/source and open-tool negatives
        working-directory: qualification/hmrc_rebuild_r8
        run: |
          set -euo pipefail
          go test -race -count=4 -run 'TestRealSourceBoundCompactionRestartReconstruction|TestOpenToolTransactionNeverCompactsOrReconstructs|TestForgedSourceAndTranscriptReject|TestNoUnverifiedHistoricalMemoryPromotion|TestParallelReadProjectionStable' ./...
