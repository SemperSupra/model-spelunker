name: Cache lifecycle R10 native three-session churn
on:
  pull_request:
    paths: ['.github/workflows/cache-lifecycle-churn-r10.yml']
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LLAMA_REV: a6ac41c757c066941766164439f6876f2deaab04
      MODEL_SHA: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      MODEL_REV: 6dd44a1fb35d11b5d1b28902876ce3cc9e882d0e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned native CPU server and obtain verified public fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-r0"
          cd "$RUNNER_TEMP/cache-r0"
          git init upstream
          git -C upstream remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C upstream fetch --depth=1 origin "$LLAMA_REV"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$LLAMA_REV"
          cmake -S upstream -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build --target llama-server -j 2
          curl --fail --location --retry 2 --max-time 300 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/$MODEL_REV/qwen2.5-0.5b-instruct-q4_k_m.gguf -o model.gguf
          printf '%s  model.gguf\n' "$MODEL_SHA" | sha256sum -c -
          sha256sum build/bin/llama-server model.gguf > identities.txt
          cp upstream/LICENSE upstream-license.txt
      - name: Three sessions over two native slots with budget and live-neighbor checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cache-r0"
          python3 - <<'PY'
          import concurrent.futures as cf
          import hashlib,json,os,pathlib,subprocess,threading,time,urllib.request
          root=pathlib.Path.cwd()
          (root/'slots').mkdir()
          rows=[]
          def receipt():
              (root/'receipt.json').write_text(json.dumps(dict(source=os.environ['LLAMA_REV'],model_sha=os.environ['MODEL_SHA'],model_revision=os.environ['MODEL_REV'],workflow_sha=os.environ['GITHUB_SHA'],scope='public three-session native slot churn; experimental admission budget; no production tenant authorization',rows=rows),indent=2))
          def req(path,data=None):
              body=None if data is None else json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18081'+path,data=body,headers={'Content-Type':'application/json'}),timeout=180) as r:
                  return json.load(r)
          def start():
              log=open(root/'server.log','ab')
              t=time.monotonic()
              p=subprocess.Popen([str(root/'build/bin/llama-server'),'-m',str(root/'model.gguf'),'-c','8192','-np','2','-t','4','-ngl','0','--no-kv-unified','--cache-ram','0','--no-cache-idle-slots','--host','127.0.0.1','--port','18081','--slot-save-path',str(root/'slots')],stdout=log,stderr=log)
              log.close()
              for _ in range(120):
                  if p.poll() is not None:raise RuntimeError('server exited')
                  try:
                      req('/health')
                      slots=req('/slots')
                      assert {x['id'] for x in slots}=={0,1}
                      assert all(x['n_ctx']>=2048 and not x['is_processing'] for x in slots)
                      return p,time.monotonic()-t
                  except OSError:time.sleep(.25)
              p.kill();p.wait()
              raise RuntimeError('readiness timeout')
          def stop(p):
              p.terminate()
              try:p.wait(timeout=10)
              except subprocess.TimeoutExpired:p.kill();p.wait()
              assert p.poll() is not None
          def complete(prompt,n,slot):
              start=time.monotonic()
              r=req('/completion',dict(prompt=prompt,id_slot=slot,n_predict=n,temperature=0,seed=42,cache_prompt=True,return_tokens=True))
              end=time.monotonic()
              return dict(content=r['content'],tokens=r['tokens'],timings=r['timings'],slot_requested=slot,start_s=start,end_s=end,wall_s=end-start)
          def tokenized(s):
              return req('/tokenize',{'content':s,'add_special':False,'parse_special':True})['tokens']
          def pair(sessions,slotmap):
              barrier=threading.Barrier(3)
              observations=[]
              def task(s):
                  barrier.wait(timeout=10)
                  return complete(s['target'],12,slotmap[s['owner']])
              with cf.ThreadPoolExecutor(max_workers=2) as pool:
                  futures={s['owner']:pool.submit(task,s) for s in sessions}
                  barrier.wait(timeout=10)
                  deadline=time.monotonic()+180
                  while not all(f.done() for f in futures.values()):
                      observed=req('/slots')
                      busy=sorted(x['id'] for x in observed if x['is_processing'])
                      if not observations or observations[-1]['busy']!=busy:
                          observations.append(dict(t_s=time.monotonic(),busy=busy))
                      if time.monotonic()>deadline:raise TimeoutError('paired completion deadline')
                      time.sleep(.04)
                  output={key:f.result() for key,f in futures.items()}
              a,b=output.values()
              overlap=max(0,min(a['end_s'],b['end_s'])-max(a['start_s'],b['start_s']))
              return dict(results=output,native_slot_observations=observations,simultaneous_native_slots=any(x['busy']==[0,1] for x in observations),client_overlap_s=overlap,makespan_s=max(a['end_s'],b['end_s'])-min(a['start_s'],b['start_s']))
          def guard(session,ticket):
              path=root/'slots'/session['filename']
              return ticket.get('owner')==session['owner'] and ticket.get('model_sha')==os.environ['MODEL_SHA'] and ticket.get('runtime_sha')==os.environ['LLAMA_REV'] and ticket.get('filename')==session['filename'] and ticket.get('sha256')==session['snapshot_sha'] and path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==session['snapshot_sha']
          def erase(slot):
              assert not next(x for x in req('/slots') if x['id']==slot)['is_processing']
              return req(f'/slots/{slot}?action=erase',{})
          def session(owner,expected,position):
              lines=[f'Parcel {k:04d} has status archived and category blue.' for k in range(64)]
              lines.insert(position,f'The special parcel ORCHID has access code {expected}.')
              prefix='<|im_start|>system\nAnswer questions using the supplied inventory. Output only the requested code.<|im_end|>\n<|im_start|>user\nInventory:\n'+'\n'.join(lines)+'\n'
              suffix='What is the access code of the special parcel ORCHID? Reply only with the code.<|im_end|>\n<|im_start|>assistant\n'
              target=tokenized(prefix+suffix)
              shared=0
              for a,b in zip(tokenized(prefix),target):
                  if a!=b:break
                  shared+=1
              assert 0<shared<len(target)<2048
              return dict(owner=owner,expected=expected,target=target,shared_prefix_tokens=shared)
          def matches(s,actual):
              return actual['content'].strip()==s['expected'] and actual['tokens']==s['cold']['tokens'] and actual['content']==s['cold']['content']
          for i in range(3):
              row=dict(rep=i)
              rows.append(row)
              p,st=start()
              row.update(pid=p.pid,startup_s=st)
              try:
                  ss=[session(k,code,[0,32,64][(i+j)%3]) for j,(k,code) in enumerate(zip(['a','b','c'],['314159','271828','161803']))]
                  a,b,c=ss
                  row['sessions']=ss
                  for s in ss:
                      erase(0)
                      s['cold']=complete(s['target'],12,0)
                      assert s['cold']['content'].strip()==s['expected'] and s['cold']['timings']['cache_n']==0
                  erase(0);erase(1)
                  seed=complete(a['target'][:a['shared_prefix_tokens']],1,0)
                  assert len(seed['tokens'])==1
                  # Save the idle A slot while B has a real native request in flight.
                  name=f'rep-{i}-a.bin'
                  stage=f'rep-{i}-a.partial'
                  snapshot=root/'slots'/name
                  with cf.ThreadPoolExecutor(max_workers=1) as pool:
                      neighbor=pool.submit(complete,b['target'],12,1)
                      observed=None
                      until=time.monotonic()+15
                      while time.monotonic()<until and not neighbor.done():
                          state=req('/slots')
                          if next(x for x in state if x['id']==1)['is_processing']:
                              observed=state;break
                          time.sleep(.02)
                      assert observed is not None and not next(x for x in observed if x['id']==0)['is_processing']
                      begin=time.monotonic()
                      saved=req('/slots/0?action=save',{'filename':stage})
                      tmp=root/'slots'/stage
                      with tmp.open('rb') as stream:
                          data=stream.read()
                          os.fsync(stream.fileno())
                      assert saved['n_saved']==a['shared_prefix_tokens'] and saved['n_written']==len(data)
                      os.replace(tmp,snapshot)
                      fd=os.open(root/'slots',os.O_RDONLY|os.O_DIRECTORY)
                      try:os.fsync(fd)
                      finally:os.close(fd)
                      end=time.monotonic()
                      b_first=neighbor.result(timeout=180)
                  a.update(filename=name,snapshot_sha=hashlib.sha256(data).hexdigest(),saved=saved,generation=1)
                  row['checkpoint']=dict(bytes=len(data),wall_s=end-begin,busy_at_request=observed,overlap_s=max(0,min(end,b_first['end_s'])-max(begin,b_first['start_s'])))
                  assert matches(b,b_first) and row['checkpoint']['overlap_s']>0
                  # Admit a single persisted generation. C replaces A while B stays resident.
                  budget=len(data)
                  erase(0)
                  c_first=complete(c['target'],12,0)
                  assert matches(c,c_first) and c_first['timings']['cache_n']==0
                  occupied=sum(x.stat().st_size for x in (root/'slots').glob('*.bin'))
                  assert occupied==budget
                  row['budget_denial']=dict(capacity_bytes=budget,occupied_bytes=occupied,minimum_positive_required_bytes=1,native_save_called=False,denied=occupied+1>budget)
                  assert row['budget_denial']['denied']
                  assert hashlib.sha256(snapshot.read_bytes()).hexdigest()==a['snapshot_sha']
                  ticket=dict(owner='a',model_sha=os.environ['MODEL_SHA'],runtime_sha=os.environ['LLAMA_REV'],filename=name,sha256=a['snapshot_sha'],generation=1)
                  def eligible(t):
                      return t.get('generation')==a['generation'] and guard(a,t)
                  assert eligible(ticket)
                  assert not eligible(dict(ticket,generation=0))
                  assert not eligible(dict(ticket,owner='c'))
                  erase(0)
                  restored=req('/slots/0?action=restore',{'filename':name})
                  assert restored['n_restored']==a['shared_prefix_tokens']
                  row['restored']=restored
                  resumed=pair([a,b],{'a':0,'b':1})
                  row['resume_pair']=resumed
                  for s in [a,b]:
                      actual=resumed['results'][s['owner']]
                      assert matches(s,actual) and actual['timings']['cache_n']>0 and actual['timings']['prompt_n']<s['cold']['timings']['prompt_n']
                  # Consume only after verified continuation. Old tickets must fail.
                  snapshot.unlink()
                  a['generation']=2
                  assert not eligible(ticket) and not snapshot.exists()
                  row['consumed_ticket_rejected']=True
                  erase(0)
                  c_again=complete(c['target'],12,0)
                  assert matches(c,c_again) and c_again['timings']['cache_n']==0
                  row['c_cold_after_budget_refusal']=c_again
                  row['b_first']=b_first
                  row['c_first']=c_first
                  row['passed']=True
              finally:stop(p);receipt()
          assert len(rows)==3 and all(r.get('passed') for r in rows)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llama-cache-churn-r10
          path: |
            ${{ runner.temp }}/cache-r0/receipt.json
            ${{ runner.temp }}/cache-r0/identities.txt
            ${{ runner.temp }}/cache-r0/upstream-license.txt
            ${{ runner.temp }}/cache-r0/server.log
          if-no-files-found: warn
          retention-days: 14
