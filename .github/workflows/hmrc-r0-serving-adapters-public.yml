name: HMRC R0 public serving telemetry qualification
# Issue #306 separate workcell. Public httptest fixtures only; no sovereign
# model connection, credentials, paid model API, physical KV actions or actuator.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_telemetry_r0/**'
      - '.github/workflows/hmrc-r0-serving-adapters-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Source-only API and telemetry fidelity
        working-directory: qualification/hmrc_telemetry_r0
        run: |
          go vet ./...
          go test -v -count=1 ./...

  adversarial:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Race and repeated negative contract tests
        working-directory: qualification/hmrc_telemetry_r0
        run: go test -race -v -count=10 -run 'TestReject|TestDoNot|TestCancel|TestUnknown' ./...


  native-ollama-loopback:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_CONTEXT_LENGTH: '32768'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Install exact archived runtime from existing qualified public recipe
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$runtime"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Verify actual native Ollama running model context via adapter
        shell: bash
        working-directory: qualification/hmrc_telemetry_r0
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/hmrc-public-models"
          mkdir -p "$OLLAMA_MODELS"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            ollama serve >"$RUNNER_TEMP/hmrc-ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as r:
              models=json.load(r)["models"]
          m=next((m for m in models if m["name"]==os.environ["OLLAMA_MODEL_TAG"]),None)
          assert m and m["digest"].removeprefix("sha256:").startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"])
          print("PINNED_MODEL_DIGEST_VERIFIED=YES")
          PY
          curl --fail --silent --show-error --max-time 150 \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3:1.7b","prompt":"Respond with OK.","stream":false,"keep_alive":"5m","options":{"num_predict":4}}' \
            "http://$OLLAMA_HOST/api/generate" >"$RUNNER_TEMP/hmrc-native-warm.json"
          go run ./cmd/probe >hmrc-native-ollama-observation.json
          python3 - <<'PY'
          import json
          o=json.load(open("hmrc-native-ollama-observation.json"))
          assert o["Schema"]=="hmrc-telemetry-r0" and o["Engine"]=="ollama"
          assert o["KVCachePressure"] is None and o["PromptCacheHitRate"] is None
          models=[m for m in o["Models"] if m["Name"]=="qwen3:1.7b"]
          assert models and models[0]["ReportedContextTokens"]>0
          print("REAL_NATIVE_OLLAMA_PS=PASS, REPORTED_CONTEXT_TOKENS="+str(models[0]["ReportedContextTokens"]))
          print("PHYSICAL_KV_METRICS=UNKNOWN, AGENT_TASK=NOT_RUN")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hmrc-native-ollama-context
          path: qualification/hmrc_telemetry_r0/hmrc-native-ollama-observation.json
          if-no-files-found: ignore
          retention-days: 14
