name: Persona OpenWorker RTL 1024 Diagnostic

on:
  pull_request:
    branches:
      - exp/persona-openworker-reasoning-none
    paths:
      - "qualifications/persona-openworker-001/**"
      - ".github/workflows/persona-openworker-portability.yml"

permissions:
  contents: read

jobs:
  openworker-rtl-1024-diagnostic:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'exp/persona-openworker-rtl-1024'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run bounded OpenWorker RTL 1024 diagnostic
        id: diagnostic
        shell: bash
        env:
          RESULT_DIR: ${{ runner.temp }}/persona-openworker-rtl-1024-result
        run: |
          mkdir -p "$RESULT_DIR"
          cd qualifications/persona-openworker-001
          set +e
          SEALED_RESULT_DIR="$RESULT_DIR" bash run.sh
          rc=$?
          set -e
          echo "task_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "${RUNNER_TEMP}/persona-openworker-ollama/ollama.log" ]; then
            cp "${RUNNER_TEMP}/persona-openworker-ollama/ollama.log" "$RESULT_DIR/ollama.log"
          fi
          exit 0

      - name: Upload RTL 1024 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persona-openworker-rtl-1024
          path: ${{ runner.temp }}/persona-openworker-reasoning-result
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Preserve execution verdict
        if: always()
        shell: bash
        env:
          TASK_RC: ${{ steps.diagnostic.outputs.task_rc }}
        run: |
          test -n "$TASK_RC" || exit 1
          exit "$TASK_RC"
