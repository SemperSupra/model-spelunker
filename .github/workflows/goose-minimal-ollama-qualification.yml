name: Goose Minimal Ollama Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goose-minimal-ollama-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Projected Goose + Qwen3 1.7B
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOSE_SHA: '2090ad1c65ddb39497601a936a9fe17d66254bfe'
      GOOSE_VERSION: '1.51.0'
      RUST_TOOLCHAIN: '1.96.1'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: '/tmp/goose-qualification-target'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_BIND: '127.0.0.1:11434'
      GOOSE_OLLAMA_HOST: 'http://127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-goose-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      MODEL_SPELUNKER_MODEL: 'qwen3:1.7b'
      CANDIDATE_META: '/tmp/model-spelunker-goose-candidate.json'
      RECEIPT: '/tmp/model-spelunker-goose-receipt.json'
      DIAGNOSTICS: '/tmp/model-spelunker-goose-diagnostics.json'
      GOOSE_XDG_CONFIG_HOME: '/tmp/model-spelunker-goose-config'
      GOOSE_XDG_DATA_HOME: '/tmp/model-spelunker-goose-data'
      SUBSTRATE_PROFILE_COMMIT: '4f064a8b06bff7ebea0c1286bee47ead6adee6de'
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and clone Goose
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          git clone --quiet --filter=blob:none https://github.com/aaif-goose/goose.git "$RUNNER_TEMP/goose"
          git -C "$RUNNER_TEMP/goose" checkout --quiet --detach "$GOOSE_SHA"
          test "$(git -C "$RUNNER_TEMP/goose" rev-parse HEAD)" = "$GOOSE_SHA"

      - name: Build minimum viable Goose CLI
        shell: bash
        working-directory: ${{ runner.temp }}/goose
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/goose-build-time.txt" \
            cargo build --locked --release -p goose-cli --bin goose \
              --no-default-features --features rustls-tls
          bin="$CARGO_TARGET_DIR/release/goose"
          test -x "$bin"
          "$bin" --version
          echo "GOOSE_BIN=$bin" >> "$GITHUB_ENV"
          echo "GOOSE_BINARY_SHA256=$(sha256sum "$bin" | awk '{print $1}')"
          echo "GOOSE_BINARY_BYTES=$(stat -c %s "$bin")"
          tail -n 30 "$RUNNER_TEMP/goose-build-time.txt"

      - name: Install pinned Ollama and hydrate exact model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$OLLAMA_MODELS" "$GOOSE_XDG_CONFIG_HOME" "$GOOSE_XDG_DATA_HOME"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          OLLAMA_HOST="$OLLAMA_BIND" nohup "$runtime/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &

          for attempt in $(seq 1 60); do
            curl --fail --silent "http://$OLLAMA_BIND/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_BIND/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_BIND" "$runtime/bin/ollama" pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path

          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_BIND']}/api/tags", timeout=10) as response:
              data=json.load(response)
          wanted=os.environ["OLLAMA_MODEL_TAG"]
          row=next((m for m in data.get("models",[]) if m.get("name")==wanted),None)
          if row is None:
              raise SystemExit(f"model not present: {wanted}")
          digest=str(row.get("digest") or "").removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")

          binary=Path(os.environ["GOOSE_BIN"])
          binary_digest=hashlib.sha256(binary.read_bytes()).hexdigest()
          candidate={
              "harness":{"name":"goose","version":os.environ["GOOSE_VERSION"]},
              "model":{
                  "provider":"ollama",
                  "id":wanted,
                  "artifact_ref":f"ollama-sha256:{digest}",
              },
              "toolset":["developer"],
              "build":{
                  "kind":"source",
                  "profile":"no-default-features+rustls-tls",
                  "source_revision":os.environ["GOOSE_SHA"],
                  "toolchain":"rust 1.96.1",
                  "default_features":False,
                  "features":["rustls-tls"],
                  "artifact_digest":f"sha256:{binary_digest}",
              },
              "configuration":{
                  "provider":"ollama",
                  "thinking_effort":"off",
                  "mode":"auto",
                  "no_session":True,
                  "no_profile":True,
                  "builtins":["developer"],
                  "max_turns":4,
                  "max_tool_repetitions":2,
                  "output_format":"stream-json",
                  "ollama_context_length":int(os.environ["OLLAMA_CONTEXT_LENGTH"]),
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(
              json.dumps(candidate,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps({"model_digest":digest,"goose_binary_digest":binary_digest},sort_keys=True))
          PY

      - name: Run harness-neutral task through projected Goose
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-goose-minimal-ollama \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            --diagnostics "$DIAGNOSTICS" \
            qualification/tasks/text-repair-v0 \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- python3 "$GITHUB_WORKSPACE/qualification/adapters/goose_cli.py"
          qualification_rc=$?
          set -e

          test -f "$RECEIPT"
          QUALIFICATION_RC="$qualification_rc" python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          rc=int(os.environ["QUALIFICATION_RC"])
          assert receipt["candidate"]["harness"]["name"]=="goose"
          assert receipt["candidate"]["model"]["id"]==os.environ["OLLAMA_MODEL_TAG"]
          assert receipt["candidate"]["build"]["profile"]=="no-default-features+rustls-tls"
          assert rc==(0 if receipt["observation"]["success"] else 1)
          print(json.dumps(receipt,sort_keys=True))
          print("QUALIFICATION_RESULT=" + ("PASS" if receipt["observation"]["success"] else "FAIL (valid observation)"))
          PY

          echo '=== bounded candidate diagnostics ==='
          cat "$DIAGNOSTICS"
          echo '=== bounded Ollama timing diagnostics ==='
          grep -E 'prompt processing|prompt eval|eval rate|total duration|load duration|prompt_eval|eval_count|processing task|new prompt' "$RUNNER_TEMP/ollama.log" | tail -n 120 || true

      - name: Show bounded Ollama diagnostics on infrastructure failure
        if: failure()
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/ollama.log" || true
