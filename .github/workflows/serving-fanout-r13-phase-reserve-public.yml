name: serving-fanout-r13-phase-reserve-public
# Existing Model Spelunker #316 experiment, stacked on R5 streaming.
# Public CPU inference and cross-platform source oracles only.
on:
  pull_request:
    paths:
      - 'qualification/serving_fanout_r0/phase_budget_r13/**'
      - '.github/workflows/serving-fanout-r13-phase-reserve-public.yml'
permissions:
  contents: read
jobs:
  reducer-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deterministic source and adversarial resource-oracle checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/serving_fanout_r0/phase_budget_r13 -p 'test_*.py' -v
          python3 -m py_compile qualification/serving_fanout_r0/phase_budget_r13/*.py
  pinned-ollama-cpu:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/r13-public-models'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: RED/BLUE before physical measurement
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/serving_fanout_r0/phase_budget_r13 -p 'test_*.py' -v
      - name: Hydrate previously pinned public CPU runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --location --silent --show-error --retry 3 "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" --output "$archive"
          echo "$OLLAMA_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama-r13"
          zstd -d --stdout "$archive" | tar -xf - -C "$RUNNER_TEMP/ollama-r13"
          echo "$RUNNER_TEMP/ollama-r13/bin" >> "$GITHUB_PATH"
      - name: Model load and 1-vs-2 actual CPU serving treatments
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" OLLAMA_NUM_PARALLEL=2 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_CONTEXT_LENGTH=2048 ollama serve > "$RUNNER_TEMP/ollama-r13.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull qwen3:1.7b
          python3 qualification/serving_fanout_r0/phase_budget_r13/capture_public_cpu.py --out /tmp/r13-ollama.json --resources /tmp/r13-resource.json
          python3 qualification/serving_fanout_r0/phase_budget_r13/phase_budget.py --input /tmp/r13-ollama.json --resources /tmp/r13-resource.json --out /tmp/r13-reduced.json --required cpu,memory --reserve .25 --ttft-slo-ms 3000
      - name: Independent receipt coherence and nonpromotion check
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/r13-reduced.json'))
          p=json.load(open('/tmp/r13-ollama.json'))
          assert len(r['cells']) == 2
          assert set(c['client_concurrency'] for c in r['cells']) == {1,2}
          assert r['runtime_model_digest']==p['runtime_model_digest']
          assert all(c['prefill_tps_engine_sum_ratio'] is not None for c in r['cells'])
          assert all(c['decode_tps_engine_sum_ratio'] is not None for c in r['cells'])
          assert r['goodput_verified_tasks_per_hour'] is None
          assert all(c['route_qualified'] is False for c in r['cells'])
          print('PASS real public CPU phase accounting and nonpromotion; task goodput UNKNOWN')
          for c in r['cells']:
              print('R13 cell='+c['cell_id']+' TTFT_P95_ms='+str(round(c['ttft_p95_ms'],1))+
                    ' PREFILL_tok_s='+str(c['prefill_tps_engine_sum_ratio'])+
                    ' DECODE_tok_s='+str(c['decode_tps_engine_sum_ratio'])+
                    ' RESERVE='+c['resource_headroom']['status'])
          PY
      - name: Preserve bounded evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serving-fanout-r13-phase-resource
          path: |
            /tmp/r13-ollama.json
            /tmp/r13-resource.json
            /tmp/r13-reduced.json
          retention-days: 14
          if-no-files-found: ignore
