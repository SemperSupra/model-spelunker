name: OpenWorker Nemotron Ultra Free Transfer / Discovery

# Exactly one different task work sample for a previously PASSed actor.
# Provider-ready and zero-price gates live inside the trusted reusable workcell.
# Failure to access the provider is censored, never invented as a semantic FAIL.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openworker-nemotron-ultra-free-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: openworker-nemotron-ultra-free-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interview:
    uses: ./.github/workflows/openworker-hosted-api-qualification.yml
    with:
      candidate: openrouter-nvidia-nemotron3-ultra-free
      task: validation-discovery-v0
      max_iterations: '8'
    secrets: inherit

  report:
    if: always()
    needs: [interview]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve bounded task receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nemotron-transfer-receipts"
          if ! gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "hosted-qualification-openrouter-nvidia-nemotron3-ultra-free-validation-discovery-v0-${GITHUB_RUN_ID}" \
            --dir "$RUNNER_TEMP/nemotron-transfer-receipts"; then
            echo "No qualified task receipt: NO_RECEIPT, not semantic model failure."
          fi

      - name: Return distinct task result directly to DLE
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/report_openrouter_free_interviews.py \
            --receipts-dir "$RUNNER_TEMP/nemotron-transfer-receipts" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --expected-model "nvidia/nemotron-3-ultra-550b-a55b:free" \
            --expected-task validation-discovery-v0 \
            --expected-max-iterations 8
