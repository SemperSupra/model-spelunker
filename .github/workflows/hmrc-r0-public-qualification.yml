name: HMRC R0 public coordination qualification
# Issue #306; public synthetic work only. No model, private endpoint, secret,
# actuator, paid API, or sovereign guest admission. Separate independent lanes.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_r0/**'
      - '.github/workflows/hmrc-r0-public-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Deterministic contract, transaction, and exact recovery checks
        working-directory: qualification/hmrc_r0
        run: go test -v -count=1 ./...

  adversarial-concurrency:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Repeated adversarial race, rollback and poisoning guards
        working-directory: qualification/hmrc_r0
        run: |
          go test -race -v -count=10 -run 'TestReject|TestRollback|TestRecovery|TestConcurrent|TestPredictive' ./...

  predictive-simulation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Deterministic forecast-vs-current-only synthetic comparison
        working-directory: qualification/hmrc_r0
        run: |
          go test -v -count=1 -run '^TestSyntheticPressureCrossover$' ./...
          go test -run '^$' -bench '^BenchmarkPropose$' -benchtime=100x ./...

  existing-memory-reference:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse existing source-neutral SQLite FTS baseline, no extra harness
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/memory_stress_fts_baseline.py --self-test
          python3 qualification/memory_stress_fts_baseline.py --out hmrc-memory-reference.json
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("hmrc-memory-reference.json").read_text())
          assert r["synthetic_only"] is True
          assert r["native_vendor_executed"] is False
          assert r["llm_inference_executed"] is False
          assert r["memory_effectiveness_qualified"] is False
          assert len(r["rows"])==6
          print("PASS source-only memory baseline; not harness/LLM lift")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hmrc-r0-memory-reference
          path: hmrc-memory-reference.json
          if-no-files-found: ignore
          retention-days: 14
