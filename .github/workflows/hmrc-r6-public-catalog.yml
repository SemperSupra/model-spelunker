name: HMRC R6 public pinned GitHub source bootstrap qualification
# Only a PUBLIC synthetic GitHub fixture. No private GitHub access, token,
# production source/authentication, model, tool action, or paid runner.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_catalog_r6/**'
      - '.github/workflows/hmrc-r6-public-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-source-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Exact Git blob and hostile path/redirect/content red-team
        working-directory: qualification/hmrc_catalog_r6
        run: |
          go vet ./...
          go test -v -race -count=4 ./...
  read-only-public-github-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Actual external HTTPS GitHub API pinned public file proof
        working-directory: qualification/hmrc_catalog_r6
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/probe >hmrc-public-source-receipt.json
          python3 - <<'PY'
          import json
          with open("hmrc-public-source-receipt.json") as f:
              d=json.load(f)
          assert d["schema"]=="hmrc-public-pinned-catalog-r6"
          assert d["repository"]=="SemperSupra/model-spelunker"
          assert d["git_blob_sha1"]=="4f39a993bf9e8b32a4d8c244769c2dccd70e21b2"
          assert 0 < d["source_bytes"] <= 20000
          assert d["public_synthetic_only"] is True
          assert d["production_dle_authenticated"] is False
          print("LIVE_PINNED_PUBLIC_SOURCE=PASS, PRODUCTION_DLE_TRUST=NOT_RUN")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hmrc-r6-public-source-pin
          path: qualification/hmrc_catalog_r6/hmrc-public-source-receipt.json
          retention-days: 14
          if-no-files-found: ignore
