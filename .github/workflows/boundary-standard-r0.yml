name: Boundary standard subset R0
on:
  pull_request:
    paths:
      - '.github/workflows/boundary-standard-r0.yml'
permissions:
  contents: read
jobs:
  cpu:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialize pinned localhost inference
        run: |
          mkdir -p "$RUNNER_TEMP/ollama"
          curl -fLsS --retry 3 https://github.com/ollama/ollama/releases/download/v0.34.1/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/ollama.tar.zst" | tar -xf - -C "$RUNNER_TEMP/ollama"
      - name: Execute bounded synthetic or public benchmark tasks
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_CONTEXT_LENGTH: '8192'
        run: |
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          export OLLAMA_MODELS="$RUNNER_TEMP/models"
          ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          ollama pull qwen3:1.7b
          curl -fLsS --retry 3 https://raw.githubusercontent.com/paul-rottger/xstest/d7bb5bd738c1fcbc36edd83d5e7d1b71a3e2d84d/xstest_prompts.csv -o "$RUNNER_TEMP/xstest.csv"
          curl -fLsS --retry 3 https://raw.githubusercontent.com/ShishirPatil/gorilla/6ea57973c7a6097fd7c5915698c54c17c5b1b6c8/berkeley-function-call-leaderboard/bfcl_eval/data/BFCL_v4_irrelevance.json -o "$RUNNER_TEMP/bfcl.jsonl"
          python3 - <<'PY'
          import json, time, hashlib, urllib.request, pathlib, os
          base="http://127.0.0.1:11434"
          digest="8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7"
          with urllib.request.urlopen(base+"/api/tags",timeout=10) as r:
              assert any(m["name"]=="qwen3:1.7b" and m["digest"].removeprefix("sha256:")==digest for m in json.load(r)["models"])
          def chat(messages,tools=None,seed=19):
              q={"model":"qwen3:1.7b","messages":messages,"stream":False,"think":False,"options":{"temperature":0,"seed":seed,"num_predict":192,"num_ctx":8192}}
              if tools is not None: q["tools"]=tools
              t=time.perf_counter()
              req=urllib.request.Request(base+"/api/chat",data=json.dumps(q).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=75) as r: out=json.load(r)
              metrics={k:out.get(k) for k in ("prompt_eval_count","eval_count","prompt_eval_duration","eval_duration","load_duration")}
              metrics["wall_s"]=time.perf_counter()-t
              return out["message"],metrics
          import csv, re
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          xs=tmp/"xstest.csv"; bf=tmp/"bfcl.jsonl"
          # Rottger et al., NAACL 2024, https://aclanthology.org/2024.naacl-long.301/
          ids={"1","2","5","6","7","9","10","11","12","13","23","24"}
          selected=[r for r in csv.DictReader(xs.open()) if r["id"] in ids]
          assert {r["id"] for r in selected}==ids and all(r["label"]=="safe" for r in selected)
          receipt={"scope":"bounded original benign XSTest and adapted BFCL no-call observations; no official aggregate score","model_digest":digest,"xstest_source":"d7bb5bd738c1fcbc36edd83d5e7d1b71a3e2d84d","bfcl_source":"6ea57973c7a6097fd7c5915698c54c17c5b1b6c8","source_sha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in (xs,bf)},"xstest":[],"bfcl":[]}
          def shape(v):
              if isinstance(v,dict): return {k:({"dict":"object","float":"number","integer":"integer"}.get(x,x) if k=="type" and isinstance(x,str) else shape(x)) for k,x in v.items()}
              if isinstance(v,list): return [shape(x) for x in v]
              return v
          try:
              for r in selected:
                  msg,m=chat([{"role":"user","content":r["prompt"]}])
                  row={"id":r["id"],"type":r["type"],"response":msg.get("content",""),"metrics":m,"verdict":"REVIEW_REQUIRED"}
                  receipt["xstest"].append(row)
                  print("XSTEST_BENIGN="+json.dumps(row),flush=True)
              bfids={f"irrelevance_{i}" for i in range(8)}
              rows=[json.loads(l) for l in bf.read_text().splitlines() if l.strip()]
              rows=[r for r in rows if r["id"] in bfids]
              assert {r["id"] for r in rows}==bfids
              for r in rows:
                  names={}
                  tools=[]
                  for f in r["function"]:
                      name=re.sub(r"[^A-Za-z0-9_-]","_",f["name"])
                      assert name not in names
                      names[name]=f["name"]
                      tools.append({"type":"function","function":{"name":name,"description":f["description"],"parameters":shape(f["parameters"])}})
                  msg,m=chat(r["question"][0],tools)
                  row={"id":r["id"],"mapped_names":names,"tool_call_count":len(msg.get("tool_calls") or []),"response":msg.get("content",""),"metrics":m,"no_call":not msg.get("tool_calls"),"answer_correctness":"NOT_ADJUDICATED"}
                  receipt["bfcl"].append(row)
                  print("BFCL_NO_CALL="+json.dumps(row),flush=True)
          finally:
              pathlib.Path("boundary-standard-receipt.json").write_text(json.dumps(receipt,indent=2))
          assert len(receipt["xstest"])==12 and len(receipt["bfcl"])==8
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-standard-r0
          path: boundary-standard-receipt.json
          retention-days: 7
