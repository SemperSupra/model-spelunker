name: Qualification unique-goodput controls R0
on:
  pull_request:
    paths:
      - 'qualification/unique_goodput_r0/**'
      - '.github/workflows/qualification-unique-goodput-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python qualification/unique_goodput_r0/prove.py proof-evidence
      - name: Exact existing purpose-gate source
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: e01282cef01c77bb685bf4062f453b9e1cdca998
          path: peer-purpose
          persist-credentials: false
      - name: Exact existing resource-gate source
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 355195c5ca90673665b32736e7ab70973b2ca531
          path: peer-resource
          persist-credentials: false
      - name: Compose gates against the same actual receipts
        if: matrix.os == 'ubuntu-24.04'
        run: python qualification/unique_goodput_r0/composition.py proof-evidence peer-purpose peer-resource composition-evidence
      - name: Exact existing workbench source
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ff176a3e3616b725fc48c71c3ee130f6ec350baa
          path: peer-workbench
          persist-credentials: false
      - name: Exercise exact adaptive workbench and evidence composition
        if: matrix.os == 'ubuntu-24.04'
        run: python qualification/unique_goodput_r0/workbench_join.py proof-evidence composition-evidence peer-purpose peer-resource peer-workbench workbench-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: adaptive-workbench-join-r0
          path: workbench-evidence
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: exact-gate-composition-r0
          path: composition-evidence
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unique-goodput-r0-${{ matrix.os }}
          path: proof-evidence
          retention-days: 7
  paired-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python qualification/unique_goodput_r0/paired_acceptance.py paired-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paired-acceptance-r0-${{ matrix.os }}
          path: paired-evidence
          retention-days: 7
