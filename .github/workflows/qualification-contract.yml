name: Qualification Contract Check

on:
  pull_request:
    paths:
      - 'qualification/**'
      - '.github/workflows/qualification-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1

      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          text_task = json.loads(Path("qualification/tasks/text-repair-v0/task.json").read_text())
          text_task_v1 = json.loads(Path("qualification/tasks/text-repair-v1/task.json").read_text())
          discovery_task = json.loads(Path("qualification/tasks/validation-discovery-v0/task.json").read_text())
          debugging_task = json.loads(Path("qualification/tasks/boundary-bugfix-v0/task.json").read_text())
          reconciliation_task = json.loads(Path("qualification/tasks/repository-reconciliation-v0/task.json").read_text())
          api_boundary_task = json.loads(Path("qualification/tasks/api-boundary-classification-v0/task.json").read_text())
          method_ir_task = json.loads(Path("qualification/tasks/method-ir-siglip2-b16-256-v0/task.json").read_text())
          api_boundary_task_v1 = json.loads(Path("qualification/tasks/api-boundary-classification-v1/task.json").read_text())
          method_ir_task_v1 = json.loads(Path("qualification/tasks/method-ir-siglip2-b16-256-v1/task.json").read_text())
          method_ir_task_v2 = json.loads(Path("qualification/tasks/method-ir-siglip2-b16-256-v2/task.json").read_text())
          method_ir_task_v3 = json.loads(Path("qualification/tasks/method-ir-siglip2-b16-256-v3/task.json").read_text())
          json.loads(Path("qualification/test-candidate.json").read_text())
          hosted = json.loads(Path("qualification/models/hosted-api.json").read_text())
          schema = json.loads(Path("qualification/run-receipt.schema.json").read_text())
          actor_schema = json.loads(Path("qualification/actor-profile.schema.json").read_text())
          experiment_schema = json.loads(Path("qualification/experiment.schema.json").read_text())
          task_schema = json.loads(Path("qualification/task-profile.schema.json").read_text())
          harness_build_schema = json.loads(Path("qualification/harness-build-receipt.schema.json").read_text())
          harness_admission_schema = json.loads(Path("qualification/harness-admission-receipt.schema.json").read_text())
          launch_packet_schema = json.loads(Path("qualification/portable-launch-packet.schema.json").read_text())

          candidates = hosted["candidates"]
          assert set(candidates) == {
              "deepseek-flash",
              "groq-gpt-oss-20b",
              "google-gemini-3.7-flash",
              "nvidia-nemotron-3.5-lightning",
              "openrouter-free-router",
              "openrouter-groq-gpt-oss-20b-byok",
              "openrouter-deepseek-v41-flash-byok",
          }
          assert candidates["deepseek-flash"]["provider"] == "deepseek"
          assert candidates["groq-gpt-oss-20b"]["provider"] == "groq"
          assert candidates["google-gemini-3.7-flash"]["provider"] == "google"
          assert candidates["nvidia-nemotron-3.5-lightning"]["provider"] == "nvidia"
          assert candidates["openrouter-free-router"]["provider"] == "openrouter"
          assert candidates["openrouter-groq-gpt-oss-20b-byok"]["provider"] == "openrouter"
          assert candidates["openrouter-groq-gpt-oss-20b-byok"]["extra_body"]["provider"]["only"] == ["groq"]
          assert candidates["openrouter-groq-gpt-oss-20b-byok"]["extra_body"]["provider"]["allow_fallbacks"] is False
          assert candidates["openrouter-deepseek-v41-flash-byok"]["provider"] == "openrouter"
          assert candidates["openrouter-deepseek-v41-flash-byok"]["extra_body"]["provider"]["only"] == ["deepseek"]
          assert candidates["openrouter-deepseek-v41-flash-byok"]["extra_body"]["provider"]["allow_fallbacks"] is False
          assert candidates["openrouter-free-router"]["treatment_kind"] == "router"
          assert candidates["openrouter-free-router"]["model"] == "openrouter/free"
          for candidate_id, candidate in candidates.items():
              assert candidate["treatment_kind"] in {"model", "router"}
              assert "secret" not in candidate, candidate_id
              assert "admission" not in candidate, candidate_id
          assert text_task["task_class"] == "software.bounded-repair"
          assert text_task_v1["task_class"] == "software.bounded-repair"
          assert text_task_v1["schema_version"] == 2
          assert {row["evidence_role"] for row in text_task_v1["ksa_requirements"]} == {"composite", "supporting"}
          assert discovery_task["task_class"] == "repository.capability-discovery"
          assert debugging_task["task_class"] == "software.bounded-debugging"
          assert reconciliation_task["task_class"] == "repository.state-reconciliation"
          assert api_boundary_task["task_class"] == "reverse-engineering.api-boundary-classification"
          assert method_ir_task["task_class"] == "research.method-evidence-binding"
          assert api_boundary_task_v1["task_class"] == api_boundary_task["task_class"]
          assert method_ir_task_v1["task_class"] == method_ir_task["task_class"]
          assert text_task["allowed_write_paths"] == ["value.txt"]
          assert discovery_task["allowed_write_paths"] == ["result.json"]
          assert debugging_task["allowed_write_paths"] == ["src/retry.py"]
          assert reconciliation_task["allowed_write_paths"] == ["reconciliation.json"]
          assert api_boundary_task["allowed_write_paths"] == ["classification.json"]
          assert method_ir_task["allowed_write_paths"] == ["method_ir.json"]
          assert api_boundary_task_v1["allowed_write_paths"] == ["classification.json"]
          assert method_ir_task_v1["allowed_write_paths"] == ["method_ir.json"]
          jsonschema.Draft7Validator.check_schema(schema)
          jsonschema.Draft7Validator.check_schema(actor_schema)
          jsonschema.Draft7Validator.check_schema(experiment_schema)
          jsonschema.Draft7Validator.check_schema(task_schema)
          jsonschema.Draft7Validator.check_schema(harness_build_schema)
          jsonschema.Draft7Validator.check_schema(harness_admission_schema)
          jsonschema.Draft7Validator.check_schema(launch_packet_schema)
          for path in sorted(Path("qualification/launch-packets").glob("*.json")):
              launch_packet = json.loads(path.read_text())
              jsonschema.validate(launch_packet, launch_packet_schema)
          for path in sorted(Path("qualification/harness-artifacts").glob("*.admission*.json")):
              admission = json.loads(path.read_text())
              jsonschema.validate(admission, harness_admission_schema)
              assert admission["admission"]["state"] == "BUILD_ADMITTED"
          task_classes = {}
          for path in sorted(Path("qualification/tasks").glob("*/task.json")):
              task_doc = json.loads(path.read_text())
              jsonschema.validate(task_doc, task_schema)
              task_id = task_doc["id"]
              assert task_id not in task_classes, f"duplicate qualification task id: {task_id}"
              task_classes[task_id] = task_doc["task_class"]
          assert method_ir_task_v3["id"] in task_classes
          assert method_ir_task_v3["task_class"] == "research.method-evidence-binding"
          actor_ids = set()
          for path in sorted(Path("qualification/actors").glob("*.json")):
              actor = json.loads(path.read_text())
              jsonschema.validate(actor, actor_schema)
              actor_ids.add(actor["id"])
          assert len(actor_ids) >= 6

          for path in sorted(Path("qualification/experiments").glob("*.json")):
              experiment = json.loads(path.read_text())
              jsonschema.validate(experiment, experiment_schema)
              assert experiment["task"]["id"] in task_classes
              assert experiment["task"]["task_class"] == task_classes[experiment["task"]["id"]]
              assert set(experiment["actors"]) <= actor_ids
          print("PASS qualification JSON contracts")
          PY

      - name: Self-test deterministic verifiers
        run: |
          python qualification/tasks/text-repair-v0/verify.py --self-test
          python qualification/tasks/text-repair-v1/verify.py --self-test
          python qualification/tasks/validation-discovery-v0/verify.py --self-test
          python qualification/tasks/boundary-bugfix-v0/verify.py --self-test
          python qualification/tasks/repository-reconciliation-v0/verify.py --self-test
          python qualification/tasks/api-boundary-classification-v0/verify.py --self-test
          python qualification/tasks/method-ir-siglip2-b16-256-v0/verify.py --self-test
          python qualification/tasks/api-boundary-classification-v1/verify.py --self-test
          python qualification/tasks/method-ir-siglip2-b16-256-v1/verify.py --self-test
          python qualification/tasks/method-ir-siglip2-b16-256-v3/verify.py --self-test

      - name: Enforce task workspace layout contract
        run: python qualification/test_task_workspace_layout.py

      - name: Self-test task-conditioned evidence reducer
        run: PYTHONPATH=. python qualification/test_reduce_evidence.py

      - name: Exercise unified v2 reference contract
        env:
          RECEIPT_V2: ${{ runner.temp }}/qualification-v2-reference.json
        run: |
          set -euo pipefail
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id contract-v2-reference \
            --substrate-profile-commit "$GITHUB_SHA" \
            --experiment qualification/experiments/unified-reference-contract-v1.json \
            qualification/tasks/text-repair-v1 \
            qualification/test-candidate-v2.json \
            "$RECEIPT_V2" \
            -- python "$GITHUB_WORKSPACE/qualification/test_candidate.py"
          python - "$RECEIPT_V2" <<'PY'
          import json,sys
          from pathlib import Path
          import jsonschema

          receipt=json.loads(Path(sys.argv[1]).read_text())
          schema=json.loads(Path("qualification/run-receipt.schema.json").read_text())
          jsonschema.validate(receipt,schema)
          assert receipt["schema_version"] == 2
          assert receipt["observation"]["success"] is True
          assert receipt["task"]["id"] == "text-repair-v1"
          assert len(receipt["task"]["ksa_requirements"]) == 3
          assert receipt["candidate"]["deployment_topology"]["compute_class"] == "deterministic"
          assert receipt["candidate"]["deployment_topology"]["transport"] == "stdio"
          assert receipt["resources"]["platform_system"] == "Linux"
          assert receipt["resources"]["platform_machine"]
          assert receipt["experiment"]["id"] == "unified-reference-contract-v1"
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Census canonical local-CPU evidence
        run: |
          PYTHONPATH=. python qualification/census_cpu_evidence.py qualification/evidence --output "$RUNNER_TEMP/cpu-census.json"
          python - "$RUNNER_TEMP/cpu-census.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["local_cpu_receipts"] >= 1
          assert all(row["model_provider"] == "ollama" for row in data["rows"])
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Self-test run failure attribution
        run: PYTHONPATH=. python qualification/test_run_task_failure_attribution.py

      - name: Self-test OpenRouter generation provenance projection
        run: PYTHONPATH=. python qualification/test_run_task_openrouter_metadata.py

      - name: Self-test bounded operational output snapshot
        run: PYTHONPATH=. python qualification/test_run_task_output_snapshot.py

      - name: Self-test Goose timeout streaming
        run: PYTHONPATH=. python qualification/test_goose_cli_streaming.py

      - name: Self-test Foundry hosted-realization projection
        run: PYTHONPATH=. python qualification/test_export_hosted_realization.py

      - name: Verify prebuilt actor/admission bindings
        run: PYTHONPATH=. python qualification/check_admitted_actor_bindings.py

      - name: Validate portable launch packet bindings
        run: |
          PYTHONPATH=. python qualification/validate_portable_launch_packet.py \
            qualification/launch-packets/contract-portability-gha-v1.json \
            --task-dir qualification/tasks/text-repair-v0 \
            --actor-profile qualification/actors/contract-test-portable.json \
            --substrate-profile qualification/fixtures/substrate-profile-gha-v2.json
          PYTHONPATH=. python qualification/validate_portable_launch_packet.py \
            qualification/launch-packets/contract-portability-container-v1.json \
            --task-dir qualification/tasks/text-repair-v0 \
            --actor-profile qualification/actors/contract-test-portable.json \
            --substrate-profile qualification/fixtures/substrate-profile-container-v2.json

      - name: Self-test portable launch packet fault injection
        run: PYTHONPATH=. python qualification/test_portable_launch_packet_faults.py

      - name: Self-test daemonless artifact hydration
        run: PYTHONPATH=. python qualification/test_hydrate_oci_layout.py

      - name: Self-test artifact admission fault injection
        run: PYTHONPATH=. python qualification/test_artifact_admission_faults.py

      - name: Self-test persistent worker lifecycle
        run: |
          PYTHONPATH=. python qualification/test_candidate_lifecycle.py
          PYTHONPATH=. python qualification/test_persistent_worker_hygiene.py

      - name: Self-test credential and validator failure hygiene
        run: |
          PYTHONPATH=. python qualification/test_credential_reference_hygiene.py
          PYTHONPATH=. python qualification/test_run_task_validator_error.py

      - name: Self-test venue-portability receipt comparator
        run: PYTHONPATH=. python qualification/test_compare_portable_receipts.py

      - name: Reduce current actor qualification evidence
        run: |
          PYTHONPATH=. python qualification/reduce_evidence.py \
            qualification/evidence/hosted-deepseek-flash-text-repair-2026-09-20.json \
            qualification/evidence/hosted-google-gemini-text-repair-2026-09-20.json \
            qualification/evidence/hosted-groq-gpt-oss-text-repair-2026-09-20.json \
            qualification/evidence/hosted-nvidia-nemotron-text-repair-2026-09-20.json \
            qualification/evidence/hosted-openrouter-free-text-repair-2026-09-20.json \
            qualification/evidence/hosted-openrouter-groq-gpt-oss-text-repair-2026-09-20.json \
            qualification/evidence/local-openworker-qwen-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-google-gemini-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-groq-gpt-oss-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-nvidia-nemotron-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-openrouter-free-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-deepseek-flash-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-openrouter-deepseek-v41-flash-validation-discovery-2026-09-20.json \
            qualification/evidence/hosted-groq-gpt-oss-repository-reconciliation-2026-09-21.json \
            --output "$RUNNER_TEMP/current-envelopes.json"
          python - "$RUNNER_TEMP/current-envelopes.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert len(data["envelopes"]) == 14
          by_route={
              (
                  env["actor"]["candidate"]["model"]["provider"],
                  env["actor"]["candidate"]["model"]["id"],
                  env["task_class"],
              ): env
              for env in data["envelopes"]
          }
          bounded="software.bounded-repair"
          discovery="repository.capability-discovery"
          reconciliation="repository.state-reconciliation"
          assert by_route[("deepseek","deepseek-flash",bounded)]["evidence_pattern"] == "PASS_ONLY"
          assert by_route[("google","gemini-3.7-flash",bounded)]["evidence_pattern"] == "PASS_ONLY"
          assert by_route[("groq","openai/gpt-oss-20b",bounded)]["evidence_pattern"] == "PASS_ONLY"
          assert by_route[("openrouter","openai/gpt-oss-20b",bounded)]["evidence_pattern"] == "PASS_ONLY"
          nvidia_bounded=by_route[("nvidia","nvidia/nemotron-3.5-lightning-30b-a3b",bounded)]
          assert nvidia_bounded["evidence_pattern"] == "NO_TERMINAL_EVIDENCE"
          assert nvidia_bounded["evidence"]["validated_fail"] == 0
          assert nvidia_bounded["evidence"]["incomplete"] == 1
          assert all(
              value == "INSUFFICIENT_EVIDENCE"
              for family in nvidia_bounded["ksa_evidence"].values()
              for value in family.values()
          )
          assert by_route[("openrouter","openrouter/free",bounded)]["evidence_pattern"] == "PASS_ONLY"

          assert by_route[("ollama","qwen3:1.7b",discovery)]["evidence_pattern"] == "FAIL_ONLY"
          assert by_route[("groq","openai/gpt-oss-20b",discovery)]["evidence_pattern"] == "FAIL_ONLY"
          assert by_route[("nvidia","nvidia/nemotron-3.5-lightning-30b-a3b",discovery)]["evidence_pattern"] == "FAIL_ONLY"
          assert by_route[("openrouter","openrouter/free",discovery)]["evidence_pattern"] == "PASS_ONLY"
          assert by_route[("deepseek","deepseek-flash",discovery)]["evidence_pattern"] == "PASS_ONLY"

          groq_reconciliation=by_route[("groq","openai/gpt-oss-20b",reconciliation)]
          assert groq_reconciliation["evidence_pattern"] == "FAIL_ONLY"
          assert groq_reconciliation["evidence"]["validated_fail"] == 1
          assert groq_reconciliation["ksa_evidence"]["skills"]["repository_state_reconciliation"] == "INSUFFICIENT_EVIDENCE"
          assert groq_reconciliation["ksa_evidence"]["abilities"]["unknown_preservation"] == "INSUFFICIENT_EVIDENCE"
          assert groq_reconciliation["ksa_evidence_detail"]["skills"]["repository_state_reconciliation"]["nonisolating_task_negative_trials"] == 1
          assert groq_reconciliation["ksa_evidence_detail"]["abilities"]["unknown_preservation"]["nonisolating_task_negative_trials"] == 1

          google=by_route[("google","gemini-3.7-flash",discovery)]
          assert google["evidence_pattern"] == "NO_TERMINAL_EVIDENCE"
          assert google["evidence"]["incomplete"] == 1
          assert all(
              value == "INSUFFICIENT_EVIDENCE"
              for family in google["ksa_evidence"].values()
              for value in family.values()
          )

          routed=by_route[("openrouter","deepseek/deepseek-v4.1-flash",discovery)]
          assert routed["evidence_pattern"] == "NO_TERMINAL_EVIDENCE"
          assert routed["evidence"]["incomplete"] == 1
          assert all("state" not in env and "qualified" not in env for env in data["envelopes"])
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Reduce initial CPU v2 characterization evidence
        run: |
          PYTHONPATH=. python qualification/reduce_evidence.py \
            qualification/evidence/cpu-reference-openworker-qwen-text-repair-2026-09-24.json \
            qualification/evidence/cpu-operational-openworker-qwen-api-boundary-v1-2026-09-24.json \
            --output "$RUNNER_TEMP/cpu-v2-envelopes.json"
          python - "$RUNNER_TEMP/cpu-v2-envelopes.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert len(data["envelopes"]) == 2
          by_task={env["task_class"]:env for env in data["envelopes"]}
          repair=by_task["software.bounded-repair"]
          api=by_task["reverse-engineering.api-boundary-classification"]
          assert repair["evidence_pattern"] == "PASS_ONLY"
          assert repair["evidence"]["semantic_trials"] == 1
          assert repair["evidence"]["success_interval_wilson_95"]["estimate"] == 1.0
          assert repair["evidence"]["success_interval_wilson_95"]["lower_95"] < 0.5
          assert api["evidence_pattern"] == "FAIL_ONLY"
          assert api["evidence"]["semantic_trials"] == 1
          assert api["evidence"]["censored"] == 0
          assert api["evidence"]["unique_task_instances"] == 1
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Reduce CPU reasoning-projection treatment evidence
        run: |
          PYTHONPATH=. python qualification/reduce_evidence.py \
            qualification/evidence/cpu-qwen17-api-boundary-reasoning-none-control-2026-09-24.json \
            qualification/evidence/cpu-qwen17-api-boundary-reasoning-omitted-censored-2026-09-24.json \
            --output "$RUNNER_TEMP/cpu-reasoning-envelopes.json"
          python - "$RUNNER_TEMP/cpu-reasoning-envelopes.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert len(data["envelopes"]) == 2
          rows=sorted(data["envelopes"], key=lambda e:e["evidence"]["censored"])
          semantic, censored = rows
          assert semantic["evidence"]["validated_fail"] == 1
          assert semantic["evidence"]["semantic_trials"] == 1
          assert censored["evidence"]["validated_fail"] == 0
          assert censored["evidence"]["semantic_trials"] == 0
          assert censored["evidence"]["censored"] == 1
          assert censored["evidence"]["incomplete"] == 0
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Exercise positive, repeat, and negative receipts
        env:
          RECEIPT_GOOD_1: ${{ runner.temp }}/qualification-good-1.json
          RECEIPT_GOOD_2: ${{ runner.temp }}/qualification-good-2.json
          RECEIPT_BAD: ${{ runner.temp }}/qualification-bad.json
        run: |
          set -euo pipefail

          run_rep() {
            local receipt="$1"
            local candidate="$2"
            python qualification/run_task.py \
              --task-commit "$GITHUB_SHA" \
              --substrate-profile-id contract-self-test \
              --substrate-profile-commit "$GITHUB_SHA" \
              qualification/tasks/text-repair-v0 \
              qualification/test-candidate.json \
              "$receipt" \
              -- python "$GITHUB_WORKSPACE/$candidate"
          }

          run_rep "$RECEIPT_GOOD_1" qualification/test_candidate.py
          run_rep "$RECEIPT_GOOD_2" qualification/test_candidate.py

          set +e
          run_rep "$RECEIPT_BAD" qualification/test_candidate_bad.py
          bad_rc=$?
          set -e
          test "$bad_rc" -eq 1

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("qualification/run-receipt.schema.json").read_text())
          good1 = json.loads(Path(os.environ["RECEIPT_GOOD_1"]).read_text())
          good2 = json.loads(Path(os.environ["RECEIPT_GOOD_2"]).read_text())
          bad = json.loads(Path(os.environ["RECEIPT_BAD"]).read_text())

          for receipt in (good1, good2, bad):
              jsonschema.validate(receipt, schema)
              assert receipt["observation"]["human_interventions"] == 0

          assert good1["observation"]["success"] is True
          assert good2["observation"]["success"] is True
          assert good1["observation"]["tool_calls"] == 1
          assert good1["observation"]["input_tokens"] == 11
          assert good1["observation"]["output_tokens"] == 3
          assert good1["observation"]["cache_read_tokens"] == 2
          assert good1["observation"]["cache_write_tokens"] == 0
          assert "provider_observations" not in good1["observation"]
          workload = good1["observation"]["workload"]
          assert workload["model_rounds"] == 1
          assert workload["request_message_bytes_total"] == 100.0
          assert workload["request_tool_schema_bytes_total"] == 25.0
          assert workload["output_text_bytes_total"] == 5.0
          assert workload["tool_argument_bytes_total"] == 12.0
          assert workload["resolved_models"] == ["contract-test"]
          assert bad["observation"]["success"] is False
          assert bad["observation"]["failure_class"] == "false-completion"
          assert bad["observation"]["timed_out"] is False
          assert bad["observation"]["state_changed"] is True
          assert "false-completion" in bad["observation"]["failure_signals"]
          assert good1["observation"]["failure_signals"] == []
          assert good2["observation"]["failure_signals"] == []
          assert len({good1["run_id"], good2["run_id"], bad["run_id"]}) == 3
          assert good1["candidate"]["configuration_digest"] == good2["candidate"]["configuration_digest"]
          print("PASS repeated reps create distinct receipts and failed evidence is preserved")
          PY
