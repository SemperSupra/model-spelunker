name: Qualification Contract Check

on:
  pull_request:
    paths:
      - 'qualification/**'
      - '.github/workflows/qualification-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1

      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          json.loads(Path("qualification/tasks/text-repair-v0/task.json").read_text())
          json.loads(Path("qualification/test-candidate.json").read_text())
          schema = json.loads(Path("qualification/run-receipt.schema.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          print("PASS qualification JSON contracts")
          PY

      - name: Self-test deterministic verifier
        run: python qualification/tasks/text-repair-v0/verify.py --self-test

      - name: Run end-to-end contract rep
        env:
          RECEIPT: ${{ runner.temp }}/qualification-receipt.json
        run: |
          python qualification/run_task.py \
            qualification/tasks/text-repair-v0 \
            qualification/test-candidate.json \
            "$RECEIPT" \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id contract-self-test \
            --substrate-profile-commit "$GITHUB_SHA" \
            -- python "$GITHUB_WORKSPACE/qualification/test_candidate.py"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text())
          schema = json.loads(Path("qualification/run-receipt.schema.json").read_text())
          jsonschema.validate(receipt, schema)

          assert receipt["observation"]["success"] is True
          assert receipt["observation"]["human_interventions"] == 0
          assert receipt["candidate"]["harness"]["name"] == "contract-test"
          print("PASS end-to-end qualification receipt")
          PY
