name: Qualification Contract Check

on:
  pull_request:
    paths:
      - 'qualification/**'
      - '.github/workflows/qualification-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate JSON and receipt schema
        run: |
          python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          json.loads(Path("qualification/tasks/text-repair-v0/task.json").read_text())
          schema = json.loads(Path("qualification/run-receipt.schema.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          print("PASS qualification JSON contracts")
          PY

      - name: Self-test deterministic verifier
        run: python qualification/tasks/text-repair-v0/verify.py --self-test
