name: HMRC R4 native heldout memory abstention RDTE
# Synthetic EN/DE/TH data only, no actual DLE or credential, no private runners.
# Independent source critic + native pinned Qwen/Ollama multi-seed crossover.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_holdout_r4.py'
      - 'qualification/fixtures/hmrc_negative_holdout_r4.json'
      - '.github/workflows/hmrc-r4-heldout-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-critic:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Fixture/authority/attestation regression without any model
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/hmrc_holdout_r4.py
          python3 qualification/hmrc_holdout_r4.py --self-test
  native-qwen-2seed:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_CONTEXT_LENGTH: '32768'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Reject unqualified evidence corpus
        run: python3 qualification/hmrc_holdout_r4.py --self-test
      - name: Install exact existing qualified public model runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" --output "$archive"
          printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$runtime" "$RUNNER_TEMP/hmrc-models"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Start pinned loopback Ollama and admit exact public model
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/hmrc-models"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_MAX_LOADED_MODELS=1 ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for n in $(seq 1 60); do
            if curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as r:
              models=json.load(r)["models"]
          m=next((x for x in models if x["name"]==os.environ["OLLAMA_MODEL_TAG"]),None)
          assert m and m["digest"].removeprefix("sha256:").startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"])
          print("PUBLIC_QWEN_MODEL_DIGEST=PASS")
          PY
      - name: Real model blind heldout trials on two fixed seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 19 53; do
            python3 qualification/hmrc_holdout_r4.py --seed "$seed" --decoys 100 \
              --out "hmrc-r4-heldout-$seed.json"
          done
          python3 - <<'PY'
          import json
          rows=[json.load(open(f"hmrc-r4-heldout-{seed}.json")) for seed in (19,53)]
          assert all(r["native_model_executed"] and r["agent_tool_task_not_run"] and len(r["rows"])==48 for r in rows)
          assert all(set(r["summary"])=={"no-recall","scoped-only","attested-evidence"} for r in rows)
          totals={arm:sum(r["summary"][arm]["correct"] for r in rows)
                  for arm in ("no-recall","scoped-only","attested-evidence")}
          print("R4_PUBLIC_MODEL_HOLDOUT_TOTALS="+json.dumps(totals,sort_keys=True))
          print("NO_PRODUCTION_MEMORY_AUTHORITY; PASS_IS_RECEIPT_COMPLETE_NOT_EFFICACY")
          PY
      - uses: actions/upload-artifact@e0ed3f6b3dd8f4d628c74e3db1ad6483bc287e78 # v4.6.2
        if: always()
        with:
          name: hmrc-r4-heldout-native
          path: hmrc-r4-heldout-*.json
          if-no-files-found: ignore
          retention-days: 14
