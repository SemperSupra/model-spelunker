name: Codex Exec Build Characterization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-exec-build-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODEX_SHA: '6b9826e3aa83b1a5947db50f4332cb9c65f1b340'
      CODEX_VERSION: '0.154.0'
      RUST_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: '/tmp/codex-exec-target'
    steps:
      - name: Record substrate
        shell: bash
        run: |
          set -euo pipefail
          echo "NPROC=$(nproc)"
          free -b
          df -B1 /
          uname -a

      - name: Install upstream CI Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Clone pinned Codex source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/openai/codex.git "$RUNNER_TEMP/codex"
          git -C "$RUNNER_TEMP/codex" checkout --quiet --detach "$CODEX_SHA"
          test "$(git -C "$RUNNER_TEMP/codex" rev-parse HEAD)" = "$CODEX_SHA"

      - name: Normalize and bind Cargo lockfile
        shell: bash
        working-directory: ${{ runner.temp }}/codex/codex-rs
        run: |
          set -euo pipefail
          echo "CODEX_LOCK_ORIGINAL_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.original"
          cargo tree -p codex-exec --depth 1 >/dev/null
          echo "CODEX_LOCK_RESOLVED_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          echo '=== bounded Cargo.lock diff ==='
          git diff -- Cargo.lock | sed -n '1,220p'

      - name: Compare full CLI and exec dependency surfaces
        shell: bash
        working-directory: ${{ runner.temp }}/codex/codex-rs
        run: |
          set -euo pipefail
          cargo tree --locked -p codex-cli --depth 1 >"$RUNNER_TEMP/codex-cli-tree.txt"
          cargo tree --locked -p codex-exec --depth 1 >"$RUNNER_TEMP/codex-exec-tree.txt"
          echo "CODEX_CLI_DEPTH1_LINES=$(wc -l <"$RUNNER_TEMP/codex-cli-tree.txt")"
          echo "CODEX_EXEC_DEPTH1_LINES=$(wc -l <"$RUNNER_TEMP/codex-exec-tree.txt")"
          echo '=== codex-exec direct graph ==='
          cat "$RUNNER_TEMP/codex-exec-tree.txt"

      - name: Build upstream codex-exec binary only
        shell: bash
        working-directory: ${{ runner.temp }}/codex/codex-rs
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/codex-exec-build-time.txt" \
            cargo build --locked --release -p codex-exec --bin codex-exec
          bin="$CARGO_TARGET_DIR/release/codex-exec"
          test -x "$bin"
          echo "CODEX_EXEC_BIN=$bin" >> "$GITHUB_ENV"
          echo "CODEX_EXEC_BINARY_BYTES=$(stat -c %s "$bin")"
          echo "CODEX_EXEC_BINARY_SHA256=$(sha256sum "$bin" | awk '{print $1}')"
          file "$bin"
          ldd "$bin" || true
          cat "$RUNNER_TEMP/codex-exec-build-time.txt"

      - name: Measure direct exec surface
        shell: bash
        run: |
          set -euo pipefail
          "$CODEX_EXEC_BIN" --version
          for i in 1 2 3 4 5; do
            /usr/bin/time -f "CODEX_EXEC_VERSION_START_${i}_SECONDS=%e" "$CODEX_EXEC_BIN" --version >/dev/null
          done
          "$CODEX_EXEC_BIN" --help | sed -n '1,160p'
