name: Model Compass Stateless OCI App and Quadlet Source RDTE

on:
  pull_request:
    paths:
      - 'cmd/compass-http/**'
      - 'cmd/model-compass/**'
      - 'deploy/model-compass/**'
      - '.github/workflows/compass-oci-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-oci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readonly-go-service:
    name: offline-readonly-go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    timeout-minutes: 9
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Go stdlib toolchain for HTTP wrapper
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Stateless authenticated read-only adapter oracles
        shell: bash
        run: |
          set -euo pipefail
          cd cmd/compass-http
          GOPROXY=off GOSUMDB=off go test -count=3 -v ./...
          GOPROXY=off GOSUMDB=off go vet ./...

  disposable-oci:
    name: Linux OCI image + read-only state-preservation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build disposable source image (no publish)
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg SOURCE_REVISION="${GITHUB_SHA}" \
            -f deploy/model-compass/Dockerfile \
            -t model-compass:rdte .
          docker image inspect model-compass:rdte --format '{{.Id}}'
      - name: Native Compose normalized IR security validation
        shell: bash
        run: |
          set -euo pipefail
          export MODEL_COMPASS_IMAGE="model-compass:rdte"
          export MODEL_COMPASS_STATE_DIR="$RUNNER_TEMP/compass-state"
          export MODEL_COMPASS_TOKEN_FILE="$RUNNER_TEMP/compass-token"
          mkdir -p "$MODEL_COMPASS_STATE_DIR"
          touch "$MODEL_COMPASS_TOKEN_FILE"
          docker compose -f deploy/model-compass/truenas-compose.yaml config --format json > "$RUNNER_TEMP/compose.json"
          python3 deploy/model-compass/verify_compose.py "$RUNNER_TEMP/compose.json"
      - name: Destroy/recreate read-only runtime while preserving external fixture
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/compass-rdte"
          mkdir -p "$base/state"
          printf '%s\n' '{"schema":"synthetic","immutable_receipt":"keep-between-recreates"}' > "$base/state/snapshot.json"
          printf '%064d\n' 1 > "$base/token"
          sudo chown -R 65532:65532 "$base"
          sudo chmod 0400 "$base/token"
          printf "Authorization: Bearer %064d\\n" 1 > "$RUNNER_TEMP/compass-rdte-auth-header"
          source="$base/state"
          secret="$base/token"
          for rep in 1 2; do
            docker run -d --name compass-oci-rdte \
              --read-only --user 65532:65532 --cap-drop=ALL \
              --security-opt no-new-privileges:true --pids-limit 64 \
              --memory 256m --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              -p 127.0.0.1:18088:8088 \
              -v "$source:/state:ro" \
              -v "$secret:/run/secrets/compass_token:ro" \
              model-compass:rdte
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 2 http://127.0.0.1:18088/healthz > /dev/null; then ready=1;break;fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then docker logs compass-oci-rdte || true;exit 1;fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/v1/snapshot)
            test "$code" = 401
            curl -fsS -H @"$RUNNER_TEMP/compass-rdte-auth-header" \
              http://127.0.0.1:18088/v1/snapshot | grep -q 'keep-between-recreates'
            curl -fsS -H @"$RUNNER_TEMP/compass-rdte-auth-header" \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              http://127.0.0.1:18088/mcp | grep -q 'recommend_models'
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' compass-oci-rdte)" = true
            test "$(docker inspect -f '{{.Config.User}}' compass-oci-rdte)" = '65532:65532'
            docker rm -f compass-oci-rdte
          done
          test "$(cat "$source/snapshot.json")" = '{"schema":"synthetic","immutable_receipt":"keep-between-recreates"}'
          echo "PASS: two independent disposable runtimes / external durable state retained"
