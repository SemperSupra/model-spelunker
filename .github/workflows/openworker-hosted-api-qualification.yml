name: OpenWorker Hosted API Qualification

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Hosted API treatment
        required: true
        default: groq-gpt-oss-20b
        type: choice
        options:
          - deepseek-flash
          - deepseek-v4-pro
          - groq-gpt-oss-20b
          - groq-qwen3.8-27b
          - openrouter-deepseek-v4-flash-0731-free
          - openrouter-free-router

permissions:
  contents: read

concurrency:
  group: openworker-hosted-api-${{ github.ref }}-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENWORKER_UPSTREAM_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      HOSTED_CATALOG: 'qualification/models/hosted-api.json'
      CANDIDATE_META: '/tmp/model-spelunker-hosted-candidate.json'
      RECEIPT: '/tmp/model-spelunker-hosted-receipt.json'
      SUBSTRATE_PROFILE_COMMIT: '89479bf80f6db3ea01dff484a49a2c6a897e4a81'
      MODEL_SPELUNKER_MAX_TOKENS: '2048'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve treatment from catalog
        id: treatment
        shell: bash
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate_id=os.environ["REQUESTED_CANDIDATE"]
          catalog=json.loads(Path(os.environ["HOSTED_CATALOG"]).read_text())
          candidate=catalog["candidates"].get(candidate_id)
          if candidate is None:
              raise SystemExit(f"unknown hosted candidate: {candidate_id}")

          values={
              "HOSTED_CANDIDATE_ID": candidate_id,
              "HOSTED_TREATMENT_KIND": candidate["treatment_kind"],
              "HOSTED_PROVIDER": candidate["provider"],
              "HOSTED_MODEL": candidate["model"],
              "HOSTED_API_BASE": candidate["api_base"],
              "HOSTED_COST_CLASS": candidate["cost_class"],
              "HOSTED_ADMISSION": candidate["admission"],
              "MODEL_SPELUNKER_MODEL": f'{candidate["provider"]}:{candidate["model"]}',
              "MODEL_SPELUNKER_REASONING_EFFORT": candidate["reasoning_effort"],
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              for key,value in values.items():
                  env.write(f"{key}={value}\n")

          print(json.dumps({
              "candidate_id":candidate_id,
              "treatment_kind":candidate["treatment_kind"],
              "provider":candidate["provider"],
              "model":candidate["model"],
              "cost_class":candidate["cost_class"],
              "reasoning_effort":candidate["reasoning_effort"],
          },sort_keys=True))
          PY

      - name: Bind DeepSeek credential
        if: env.HOSTED_PROVIDER == 'deepseek'
        shell: bash
        env:
          SELECTED_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo 'QUALIFICATION_BOUNDARY=missing-DEEPSEEK_API_KEY'; exit 78; }
          echo "DEEPSEEK_API_KEY=$SELECTED_API_KEY" >> "$GITHUB_ENV"

      - name: Bind Groq credential
        if: env.HOSTED_PROVIDER == 'groq'
        shell: bash
        env:
          SELECTED_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo 'QUALIFICATION_BOUNDARY=missing-GROQ_API_KEY'; exit 78; }
          echo "GROQ_API_KEY=$SELECTED_API_KEY" >> "$GITHUB_ENV"

      - name: Bind OpenRouter credential
        if: env.HOSTED_PROVIDER == 'openrouter'
        shell: bash
        env:
          SELECTED_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo 'QUALIFICATION_BOUNDARY=missing-OPENROUTER_API_KEY'; exit 78; }
          echo "OPENROUTER_API_KEY=$SELECTED_API_KEY" >> "$GITHUB_ENV"

      - name: Zero-inference provider admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          provider=os.environ["HOSTED_PROVIDER"]
          model=os.environ["HOSTED_MODEL"]
          base=os.environ["HOSTED_API_BASE"].rstrip("/")
          key_env={
              "deepseek":"DEEPSEEK_API_KEY",
              "groq":"GROQ_API_KEY",
              "openrouter":"OPENROUTER_API_KEY",
          }[provider]
          key=os.environ.get(key_env)
          if not key:
              raise SystemExit(f"missing selected credential {key_env}")

          def get(url):
              request=urllib.request.Request(
                  url,
                  headers={"Accept":"application/json","Authorization":"Bearer "+key},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      return json.load(response),dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"{provider} admission failed: HTTP {exc.code}") from exc

          if provider=="deepseek":
              data,_=get(base+"/user/balance")
              available=data.get("is_available")
              if available is not True:
                  raise SystemExit("DeepSeek authenticated but API balance is unavailable")
              evidence={"authenticated":True,"available":True}

          elif provider=="groq":
              data,headers=get(base+"/models")
              ids={row.get("id") for row in data.get("data",[]) if isinstance(row,dict)}
              if model not in ids:
                  raise SystemExit(f"Groq model is not active for this key: {model}")
              evidence={
                  "authenticated":True,
                  "model_active":True,
                  "rate_limit_requests":headers.get("x-ratelimit-limit-requests"),
                  "rate_limit_tokens":headers.get("x-ratelimit-limit-tokens"),
              }

          elif provider=="openrouter":
              key_data,_=get(base+"/key")
              info=key_data.get("data") or {}
              if os.environ["HOSTED_TREATMENT_KIND"]=="model":
                  models,_=get(base+"/models")
                  ids={row.get("id") for row in models.get("data",[]) if isinstance(row,dict)}
                  if model not in ids:
                      raise SystemExit(f"OpenRouter model is not currently listed: {model}")
                  if not model.endswith(":free"):
                      raise SystemExit("OpenRouter free model treatment must use an explicit :free variant")
              elif model!="openrouter/free":
                  raise SystemExit("router treatment must use openrouter/free")
              evidence={
                  "authenticated":True,
                  "is_free_tier":info.get("is_free_tier"),
                  "treatment_kind":os.environ["HOSTED_TREATMENT_KIND"],
              }
          else:
              raise SystemExit(f"unsupported provider: {provider}")

          print("HOSTED_ADMISSION="+json.dumps(evidence,sort_keys=True))
          PY

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker"

      - name: Build candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate={
              "harness":{
                  "name":"openworker",
                  "version":os.environ["OPENWORKER_UPSTREAM_SHA"],
              },
              "model":{
                  "provider":os.environ["HOSTED_PROVIDER"],
                  "id":os.environ["HOSTED_MODEL"],
                  "treatment_kind":os.environ["HOSTED_TREATMENT_KIND"],
              },
              "toolset":["filesystem"],
              "configuration":{
                  "candidate_id":os.environ["HOSTED_CANDIDATE_ID"],
                  "projection":["read_file","write_file"],
                  "parallel_tool_calls":False,
                  "max_tokens":int(os.environ["MODEL_SPELUNKER_MAX_TOKENS"]),
                  "reasoning_effort":os.environ["MODEL_SPELUNKER_REASONING_EFFORT"],
                  "max_iterations":4,
                  "api_base":os.environ["HOSTED_API_BASE"],
                  "cost_class":os.environ["HOSTED_COST_CLASS"],
                  "provider_alias_semantics":"hosted mutable service",
                  "api_contract_observed":"2026-09-20",
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(
              json.dumps(candidate,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          print(json.dumps(candidate,sort_keys=True))
          PY

      - name: Run same harness-neutral task
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-hosted-api \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            qualification/tasks/text-repair-v0 \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- "$RUNNER_TEMP/openworker-venv/bin/python" \
              "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          qualification_rc=$?
          set -e

          test -f "$RECEIPT"
          QUALIFICATION_RC="$qualification_rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          rc=int(os.environ["QUALIFICATION_RC"])
          assert receipt["candidate"]["model"]["provider"]==os.environ["HOSTED_PROVIDER"]
          assert receipt["candidate"]["model"]["id"]==os.environ["HOSTED_MODEL"]
          assert receipt["candidate"]["model"]["treatment_kind"]==os.environ["HOSTED_TREATMENT_KIND"]
          assert rc==(0 if receipt["observation"]["success"] else 1)
          print(json.dumps(receipt,sort_keys=True))
          print("QUALIFICATION_RESULT=" + ("PASS" if receipt["observation"]["success"] else "FAIL (valid observation)"))
          PY
