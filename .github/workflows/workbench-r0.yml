name: Workbench resource integration R2
on:
  pull_request:
    paths:
      - 'qualification/workbench_r0/**'
      - 'qualification/resource_join_r0/**'
      - '.github/workflows/workbench-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/workbench_r0/prove.py evidence
      - name: Install browser test dependency
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install chromium
      - name: Actual browser journeys
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/browser_proof.py evidence
      - name: Measured resource integration and browser parity
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/resource_proof.py resource-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-r0-${{ matrix.os }}
          path: |
            evidence
            resource-evidence
          retention-days: 7
