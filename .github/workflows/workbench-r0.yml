name: Workbench finite selector integration R10
on:
  pull_request:
    paths:
      - 'qualification/workbench_r0/**'
      - 'qualification/workbench_plan_r0/**'
      - 'qualification/resource_join_r0/**'
      - '.github/workflows/workbench-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/workbench_r0/finite_selector.py
      - run: python qualification/workbench_r0/prove.py evidence
      - name: Install browser test dependency
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install chromium
      - name: Actual browser journeys
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/browser_proof.py evidence
      - name: Measured resource integration and browser parity
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/resource_proof.py resource-evidence
      - name: Plan review and revised intent browser parity
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/plan_proof.py plan-evidence
      - name: Measured adaptive screen and confirmation
        if: runner.os == 'Linux'
        run: |
          python qualification/workbench_r0/overhead_proof.py adaptive-evidence
      - name: Paired independent versus shared dependency hydration
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/hydration_proof.py hydration-evidence
      - name: Finite Pareto selection overhead comparison
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/selector_proof.py adaptive-evidence/summary.json selector-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-r0-${{ matrix.os }}
          path: |
            evidence
            resource-evidence
            plan-evidence
            adaptive-evidence
            adaptive-dependencies.txt
            hydration-evidence
            selector-evidence
          retention-days: 7
  finite-campaign:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/workbench_r0/selector_campaign_proof.py finite-campaign-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: finite-campaign-r10
          path: finite-campaign-evidence
          retention-days: 7
