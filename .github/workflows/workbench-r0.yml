name: Workbench adaptive loop R4
on:
  pull_request:
    paths:
      - 'qualification/workbench_r0/**'
      - 'qualification/workbench_plan_r0/**'
      - 'qualification/resource_join_r0/**'
      - '.github/workflows/workbench-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/workbench_r0/prove.py evidence
      - name: Install browser test dependency
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install chromium
      - name: Actual browser journeys
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/browser_proof.py evidence
      - name: Measured resource integration and browser parity
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/resource_proof.py resource-evidence
      - name: Plan review and revised intent browser parity
        if: runner.os == 'Linux'
        run: python qualification/workbench_r0/plan_proof.py plan-evidence
      - name: Measured adaptive screen and confirmation
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'git+https://github.com/optuna/optuna.git@0abf066c1e5d9d83987986869daa3c2bb23df519'
          python -m pip freeze > adaptive-dependencies.txt
          python qualification/workbench_r0/adaptive_proof.py adaptive-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-r0-${{ matrix.os }}
          path: |
            evidence
            resource-evidence
            plan-evidence
            adaptive-evidence
            adaptive-dependencies.txt
          retention-days: 7
