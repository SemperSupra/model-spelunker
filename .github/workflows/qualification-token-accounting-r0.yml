name: Qualification token accounting R0
on:
  pull_request:
    paths:
      - 'qualification/token_accounting_r0/**'
      - '.github/workflows/qualification-token-accounting-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: |
          python -m pip install tiktoken==0.12.0
          python -m pip freeze > dependencies.txt
          python qualification/token_accounting_r0/prove.py evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: token-accounting-r0
          path: |
            evidence
            dependencies.txt
          retention-days: 7
