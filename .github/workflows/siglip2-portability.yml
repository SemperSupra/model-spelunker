name: SigLIP2 Multimodal Portability Rep

on:
  push:
    branches:
      - impl/siglip2-portability-stage
    paths:
      - "experiments/mvp/run_siglip2_portability_v2.py"
      - "experiments/mvp/validate_siglip2_portability.py"
      - ".github/workflows/siglip2-portability.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: embed/siglip2/base-patch16-224
  EXPECTED_DIGEST: sha256:c93e953d44105c8cd59be4b893acee43858e9fcb8b4deb20f83535a2165c1c3d

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6622753fd5914be87fb1b6d987ceb7cae46c7ff5
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Derive exact multimodal runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact CPU multimodal runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .siglip2-venv
          key: model-spelunker-siglip2-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-torch2.14.0-transformers5.16.1-pillow12.3.0-jsonschema4.25.1

      - name: Build exact CPU multimodal runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .siglip2-venv
          .siglip2-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0"
          .siglip2-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "pillow==12.3.0" \
            "transformers==5.16.1" \
            "jsonschema==4.25.1"

      - name: Record exact runtime identity
        shell: bash
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          .siglip2-venv/bin/python - <<'PY' | tee out/runtime.json
          import json, os, platform
          import PIL, torch, transformers
          from importlib.metadata import version
          print(json.dumps({
              "cache_hit": os.environ.get("CACHE_HIT") == "true",
              "python": platform.python_version(),
              "torch": torch.__version__,
              "transformers": transformers.__version__,
              "pillow": PIL.__version__,
              "jsonschema": version("jsonschema"),
          }, sort_keys=True))
          PY

      - name: Authenticate bounded Foundry read
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Hydrate exact approved SigLIP2 artifact once
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/model-spelunker-foundry-siglip2
          START_NS="$(date +%s%N)"
          MODEL1="$(.siglip2-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-foundry-siglip2 \
            --oras "$(command -v oras)" | tail -n1)"
          END_NS="$(date +%s%N)"
          test -d "${MODEL1}"
          MODEL2="$(.siglip2-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-foundry-siglip2 \
            --oras /bin/false | tail -n1)"
          test "${MODEL1}" = "${MODEL2}"
          HYDRATE_SECONDS="$(python3 -c "print((${END_NS}-${START_NS})/1e9)")"
          echo "model_dir=${MODEL2}" >> "$GITHUB_OUTPUT"
          echo "hydrate_seconds=${HYDRATE_SECONDS}" >> "$GITHUB_OUTPUT"
          echo "model_dir=${MODEL2}" | tee out/hydration.txt
          echo "hydrate_seconds=${HYDRATE_SECONDS}" | tee -a out/hydration.txt

      - name: Run non-generative multimodal portability rep
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
          FOUNDRY_HYDRATE_SECONDS: ${{ steps.hydrate.outputs.hydrate_seconds }}
        run: |
          set -euo pipefail
          /usr/bin/time -v .siglip2-venv/bin/python experiments/mvp/run_siglip2_portability_v2.py \
            --model-dir "${MODEL_DIR}" \
            --output out/siglip2-portability.json \
            2>&1 | tee out/run.log

      - name: Validate multimodal evidence contract independently
        shell: bash
        run: |
          set -euo pipefail
          .siglip2-venv/bin/python experiments/mvp/validate_siglip2_portability.py \
            out/siglip2-portability.json \
            | tee out/validation.log

      - name: Summarize result
        shell: bash
        run: |
          set -euo pipefail
          .siglip2-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b = json.loads(Path('out/siglip2-portability.json').read_text())
          d, c = b['derived_metrics'], b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('## SigLIP2 multimodal portability\n\n')
              f.write(f"- exact Foundry digest: `{b['artifact_provenance']['identity_digest']}`\n")
              f.write(f"- text mask adapter: `{b['observations']['text_mask_source']}`\n")
              f.write(f"- primary color-text top-1: `{d['primary_top1_rate']:.3f}`\n")
              f.write(f"- paraphrase color-text top-1: `{d['paraphrase_top1_rate']:.3f}`\n")
              f.write(f"- image/text pairwise RSA: `{d['cross_modal_rsa_pairwise_pearson']}`\n")
              f.write(f"- red image perturbation cosine distance: `{d['red_image_dim_perturbation_cosine_distance']:.6f}`\n")
              f.write(f"- red text paraphrase cosine distance: `{d['red_text_paraphrase_cosine_distance']:.6f}`\n")
              f.write(f"- peak RSS: `{c['peak_rss_mib']:.1f} MiB`\n")
              f.write(f"- experiment time: `{c['experiment_seconds']:.2f} s`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-siglip2-portability-${{ github.run_id }}
          path: |
            out/siglip2-portability.json
            out/runtime.json
            out/hydration.txt
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
