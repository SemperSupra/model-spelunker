name: experiment-0001-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/experiment-0001-smoke.yml'
      - 'tools/run_behavioral_smoke.py'
      - 'tools/run_calibrated_semantic_smoke.py'
      - 'schemas/concept-geometry-record.schema.json'
      - 'fixtures/experiment-0001/**'
      - 'requirements-experiment-0001.txt'

permissions:
  contents: read

jobs:
  behavioral-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install experiment dependencies
        run: python -m pip install -r requirements-experiment-0001.txt

      - name: Run counterbalanced choice control
        run: |
          python tools/run_behavioral_smoke.py \
            --model EleutherAI/pythia-70m \
            --fixture fixtures/experiment-0001/reciprocity-smoke.jsonl \
            --output-dir artifacts/experiment-0001-choice

      - name: Run calibrated semantic scorer
        run: |
          python tools/run_calibrated_semantic_smoke.py \
            --model EleutherAI/pythia-70m \
            --fixture fixtures/experiment-0001/reciprocity-semantic-smoke.jsonl \
            --output-dir artifacts/experiment-0001-semantic

      - name: Summarize records
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          def load(name):
              path = Path(name) / 'concept-geometry-records.jsonl'
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line]

          choice = load('artifacts/experiment-0001-choice')
          semantic = load('artifacts/experiment-0001-semantic')

          print('choice_records=', len(choice))
          print('choice_languages=', dict(Counter(row['probe']['language'] for row in choice)))
          print('choice_classes=', dict(Counter(row['probe']['class'] for row in choice)))
          scored = [row['behavior']['score'] for row in choice if row['behavior']['score'] is not None]
          if scored:
              print(f'choice_labeled_accuracy={sum(scored)/len(scored):.3f}')
          groups = defaultdict(list)
          for row in choice:
              groups[row['behavior']['consistency_group']].append(row['behavior']['selected_option'])
          paired = [values for values in groups.values() if len(values) == 2]
          consistent = [values for values in paired if values[0] == values[1]]
          if paired:
              print(f'choice_counterbalanced_consistency={len(consistent)/len(paired):.3f}')

          print('semantic_records=', len(semantic))
          print('semantic_languages=', dict(Counter(row['probe']['language'] for row in semantic)))
          print('semantic_classes=', dict(Counter(row['probe']['class'] for row in semantic)))
          semantic_scored = [row['behavior']['score'] for row in semantic if row['behavior']['score'] is not None]
          if semantic_scored:
              print(f'semantic_labeled_accuracy={sum(semantic_scored)/len(semantic_scored):.3f}')
          for language in sorted({row['probe']['language'] for row in semantic}):
              rows = [row for row in semantic if row['probe']['language'] == language]
              labeled = [row['behavior']['score'] for row in rows if row['behavior']['score'] is not None]
              if labeled:
                  print(f'semantic_{language}_labeled_accuracy={sum(labeled)/len(labeled):.3f}')
              selections = Counter(row['behavior']['selected_option'] for row in rows)
              print(f'semantic_{language}_selections={dict(selections)}')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0001-smoke-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
