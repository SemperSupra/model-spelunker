name: experiment-0001-model-control

on:
  workflow_dispatch:
  push:
    branches:
      - 'research/experiment-0001-dcpmi'
    paths:
      - '.github/workflows/experiment-0001-smoke.yml'
      - 'tools/reference_cpu.py'
      - 'tools/run_dcpmi_reference.py'
      - 'fixtures/experiment-0001/**'
      - 'requirements-experiment-0001.txt'

permissions:
  contents: read

jobs:
  model-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'

      - name: Install pinned experiment dependencies
        run: python -m pip install -r requirements-experiment-0001.txt

      - name: Run Pythia lexical sanity control
        run: |
          python tools/run_dcpmi_reference.py \
            --model EleutherAI/pythia-70m \
            --revision a39f36b100fe8a5377810d56c3f4789b9c53ac42 \
            --fixture fixtures/experiment-0001/reciprocity-dcpmi-lexical-sanity.jsonl \
            --repeats 2 \
            --output-dir artifacts/pythia-lexical-sanity

      - name: Run Qwen multilingual semantic control
        run: |
          python tools/run_dcpmi_reference.py \
            --model Qwen/Qwen2.5-0.5B \
            --revision 060db6499f32faf8b98477b0a26969ef7d8b9987 \
            --fixture fixtures/experiment-0001/reciprocity-dcpmi-heldout.jsonl \
            --repeats 2 \
            --output-dir artifacts/qwen-semantic-control

      - name: Summarize controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for label, path in [
              ('pythia_lexical', Path('artifacts/pythia-lexical-sanity/summary.json')),
              ('qwen_semantic', Path('artifacts/qwen-semantic-control/summary.json')),
          ]:
              summary = json.loads(path.read_text(encoding='utf-8'))
              primary = summary['primary']
              repeat = summary['intra_runner_repeatability']
              print(f'{label}_model={summary["model"]}')
              print(f'{label}_resolved_revision={summary["resolved_revision"]}')
              print(f'{label}_cpu_model={summary["runtime"]["cpu_model"]}')
              print(f'{label}_accuracy={primary["accuracy"]:.3f}')
              print(f'{label}_cross_language_unanimous_rate={primary["cross_language_unanimous_rate"]:.3f}')
              print(f'{label}_repeatability={repeat["selection_agreement_rate"]:.3f}')
              print(f'{label}_max_margin_drift={repeat["max_margin_drift"]:.12g}')
              for language, stats in primary['by_language'].items():
                  print(f'{label}_{language}={json.dumps(stats, ensure_ascii=False, sort_keys=True)}')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0001-model-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
