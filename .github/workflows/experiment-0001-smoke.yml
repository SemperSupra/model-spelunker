name: experiment-0001-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/experiment-0001-smoke.yml'
      - 'tools/run_behavioral_smoke.py'
      - 'schemas/concept-geometry-record.schema.json'
      - 'fixtures/experiment-0001/**'
      - 'requirements-experiment-0001.txt'

permissions:
  contents: read

jobs:
  behavioral-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-experiment-0001.txt

      - name: Run multilingual CPU smoke
        run: |
          python tools/run_behavioral_smoke.py \
            --model EleutherAI/pythia-70m \
            --fixture fixtures/experiment-0001/reciprocity-smoke.jsonl \
            --output-dir artifacts/experiment-0001

      - name: Summarize records
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('artifacts/experiment-0001/concept-geometry-records.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line]
          print(f'records={len(rows)}')
          print('languages=', dict(Counter(row['probe']['language'] for row in rows)))
          print('classes=', dict(Counter(row['probe']['class'] for row in rows)))
          scored = [row['behavior']['score'] for row in rows if row['behavior']['score'] is not None]
          if scored:
              print(f'labeled_accuracy={sum(scored)/len(scored):.3f}')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0001-smoke-${{ github.run_id }}
          path: artifacts/experiment-0001
          if-no-files-found: error
          retention-days: 14
