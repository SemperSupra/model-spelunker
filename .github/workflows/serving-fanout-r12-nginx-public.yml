name: serving-fanout-r12-public-existing-nginx-admission
on:
  pull_request:
    paths:
      - 'qualification/serving_fanout_r0/edge_limit/**'
      - '.github/workflows/serving-fanout-r12-nginx-public.yml'
permissions:
  contents: read
concurrency:
  group: serving-fanout-r12-nginx-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  nginx-bound-on-one-hot-model:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_SHA: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-r12-nginx-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_QUEUE: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: RED and BLUE synthetic receipt negative controls
        run: |
          python3 -m unittest discover -s qualification/serving_fanout_r0/hot_queue -p 'test_*.py' -v
          python3 -m unittest discover -s qualification/serving_fanout_r0/edge_limit -p 'test_*.py' -v
          python3 -m py_compile qualification/serving_fanout_r0/edge_limit/compare.py
      - name: Install exact published Ollama and record nginx package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --location --silent --show-error --retry 3 "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" --output "$archive"
          echo "$OLLAMA_SHA  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama-runtime"
          zstd -d --stdout "$archive" | tar -xf - -C "$RUNNER_TEMP/ollama-runtime"
          echo "$RUNNER_TEMP/ollama-runtime/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nginx
          nginx -v 2>&1 | tee "$RUNNER_TEMP/nginx-version.txt"
          dpkg-query -W -f='${Package} ${Version}\n' nginx | tee "$RUNNER_TEMP/nginx-package.txt"
          sha256sum qualification/serving_fanout_r0/edge_limit/nginx-r12.conf
      - name: Start single hot Ollama backend and existing reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_QUEUE=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_CONTEXT_LENGTH=2048 ollama serve >"$RUNNER_TEMP/ollama-r12.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull qwen3:1.7b
          conf="$GITHUB_WORKSPACE/qualification/serving_fanout_r0/edge_limit/nginx-r12.conf"
          sudo nginx -t -c "$conf"
          sudo nginx -c "$conf"
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:18080/api/tags' >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:18080/api/tags' >/dev/null
      - name: Run two admission treatments on same backend and physical runner
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r12-evidence"
          python3 qualification/serving_fanout_r0/hot_queue/hot_queue_probe.py --base http://127.0.0.1:11434 --out "$RUNNER_TEMP/r12-evidence/direct.json"
          python3 qualification/serving_fanout_r0/hot_queue/hot_queue_probe.py --base http://127.0.0.1:18080 --out "$RUNNER_TEMP/r12-evidence/nginx.json"
          python3 qualification/serving_fanout_r0/edge_limit/compare.py             --direct "$RUNNER_TEMP/r12-evidence/direct.json"             --edge "$RUNNER_TEMP/r12-evidence/nginx.json"             --nginx-version "$RUNNER_TEMP/nginx-version.txt"             --config qualification/serving_fanout_r0/edge_limit/nginx-r12.conf             --out "$RUNNER_TEMP/r12-evidence/comparison.json"
          cp "$RUNNER_TEMP/nginx-version.txt" "$RUNNER_TEMP/r12-evidence/"
          cp "$RUNNER_TEMP/nginx-package.txt" "$RUNNER_TEMP/r12-evidence/"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r12-evidence"/"comparison.json"
          r=json.loads(p.read_text())
          assert r["evidence_class"]=="OFF_THE_SHELF_LOOPBACK_ADMISSION_COMPARISON_EXPLORATORY"
          assert r["production_admission"]=="NOT_APPROVED"
          assert r["tenant_identity"]=="NOT_VALIDATED_SOURCE_IP_ONLY"
          assert r["outcome"]=="NGINX_LOOPBACK_GLOBAL_IP_LIMIT_SCREEN_PASS",r
          print("R12_REUSE_CANDIDATE_SCREEN_PASS")
          PY
      - name: Retain source-bound direct, edge and independent comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serving-fanout-r12-existing-nginx-${{ github.run_id }}
          path: ${{ runner.temp }}/r12-evidence/*
          retention-days: 14
          if-no-files-found: ignore
