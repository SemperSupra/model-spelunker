name: Chronos Bolt Public Embedding Localization

on:
  push:
    branches:
      - impl/chronos-bolt-portability-stage
    paths:
      - "experiments/mvp/run_chronos_embedding_localization.py"
      - "experiments/mvp/validate_chronos_embedding_localization.py"
      - ".github/workflows/chronos-embedding-localization.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: forecast/chronos/bolt-tiny
  EXPECTED_DIGEST: sha256:515724650b6cdf6d860ade66faf970b50cc64e1d089db405963162aae908adef
  FOUNDRY_EVIDENCE_SHA: 42954f2680391a600db189a960c7c18fc5390921
  CANDIDATE_PATH: candidates/forecast-chronos-bolt-tiny/a0e552de83495b5c28c14c71c374f3e33280b340/3d14a8cb903deefc3bee0b496ab6151122112866/candidate.json

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Checkout exact Foundry candidate evidence revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 42954f2680391a600db189a960c7c18fc5390921
          path: foundry
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - name: Derive runtime cache key
        id: key
        shell: bash
        run: |
          mkdir -p out
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY
      - name: Restore exact Chronos runtime
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .chronos-venv
          key: model-spelunker-chronos-bolt-tiny-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.python_tag }}-chronos2.3.2-torch2.14.0-transformers5.16.1
      - name: Build exact CPU runtime on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m venv .chronos-venv
          .chronos-venv/bin/python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0"
          .chronos-venv/bin/python -m pip install --disable-pip-version-check --no-input "chronos-forecasting==2.3.2" "transformers==5.16.1" "jsonschema==4.25.1"
      - name: Verify exact Foundry candidate evidence
        shell: bash
        run: |
          .chronos-venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads((Path('foundry')/os.environ['CANDIDATE_PATH']).read_text())
          assert c['logical_id']==os.environ['LOGICAL_ID'] and c['oci']['digest']==os.environ['EXPECTED_DIGEST'] and c['oci']['pullback_verified'] and c['state']=='candidate'
          PY
      - name: Authenticate bounded Foundry read
        shell: bash
        env: {GHCR_TOKEN: "${{ github.token }}"}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Hydrate exact candidate digest and prove local reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          .chronos-venv/bin/python foundry/tools/harvest_chronos_bolt_tiny.py temporary-catalog --candidate "foundry/${CANDIDATE_PATH}" --output /tmp/chronos-candidate-catalog.json
          rm -rf /tmp/model-spelunker-chronos-embed
          MODEL1="$(.chronos-venv/bin/python foundry/tools/hydrate.py --catalog /tmp/chronos-candidate-catalog.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-chronos-embed --oras "$(command -v oras)" | tail -n1)"
          MODEL2="$(.chronos-venv/bin/python foundry/tools/hydrate.py --catalog /tmp/chronos-candidate-catalog.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-chronos-embed --oras /bin/false | tail -n1)"
          test "$MODEL1" = "$MODEL2"
          echo "model_dir=$MODEL2" >> "$GITHUB_OUTPUT"
      - name: Run public embedding localization rep
        shell: bash
        env: {MODEL_DIR: "${{ steps.hydrate.outputs.model_dir }}"}
        run: |
          set -euo pipefail
          /usr/bin/time -v .chronos-venv/bin/python experiments/mvp/run_chronos_embedding_localization.py \
            --model-dir "$MODEL_DIR" \
            --candidate "foundry/${CANDIDATE_PATH}" \
            --candidate-ref "SemperSupra/model-artifact-foundry@${FOUNDRY_EVIDENCE_SHA}:${CANDIDATE_PATH}" \
            --output out/chronos-embedding-localization.json 2>&1 | tee out/run.log
      - name: Validate embedding evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .chronos-venv/bin/python experiments/mvp/validate_chronos_embedding_localization.py \
            out/chronos-embedding-localization.json "foundry/${CANDIDATE_PATH}" | tee out/validation.log
      - name: Summarize descriptive result
        shell: bash
        run: |
          .chronos-venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads(Path('out/chronos-embedding-localization.json').read_text());d=b['derived_metrics'];p=b['observations']['protocol'];c=b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## Chronos-Bolt public embedding localization\n\n')
            f.write(f"- embedding sequence/dim: `{p['embedding_sequence_length']} x {p['embedding_dimension']}`; REG token: `{p['use_reg_token']}`\n")
            f.write(f"- positive-amplitude embedding max delta: `{d['positive_amplitude_embedding_max_abs_delta']}`\n")
            f.write(f"- positive-amplitude rescaled forecast max delta: `{d['positive_amplitude_forecast_rescaled_max_abs_delta']}`\n")
            f.write(f"- sign embedding cosine distance: `{d['terminal_sign_embedding_cosine_distance']}`\n")
            f.write(f"- lag1 / lag16 embedding cosine distance: `{d['lag1_embedding_cosine_distance']}` / `{d['lag16_embedding_cosine_distance']}`\n")
            f.write(f"- embedding repeat exact: `{d['all_embedding_repeats_exact']}`; science `{c['experiment_seconds']:.4f}s`\n")
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-chronos-embedding-${{ github.run_id }}
          path: |
            out/chronos-embedding-localization.json
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
