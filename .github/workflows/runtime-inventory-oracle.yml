name: Compass Ollama Offline Runtime Inventory Oracle

on:
  pull_request:
    paths:
      - 'qualification/runtime_inventory_r0/**'
      - '.github/workflows/runtime-inventory-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-inventory-fixture:
    name: public-inventory-fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    timeout-minutes: 8
    steps:
      - name: Read source without persisting token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Offline synthetic negative oracles
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/runtime_inventory_r0
          GOPROXY=off GOSUMDB=off go test -count=3 -v ./...
          GOPROXY=off GOSUMDB=off go vet ./...
