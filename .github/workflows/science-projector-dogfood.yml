name: Science Projector Dogfood

on:
  pull_request:
    paths:
      - '.github/workflows/science-projector-dogfood.yml'

permissions:
  contents: read
  packages: read

jobs:
  openworker-projector-dogfood:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENWORKER_UPSTREAM_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      HARNESS_ARTIFACT_REF: 'ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83'
      HARNESS_ADMISSION_REF: 'github:SemperSupra/model-spelunker@9ac78865c2b1f20e18ca39087d8b267b98993769:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission.json'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-science-dogfood-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      MODEL_SPELUNKER_MODEL: 'ollama:qwen3:1.7b'
      MODEL_SPELUNKER_REASONING_EFFORT: 'none'
      QUALIFICATION_TASK: 'text-repair-v0'
      CANDIDATE_META: '/tmp/model-spelunker-science-dogfood-candidate.json'
      RECEIPT: '/tmp/model-spelunker-science-dogfood-receipt.json'
      DIAGNOSTICS: '/tmp/model-spelunker-science-dogfood-diagnostics.json'
      SCIENCE_OUTPUT: '.rdte/science-dogfood/openworker.json'
      DOGFOOD_SUMMARY: '.rdte/science-dogfood/summary.json'
      SUBSTRATE_PROFILE_COMMIT: 'science-projector-dogfood-v1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Hydrate admitted OpenWorker artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$HARNESS_ARTIFACT_REF" >/dev/null
          extract="$RUNNER_TEMP/openworker-artifact"
          mkdir -p "$extract"
          cid="$(docker create "$HARNESS_ARTIFACT_REF" /artifact/noop)"
          docker cp "$cid:/artifact/." "$extract/"
          docker rm "$cid" >/dev/null
          test -s "$extract/build-receipt.json"

          ARTIFACT_ROOT="$extract" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["ARTIFACT_ROOT"])
          receipt=json.loads((root/"build-receipt.json").read_text())
          assert receipt["harness"]["name"]=="openworker"
          assert receipt["source"]["revision"]==os.environ["OPENWORKER_UPSTREAM_SHA"]
          for row in receipt["payload"]["files"]:
              data=(root/row["path"]).read_bytes()
              assert len(data)==row["bytes"]
              assert hashlib.sha256(data).hexdigest()==row["sha256"]
          PY

          venv="$RUNNER_TEMP/openworker-dogfood-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --no-index --no-deps "$extract/wheelhouse"/*.whl
          "$venv/bin/python" -c 'import coworker; import coworker.engine'
          echo "OPENWORKER_VENV=$venv" >> "$GITHUB_ENV"

      - name: Install pinned Ollama and hydrate exact model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$OLLAMA_MODELS"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"

          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            "$runtime/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &

          for attempt in $(seq 1 60); do
            curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_HOST" "$runtime/bin/ollama" pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags",timeout=10) as response:
              data=json.load(response)
          row=next(m for m in data["models"] if m.get("name")==os.environ["OLLAMA_MODEL_TAG"])
          digest=str(row["digest"]).removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")

          task=json.loads(Path("qualification/tasks",os.environ["QUALIFICATION_TASK"],"task.json").read_text())
          projected_tools=task.get("projected_tools") or ["read_file","write_file"]
          candidate={
              "harness":{
                  "name":"openworker",
                  "version":os.environ["OPENWORKER_UPSTREAM_SHA"],
                  "artifact_ref":os.environ["HARNESS_ARTIFACT_REF"],
                  "admission_ref":os.environ["HARNESS_ADMISSION_REF"],
              },
              "model":{
                  "provider":"ollama",
                  "id":os.environ["OLLAMA_MODEL_TAG"],
                  "artifact_ref":f"ollama-sha256:{digest}",
              },
              "toolset":projected_tools,
              "configuration":{
                  "projection":projected_tools,
                  "parallel_tool_calls":False,
                  "max_tokens":2048,
                  "reasoning_effort":os.environ["MODEL_SPELUNKER_REASONING_EFFORT"],
                  "max_iterations":4,
                  "ollama_context_length":int(os.environ["OLLAMA_CONTEXT_LENGTH"]),
                  "harness_delivery":"prebuilt-admitted-artifact",
                  "science_projection":"explicit-opt-in",
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(json.dumps(candidate,indent=2,sort_keys=True)+"\n")
          PY

      - name: Dogfood unified runner with explicit science projector
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done
          mkdir -p "$(dirname "$SCIENCE_OUTPUT")"
          runner_log="$RUNNER_TEMP/science-dogfood-runner.log"

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-science-dogfood \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            --diagnostics "$DIAGNOSTICS" \
            --science-projector qualification/science_projectors/openworker_stdout.py \
            --science-projection-output "$SCIENCE_OUTPUT" \
            "qualification/tasks/$QUALIFICATION_TASK" \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- "$OPENWORKER_VENV/bin/python" "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py" \
            >"$runner_log" 2>&1
          qualification_rc=$?
          set -e

          test -s "$RECEIPT"
          test -s "$SCIENCE_OUTPUT"

          QUALIFICATION_RC="$qualification_rc" RUNNER_LOG="$runner_log" python3 - <<'PY'
          import json, os
          from pathlib import Path

          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          projection=json.loads(Path(os.environ["SCIENCE_OUTPUT"]).read_text())
          log=Path(os.environ["RUNNER_LOG"]).read_text(encoding="utf-8",errors="replace")

          marker="MODEL_SPELUNKER_SCIENCE_PROJECTION="
          rows=[line[len(marker):] for line in log.splitlines() if line.startswith(marker)]
          assert len(rows)==1, rows
          status=json.loads(rows[0])

          rc=int(os.environ["QUALIFICATION_RC"])
          assert rc==0, rc
          assert receipt["observation"]["success"] is True
          assert receipt["observation"]["verifier_exit_code"]==0
          assert receipt["observation"]["state_changed"] is True

          encoded_receipt=json.dumps(receipt,sort_keys=True).lower()
          assert "science_project" not in encoded_receipt
          assert "projection_status" not in encoded_receipt

          assert status["configured"] is True
          assert status["success"] is True
          assert status["output_present"] is True
          assert status["source_deleted"] is True
          assert status["projector_returncode"]==0

          summary=projection["summary"]
          assert summary["sensitive_content_retained"] is False
          assert summary["hidden_reasoning_inferred"] is False
          assert projection["qualification_state_changed"] is False
          assert summary["event_count"] > 0
          assert summary["model_call_started_count"] > 0

          out={
              "record_type":"science-projector-dogfood-result",
              "schema_version":1,
              "qualification":{
                  "exit_code":rc,
                  "success":receipt["observation"]["success"],
                  "verifier_exit_code":receipt["observation"]["verifier_exit_code"],
                  "state_changed":receipt["observation"]["state_changed"],
                  "receipt_contains_science_state":False,
              },
              "projector_status":status,
              "projection_summary":{
                  "event_count":summary["event_count"],
                  "model_call_started_count":summary["model_call_started_count"],
                  "provider_observation_count":summary["provider_observation_count"],
                  "tool_name_counts":summary["tool_name_counts"],
                  "sensitive_content_retained":summary["sensitive_content_retained"],
                  "hidden_reasoning_inferred":summary["hidden_reasoning_inferred"],
              },
          }
          Path(os.environ["DOGFOOD_SUMMARY"]).write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

          rm -f "$runner_log" "$DIAGNOSTICS"

      - name: Upload dogfood receipt and privacy-safe projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: science-projector-dogfood-${{ github.run_id }}
          path: |
            ${{ env.RECEIPT }}
            ${{ env.SCIENCE_OUTPUT }}
            ${{ env.DOGFOOD_SUMMARY }}
          if-no-files-found: error
          retention-days: 14
