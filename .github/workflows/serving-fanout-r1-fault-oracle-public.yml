name: serving-fanout-r1-fault-oracle-public
on:
  pull_request:
    paths:
      - 'qualification/serving_fanout_r0/falsification/**'
      - '.github/workflows/serving-fanout-r1-fault-oracle-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-state-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Run adversarial model checker and negative controls
        working-directory: qualification/serving_fanout_r0/falsification
        run: |
          go version
          go test -count=3 ./...
          go run . > "$RUNNER_TEMP/oracle.json"
          python3 - "$RUNNER_TEMP/oracle.json" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1], encoding="utf-8"))
          assert receipt["evidence_class"]=="SYNTHETIC_FINITE_STATE_NOT_PRODUCTION"
          assert receipt["safe_result"]=="NO_COUNTEREXAMPLE_WITHIN_BOUND"
          assert receipt["unsafe_result"]=="COUNTEREXAMPLE_FOUND"
          assert receipt["unsafe_counterexample"].count("effect")>=2
          assert receipt["verified_states"]>=10
          print("Bounded safe model PASS, unsafe negative control rejected:", receipt["unsafe_counterexample"])
          PY
      - name: Preserve immutable synthetic evidence output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serving-fanout-r1-fault-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle.json
          retention-days: 14
          if-no-files-found: ignore
