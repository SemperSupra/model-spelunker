name: Edge0 Memory Context Public Feasibility
# Synthetic/public inputs only: not a sovereign-host or real DLE actor test.
on:
  pull_request:
    paths:
      - '.github/workflows/edge0-memory-context-public.yml'
      - 'qualification/edge0_memory_context.py'
      - 'qualification/edge0_memory_context.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge0-memory-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.host }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native synthetic negative test and dry-readback
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/edge0_memory_context.py --self-test
          python3 qualification/edge0_memory_context.py --out "$RUNNER_TEMP/edge0-source.json" --levels 0,512,2048
          python3 - <<'PY'
          import json,os,platform,shutil
          from pathlib import Path
          d=shutil.disk_usage(os.environ['RUNNER_TEMP'])
          row={'schema':'edge0-host-census-v1','source_sha':os.environ['GITHUB_SHA'],
               'os':platform.system(),'arch':platform.machine(),'cpus':os.cpu_count(),
               'disk_free_bytes':d.free,'disk_total_bytes':d.total,'model_loaded':False}
          Path(os.environ['RUNNER_TEMP'],'edge0-host.json').write_text(json.dumps(row,sort_keys=True)+'\n')
          print('PASS synthetic source controls; MODEL_NOT_RUN')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: edge0-source-${{ matrix.host }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/edge0-source.json
            ${{ runner.temp }}/edge0-host.json
          if-no-files-found: ignore
          retention-days: 14

  model-m1:
    if: github.event_name == 'pull_request' && github.head_ref == 'exp/206-edge0-r2-mlx-m1-clean-20261121' && github.event.pull_request.head.repo.full_name == github.repository
    needs: source
    name: Exploratory real Edge0 8B via MLX on hosted M1
    runs-on: macos-15
    timeout-minutes: 28
    env:
      HF_HOME: ${{ runner.temp }}/edge0-hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MODEL_ID: Edge0/Edge0-8B-A1B-preview
      MODEL_DIR: ${{ runner.temp }}/edge0-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed if not Apple Silicon or adequate initial space
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,platform,shutil,subprocess
          ram=int(subprocess.check_output(['sysctl','-n','hw.memsize']).decode())
          disk=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print(f'CAPACITY_PREFLIGHT ram_bytes={ram} disk_free_bytes={disk}')
          assert platform.system()=='Darwin' and platform.machine()=='arm64'
          assert ram >= 6*1024**3 and disk >= 8*1024**3, 'insufficient available memory/disk'
          PY
      - name: Install exploratory MLX server, record exact resolved packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir 'mlx-lm>=0.28,<1.0' 'huggingface-hub>=0.27,<2.0'
          python3 -m pip freeze > "$RUNNER_TEMP/edge0-pip-versions.txt"
          python3 - <<'PY'
          import importlib.metadata
          print('MLX_VERSION='+importlib.metadata.version('mlx-lm'))
          PY
      - name: Discover exact model revision and gate model storage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from huggingface_hub import HfApi
          i=HfApi().model_info(os.environ['MODEL_ID'],files_metadata=True)
          n=sum(int(f.size or 0) for f in i.siblings)
          free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          row={'schema':'edge0-model-asset-v1','model':os.environ['MODEL_ID'],
               'sha':i.sha,'assets_bytes':n,'disk_available_bytes':free,'model_loaded':False}
          Path(os.environ['RUNNER_TEMP'],'edge0-assets.json').write_text(json.dumps(row,sort_keys=True)+'\n')
          print(f'MODEL_PREFLIGHT revision={i.sha} assets_bytes={n} available_bytes={free}')
          assert i.sha and n>0 and n+3*1024**3 < free, 'model footprint unqualified'
          PY
      - name: Download exact observed snapshot — one attempt, no private artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'edge0-assets.json').read_text())
          path=snapshot_download(repo_id=r['model'],revision=r['sha'],local_dir=os.environ['MODEL_DIR'],max_workers=2)
          assert Path(path,'config.json').is_file()
          print('MODEL_SNAPSHOT_HYDRATED sha='+r['sha'])
          PY
      - name: Prove local MLX endpoint really loads the model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m mlx_lm.server --model "$MODEL_DIR" --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/edge0-private-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/edge0-server.pid"
          ok=0
          for i in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/v1/models > /dev/null; then ok=1; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/edge0-server.pid")" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then echo 'INTEGRATION_UNKNOWN: model-server readiness not established' >&2; exit 1; fi
          echo 'LOCAL_MODEL_READY: mlx-lm integration, not Edge0 native-engine equivalence'
      - name: Observe real model with two context lengths and four treatments
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/edge0_memory_context.py \
            --base-url http://127.0.0.1:8080/v1 \
            --model Edge0/Edge0-8B-A1B-preview --levels 0,2048 --timeout 45 \
            --out "$RUNNER_TEMP/edge0-observed.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads(Path(os.environ['RUNNER_TEMP'],'edge0-observed.json').read_text())
          print('REAL_MODEL_OBSERVATION returned='+str(sum(x['observation']=='RETURNED' for x in a['cases']))+
                ' total='+str(len(a['cases']))+'; NOT agent qualification')
          PY
      - name: Retain sanitized model/assets/version observations only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: edge0-mlx-m1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/edge0-assets.json
            ${{ runner.temp }}/edge0-pip-versions.txt
            ${{ runner.temp }}/edge0-observed.json
          if-no-files-found: ignore
          retention-days: 14
