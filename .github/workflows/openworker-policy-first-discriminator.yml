name: OpenWorker Policy-First Discriminator

# Same task/model/harness/tool policy. Only task-neutral prompt treatment differs.
on:
  pull_request:
    paths:
      - '.github/workflows/openworker-policy-first-discriminator.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: openworker-policy-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  interview:
    name: Boundary policy read / ${{ matrix.treatment_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - treatment_id: qwen17-inspect-control
            tool_hint_mode: inspect-before-claim-v1
          - treatment_id: qwen17-policy-first
            tool_hint_mode: policy-first-v1
    uses: ./.github/workflows/openworker-prebuilt-ollama-qualification.yml
    with:
      artifact_ref: ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83
      admission_ref: github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json
      task: boundary-bugfix-v0
      reasoning_effort: none
      python_version: ''
      realization_profile_ref: ''
      realization_digest: ''
      output_diagnostic_mode: boundary-output-v1
      treatment_id: ${{ matrix.treatment_id }}
      tool_hint_mode: ${{ matrix.tool_hint_mode }}
