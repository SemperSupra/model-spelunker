name: R34 Three-Audience and ARM64 Source Contract
on:
  pull_request:
    paths:
      - 'qualification/harness_refresh/audience_contract.py'
      - 'qualification/harness_refresh/three_audience_example.json'
      - '.github/workflows/r34-three-audience-contract.yml'
permissions:
  contents: read
jobs:
  three-audience-contract:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject authority and audience-parity mutants
        run: |
          python3 -m py_compile qualification/harness_refresh/audience_contract.py
          python3 qualification/harness_refresh/audience_contract.py self-test
      - name: Verify source-only ARM64 exemplar
        run: |
          python3 qualification/harness_refresh/audience_contract.py qualification/harness_refresh/three_audience_example.json
