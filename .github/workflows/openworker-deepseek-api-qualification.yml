name: OpenWorker DeepSeek API Qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: DeepSeek model treatment
        required: true
        default: deepseek-flash
        type: choice
        options:
          - deepseek-flash
          - deepseek-v4-pro
      reasoning_effort:
        description: DeepSeek reasoning effort
        required: true
        default: none
        type: choice
        options:
          - none
          - low
          - high
          - max

permissions:
  contents: read

concurrency:
  group: openworker-deepseek-api-qualification-${{ github.ref }}-${{ inputs.model }}-${{ inputs.reasoning_effort }}
  cancel-in-progress: false

jobs:
  qualify:
    name: OpenWorker projected + ${{ inputs.model }} / ${{ inputs.reasoning_effort }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENWORKER_UPSTREAM_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_BASE: 'https://api.deepseek.com'
      MODEL_SPELUNKER_MODEL: 'deepseek:${{ inputs.model }}'
      MODEL_SPELUNKER_REASONING_EFFORT: '${{ inputs.reasoning_effort }}'
      MODEL_SPELUNKER_MAX_TOKENS: '2048'
      CANDIDATE_META: '/tmp/model-spelunker-openworker-deepseek-candidate.json'
      RECEIPT: '/tmp/model-spelunker-openworker-deepseek-receipt.json'
      SUBSTRATE_PROFILE_COMMIT: '2640b31a0cdcd2c4608a2042b3fe6c3dbf663302'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require bounded DeepSeek credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo 'QUALIFICATION_BOUNDARY=missing-DEEPSEEK_API_KEY'
            exit 78
          fi

      - name: Zero-inference DeepSeek API admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request=urllib.request.Request(
              os.environ["DEEPSEEK_API_BASE"].rstrip("/") + "/user/balance",
              headers={
                  "Accept":"application/json",
                  "Authorization":"Bearer " + os.environ["DEEPSEEK_API_KEY"],
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"DeepSeek admission failed: HTTP {exc.code}") from exc
          available=data.get("is_available")
          if not isinstance(available,bool):
              raise SystemExit("DeepSeek admission response missing is_available")
          currencies=sorted({
              row.get("currency")
              for row in data.get("balance_infos",[])
              if isinstance(row,dict) and isinstance(row.get("currency"),str)
          })
          print("DEEPSEEK_ADMISSION=" + json.dumps({
              "authenticated":True,
              "is_available":available,
              "currencies":currencies,
          },sort_keys=True))
          if not available:
              raise SystemExit("DeepSeek API authenticated but no balance is available")
          PY

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker"

      - name: Build hosted-model candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          model=os.environ["MODEL_SPELUNKER_MODEL"].split(":",1)[1]
          candidate={
              "harness":{
                  "name":"openworker",
                  "version":os.environ["OPENWORKER_UPSTREAM_SHA"],
              },
              "model":{
                  "provider":"deepseek",
                  "id":model,
              },
              "toolset":["filesystem"],
              "configuration":{
                  "projection":["read_file","write_file"],
                  "parallel_tool_calls":False,
                  "max_tokens":int(os.environ["MODEL_SPELUNKER_MAX_TOKENS"]),
                  "reasoning_effort":os.environ["MODEL_SPELUNKER_REASONING_EFFORT"],
                  "max_iterations":4,
                  "api_base":os.environ["DEEPSEEK_API_BASE"],
                  "provider_alias_semantics":"mutable hosted alias",
                  "api_contract_observed":"2026-09-20",
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(
              json.dumps(candidate,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "provider":"deepseek",
              "model":model,
              "reasoning_effort":os.environ["MODEL_SPELUNKER_REASONING_EFFORT"],
          },sort_keys=True))
          PY

      - name: Run same harness-neutral task through DeepSeek API
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-deepseek-api \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            qualification/tasks/text-repair-v0 \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- "$RUNNER_TEMP/openworker-venv/bin/python" \
              "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          qualification_rc=$?
          set -e

          test -f "$RECEIPT"
          QUALIFICATION_RC="$qualification_rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          rc=int(os.environ["QUALIFICATION_RC"])
          expected=os.environ["MODEL_SPELUNKER_MODEL"].split(":",1)[1]
          assert receipt["candidate"]["harness"]["name"]=="openworker"
          assert receipt["candidate"]["model"]["provider"]=="deepseek"
          assert receipt["candidate"]["model"]["id"]==expected
          assert rc==(0 if receipt["observation"]["success"] else 1)
          print(json.dumps(receipt,sort_keys=True))
          print("QUALIFICATION_RESULT=" + ("PASS" if receipt["observation"]["success"] else "FAIL (valid observation)"))
          PY
