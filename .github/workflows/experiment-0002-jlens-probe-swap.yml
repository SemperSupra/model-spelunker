name: experiment-0002-jlens-probe-swap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-probe-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install experiment dependencies
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'

      - name: Run causal J-space probe swap
        run: |
          python tools/run_jlens_probe_swap.py \
            --model EleutherAI/pythia-70m-deduped \
            --lens-repo neuronpedia/jacobian-lens \
            --lens-revision 91271eb5b15a43eebed7bb447618738754f1379a \
            --lens-file pythia-70m-deduped/jlens/Salesforce-wikitext/pythia-70m-deduped_jacobian_lens.pt \
            --alphas 1,2 \
            --max-items 90 \
            --output-dir artifacts/experiment-0002-jlens-probe-swap

      - name: Summarize causal calibration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('artifacts/experiment-0002-jlens-probe-swap/summary.json').read_text())
          print(f"evaluated={s['evaluated_clean_correct_single_token_items']}")
          print(f"skipped={s['skipped_items']}")
          for key, value in s['metrics'].items():
              print(f"{key}: {value}")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-jlens-probe-swap-${{ github.run_id }}
          path: artifacts/experiment-0002-jlens-probe-swap
          if-no-files-found: error
          retention-days: 14
