name: RDT&E Goose Prospective Trace

on:
  pull_request:
    paths:
      - '.github/workflows/rdte-goose-prospective-trace.yml'

permissions:
  contents: read
  packages: read

jobs:
  gst-p1:
    name: GST-P1 prospective stream projection
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HARNESS_ARTIFACT_REF: 'ghcr.io/sempersupra/model-spelunker-harness-goose@sha256:e4202698e3442086b2aa69de8d9a155740d2ddcb234905cc6e7108ed54f2b636'
      HARNESS_ADMISSION_REF: 'github:SemperSupra/model-spelunker@f03859d11da391706cedeb12a1d37e66bd234ee7:qualification/harness-artifacts/goose-2090ad1c65dd-linux-x64.admission.json'
      GOOSE_VERSION: '1.51.0'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_BIND: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-goose-rdte-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      MODEL_SPELUNKER_MODEL: 'qwen3:1.7b'
      GOOSE_OLLAMA_HOST: 'http://127.0.0.1:11434'
      GOOSE_XDG_CONFIG_HOME: '/tmp/model-spelunker-goose-rdte-config'
      GOOSE_XDG_DATA_HOME: '/tmp/model-spelunker-goose-rdte-data'

    steps:
      - name: Checkout RDT&E branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate admitted Goose artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$HARNESS_ARTIFACT_REF" >/dev/null
          extract="$RUNNER_TEMP/goose-artifact"
          mkdir -p "$extract"
          cid="$(docker create "$HARNESS_ARTIFACT_REF" /artifact/noop)"
          docker cp "$cid:/artifact/." "$extract/"
          docker rm "$cid" >/dev/null
          test -x "$extract/goose" || chmod 0755 "$extract/goose"
          "$extract/goose" --version | grep -F "$GOOSE_VERSION" >/dev/null
          echo "GOOSE_BIN=$extract/goose" >> "$GITHUB_ENV"

      - name: Install pinned Ollama and hydrate model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3             "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"             --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$OLLAMA_MODELS" "$GOOSE_XDG_CONFIG_HOME" "$GOOSE_XDG_DATA_HOME"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          OLLAMA_HOST="$OLLAMA_BIND" nohup "$runtime/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://$OLLAMA_BIND/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_BIND/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_BIND" "$runtime/bin/ollama" pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_BIND']}/api/tags", timeout=10) as response:
              data=json.load(response)
          row=next(m for m in data["models"] if m.get("name")==os.environ["OLLAMA_MODEL_TAG"])
          digest=str(row["digest"]).removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")
          PY

      - name: Run bounded prospective Goose rep and project stream
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done

          work="$RUNNER_TEMP/gst-p1-work"
          out="$GITHUB_WORKSPACE/.rdte/gst-p1"
          raw="$RUNNER_TEMP/gst-p1-stream.ndjson"
          stderr_file="$RUNNER_TEMP/gst-p1-stderr.log"
          time_file="$RUNNER_TEMP/gst-p1-time.env"
          mkdir -p "$work" "$out"
          printf 'BROKEN\n' > "$work/value.txt"
          cat > "$work/instruction.txt" <<'EOF'
          In the current workspace, use the available developer tools to change value.txt so its entire contents are exactly READY followed by a newline. Perform the edit; do not merely describe it.
          EOF

          set +e
          (
            cd "$work"
            /usr/bin/time               -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kbytes=%M\ncpu_percent=%P\nmajor_page_faults=%F\nminor_page_faults=%R\nvoluntary_context_switches=%w\ninvoluntary_context_switches=%c'               -o "$time_file"               timeout --signal=TERM --kill-after=5s 120s               python "$GITHUB_WORKSPACE/qualification/adapters/goose_cli.py"               < instruction.txt > "$raw" 2> "$stderr_file"
          )
          candidate_rc=$?
          set -e

          python "$GITHUB_WORKSPACE/qualification/rdte/goose_stream_trace.py"             "$raw"             --source-ref "ephemeral:gst-p1/run-${GITHUB_RUN_ID}/raw-stream"             --output "$out/trace.json" >/dev/null

          CANDIDATE_RC="$candidate_rc"           RAW_STREAM="$raw"           STDERR_FILE="$stderr_file"           TIME_FILE="$time_file"           WORKDIR="$work"           TRACE="$out/trace.json"           OUTPUT="$out/run-summary.json"           python3 - <<'PY'
          import json, os
          from pathlib import Path

          metrics={}
          for line in Path(os.environ["TIME_FILE"]).read_text(encoding="utf-8", errors="replace").splitlines():
              if "=" not in line:
                  continue
              key,value=line.split("=",1)
              if key=="cpu_percent":
                  metrics[key]=value
              else:
                  try:
                      metrics[key]=float(value) if "." in value else int(value)
                  except ValueError:
                      metrics[key]=None

          trace=json.loads(Path(os.environ["TRACE"]).read_text())
          final=Path(os.environ["WORKDIR"],"value.txt").read_text(encoding="utf-8",errors="replace")
          summary={
              "record_type":"goose-prospective-rdte-run",
              "schema_version":1,
              "treatment":{
                  "harness":"goose",
                  "harness_version":os.environ["GOOSE_VERSION"],
                  "harness_artifact_ref":os.environ["HARNESS_ARTIFACT_REF"],
                  "harness_admission_ref":os.environ["HARNESS_ADMISSION_REF"],
                  "model_provider":"ollama",
                  "model":os.environ["OLLAMA_MODEL_TAG"],
                  "model_digest_prefix":os.environ["OLLAMA_MODEL_DIGEST_PREFIX"],
                  "runtime":"github-actions/ubuntu-24.04",
              },
              "execution":{
                  "candidate_exit_code":int(os.environ["CANDIDATE_RC"]),
                  "state_changed":final!="BROKEN\n",
                  "verifier_pass":final=="READY\n",
                  "raw_stream_bytes":Path(os.environ["RAW_STREAM"]).stat().st_size,
                  "stderr_bytes":Path(os.environ["STDERR_FILE"]).stat().st_size,
                  "raw_stream_retained":False,
                  "stderr_retained":False,
              },
              "resources":metrics,
              "trace_summary":trace["summary"],
              "qualification_state_changed":False,
          }
          Path(os.environ["OUTPUT"]).write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "candidate_exit_code":summary["execution"]["candidate_exit_code"],
              "state_changed":summary["execution"]["state_changed"],
              "verifier_pass":summary["execution"]["verifier_pass"],
              "raw_stream_bytes":summary["execution"]["raw_stream_bytes"],
              "event_count":summary["trace_summary"]["event_count"],
              "assistant_message_groups":summary["trace_summary"]["assistant_message_groups"],
              "tool_request_count":summary["trace_summary"]["tool_request_count"],
              "tool_response_count":summary["trace_summary"]["tool_response_count"],
              "tool_error_count":summary["trace_summary"]["tool_error_count"],
              "max_rss_kbytes":summary["resources"].get("max_rss_kbytes"),
              "wall_seconds":summary["resources"].get("wall_seconds"),
          },sort_keys=True))
          PY

          rm -f "$raw" "$stderr_file" "$time_file" "$work/instruction.txt"

          python3 - <<'PY'
          import json
          from pathlib import Path
          trace=json.loads(Path(".rdte/gst-p1/trace.json").read_text())
          summary=json.loads(Path(".rdte/gst-p1/run-summary.json").read_text())
          assert trace["summary"]["sensitive_content_retained"] is False
          assert trace["summary"]["hidden_reasoning_inferred"] is False
          assert trace["summary"]["event_count"] > 0
          assert summary["execution"]["raw_stream_retained"] is False
          assert summary["execution"]["stderr_retained"] is False
          assert summary["qualification_state_changed"] is False
          PY

      - name: Upload privacy-safe RDT&E projection
        uses: actions/upload-artifact@v4
        with:
          name: gst-p1-prospective-trace
          path: .rdte/gst-p1
          if-no-files-found: error
          retention-days: 14
