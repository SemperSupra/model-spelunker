name: OpenRouter DeepSeek Route Probe

on:
  push:
    branches:
      - exp/qualification-next-tranche
    paths:
      - 'qualification/openrouter-route-probe-trigger.json'

permissions:
  contents: read

jobs:
  probe:
    environment: hosted-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe DeepSeek V4.1 Flash endpoint slugs without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          python3 - <<'PY'
          import json, os, urllib.request
          url="https://openrouter.ai/api/v1/models/deepseek/deepseek-v4.1-flash/endpoints"
          req=urllib.request.Request(
              url,
              headers={
                  "Authorization":"Bearer "+os.environ["OPENROUTER_API_KEY"],
                  "Accept":"application/json",
                  "User-Agent":"Model-Spelunker/1.0 (+https://github.com/SemperSupra/model-spelunker)",
              },
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          data=payload.get("data") or {}
          endpoints=data.get("endpoints") or []
          rows=[]
          for item in endpoints:
              if not isinstance(item,dict):
                  continue
              rows.append({
                  "name":item.get("name"),
                  "provider_name":item.get("provider_name"),
                  "provider_slug":item.get("provider_slug"),
                  "tag":item.get("tag"),
                  "supports_tool_parameters": all(
                      p in set(item.get("supported_parameters") or [])
                      for p in ("tools","tool_choice")
                  ),
                  "status":item.get("status"),
              })
          print("OPENROUTER_ENDPOINTS="+json.dumps(rows,sort_keys=True))
          slugs=sorted({
              str(row.get("provider_slug") or row.get("tag") or "")
              for row in rows
              if row.get("provider_slug") or row.get("tag")
          })
          print("OPENROUTER_PROVIDER_SLUGS="+json.dumps(slugs))
          PY
