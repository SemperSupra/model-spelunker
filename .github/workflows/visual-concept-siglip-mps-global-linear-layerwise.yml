name: SigLIP MPS Global Linear Residual Localization

on:
  push:
    branches:
      - exp/visual-concept-macos-mps-diagnostic
    paths:
      - 'scripts/visual_concept_siglip_mps_global_linear_layerwise.py'
      - '.github/workflows/visual-concept-siglip-mps-global-linear-layerwise.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localize:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile diagnostic
        run: python3 -m py_compile scripts/visual_concept_siglip_mps_global_linear_layerwise.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned inference dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            torch==2.14.0 transformers==5.17.0 pillow==12.3.0 requests==2.34.2 \
            sentencepiece==0.2.2 protobuf==7.36.1
      - name: Localize residual after global Linear patch
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
        run: |
          set -euo pipefail
          python scripts/visual_concept_siglip_mps_global_linear_layerwise.py \
            --config config/visual-concept-worker-public-safe-siglip.json \
            --out "$RUNNER_TEMP/visual-concept-siglip-mps-global-linear-layerwise.json"
      - name: Validate diagnostic contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"visual-concept-siglip-mps-global-linear-layerwise.json").read_text())
          assert r["runtime"]["mps_fallback_env"]=="0"
          assert r["model"]["family"]=="siglip"
          assert r["treatment"]["patched_linear_count"]>0
          assert r["oracle"]["cpu_control_pass"] is True
          assert set(r["towers"])=={"vision","text"}
          print(json.dumps({
            "patched_linear_count":r["treatment"]["patched_linear_count"],
            "rankings":r["rankings"],
            "first_material_divergence":{k:v["first_material_divergence"] for k,v in r["towers"].items()},
            "oracle":r["oracle"],
          },sort_keys=True))
          PY
      - name: Upload localization receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-concept-siglip-mps-global-linear-layerwise-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-concept-siglip-mps-global-linear-layerwise.json
          if-no-files-found: error
          retention-days: 7
