name: Cache lifecycle R7 corrected pre-readiness restore
on:
  pull_request:
    paths: ['.github/workflows/cache-lifecycle-swap-r3.yml']
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLAMA_REV: a6ac41c757c066941766164439f6876f2deaab04
      MODEL_SHA: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned native CPU server and obtain verified public fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-r0"
          cd "$RUNNER_TEMP/cache-r0"
          git init upstream
          git -C upstream remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C upstream fetch --depth=1 origin "$LLAMA_REV"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$LLAMA_REV"
          cmake -S upstream -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build --target llama-server -j 2
          curl --fail --location --retry 2 --max-time 120 https://huggingface.co/ggml-org/test-model-stories260K/resolve/main/stories260K-f32.gguf -o model.gguf
          printf '%s  model.gguf\n' "$MODEL_SHA" | sha256sum -c -
          curl --fail --location --retry 2 --max-time 120 https://huggingface.co/ggml-org/stories15M_MOE/resolve/main/stories15M_MOE-F16.gguf -o model-b.gguf
          printf '%s  model-b.gguf\n' 1240dfc1957df9f3550dd6c1d9e64b466fc2f452d8bc34bd4e45e1a1e2ca6055 | sha256sum -c -
          sha256sum build/bin/llama-server model.gguf model-b.gguf > identities.txt
          cp upstream/LICENSE upstream-license.txt
      - name: Install pinned llama-swap release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cache-r0"
          curl --fail --location --max-time 120 --retry 2 https://github.com/mostlygeek/llama-swap/releases/download/v276/llama-swap_276_linux_amd64.tar.gz -o swap.tar.gz
          printf '%s  swap.tar.gz\n' 37493a0f725e407a3a96cf26927cc04c3e544b9a55a1141e267510901f74aef8 | sha256sum -c -
          mkdir swap
          tar -xzf swap.tar.gz -C swap
          find "$PWD/swap" -type f -name llama-swap -print -quit > swap-path.txt
          test -s swap-path.txt
          sha256sum "$(cat swap-path.txt)" >> identities.txt
      - name: Install native loopback relay for readiness fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v socat; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends socat; fi
          socat -V > "$RUNNER_TEMP/cache-r0/socat-version.txt"
      - name: Native router eviction and fenced startup restoration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cache-r0"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time,urllib.request,shlex
          root=pathlib.Path.cwd()
          (root/'slots').mkdir()
          def request(port,path,data=None):
              with urllib.request.urlopen(urllib.request.Request(f'http://127.0.0.1:{port}'+path,data=None if data is None else json.dumps(data).encode(),headers={'Content-Type':'application/json'}),timeout=90) as r:
                  raw=r.read()
                  try:return json.loads(raw)
                  except json.JSONDecodeError:return raw.decode()
          def wait(port,path):
              for _ in range(120):
                  try:return request(port,path)
                  except OSError:time.sleep(.25)
              raise RuntimeError('readiness timeout')
          def alive(pid):
              return pathlib.Path(f'/proc/{pid}').exists()
          hook=root/'stop-a.py'
          hook.write_text("#!/usr/bin/env python3\nimport hashlib,json,os,pathlib,signal,sys,time,urllib.request\nroot=pathlib.Path(__file__).resolve().parent\npid=int(sys.argv[1])\n# This hook is scoped to the isolated fixture process, not a shared server.\nassert int((root/'a.pid').read_text())==pid\narm=root/'arm.json'\ntry:\n    if arm.exists():\n        claim=root/'arm.claim'\n        os.replace(arm,claim)\n        ticket=json.loads(claim.read_text())\n        assert ticket['pid']==pid and type(ticket['rep']) is int and 0<=ticket['rep']<3\n        i=ticket['rep']\n        slots=root/'slots'\n        staging=f'session-{i}.partial'\n        snap=slots/f'session-{i}.bin'\n        assert not snap.exists()\n        t=time.monotonic()\n        request=urllib.request.Request('http://127.0.0.1:18081/slots/0?action=save',data=json.dumps({'filename':staging}).encode(),headers={'Content-Type':'application/json'})\n        with urllib.request.urlopen(request,timeout=2) as res:\n            saved=json.load(res)\n        tmp=slots/staging\n        assert saved['n_saved']>0 and saved['n_written']==tmp.stat().st_size\n        with tmp.open('rb') as f:\n            data=f.read()\n            os.fsync(f.fileno())\n        os.replace(tmp,snap)\n        d=os.open(slots,os.O_RDONLY|os.O_DIRECTORY)\n        try:os.fsync(d)\n        finally:os.close(d)\n        event=dict(pid=pid,rep=i,save_s=time.monotonic()-t,sha256=hashlib.sha256(data).hexdigest(),saved=saved)\n        (root/f'event-{i}.json').write_text(json.dumps(event))\n        claim.unlink()\nfinally:\n    try:os.kill(pid,signal.SIGTERM)\n    except ProcessLookupError:pass\n")
          hook.chmod(0o700)
          supervisor=root/'start-a.py'
          supervisor.write_text("#!/usr/bin/env python3\nimport hashlib,json,os,pathlib,signal,socket,subprocess,sys,time,urllib.request\nroot=pathlib.Path(__file__).resolve().parent\n(root/'a.pid').write_text(str(os.getpid()))\nchildren=[]\ndef stop(sig,frame):raise SystemExit(0)\nsignal.signal(signal.SIGTERM,stop)\nsignal.signal(signal.SIGINT,stop)\ndef req(path,data=None):\n    r=urllib.request.Request('http://127.0.0.1:18083'+path,data=None if data is None else json.dumps(data).encode(),headers={'Content-Type':'application/json'})\n    with urllib.request.urlopen(r,timeout=2) as resp:return json.load(resp)\ndef closed():\n    with socket.socket() as sock:\n        sock.settimeout(.2)\n        return sock.connect_ex(('127.0.0.1',18081))!=0\ntry:\n    args=sys.argv[1:]\n    assert closed()\n    children.append(subprocess.Popen(args))\n    for _ in range(100):\n        assert children[0].poll() is None\n        try:\n            req('/health')\n            break\n        except OSError:time.sleep(.1)\n    else:raise RuntimeError('backend readiness timeout')\n    assert closed(), 'relay exposed before restore disposition'\n    ticket=root/'resume.json'\n    if ticket.exists():\n        claim=root/'resume.claim'\n        os.replace(ticket,claim)\n        t=json.loads(claim.read_text())\n        i=t['rep']\n        assert type(i) is int and 0<=i<3 and t['kind'] in ('valid','negative')\n        result=dict(rep=i,kind=t['kind'],pid=os.getpid(),gate_closed=closed(),native_restore_called=False)\n        started=time.monotonic()\n        snap=root/'slots'/f'session-{i}.bin'\n        event=json.loads((root/f'event-{i}.json').read_text())\n        identity_ok=t.get('model_sha')==os.environ['MODEL_SHA'] and t.get('runtime_sha')==os.environ['LLAMA_REV']\n        if not snap.is_file():result['outcome']='cold_missing'\n        elif not identity_ok or hashlib.sha256(snap.read_bytes()).hexdigest()!=t.get('sha256') or t.get('sha256')!=event['sha256']:\n            result['outcome']='cold_rejected'\n        else:\n            result['native_restore_called']=True\n            try:\n                restored=req('/slots/0?action=restore',{'filename':snap.name})\n                if restored['n_restored']!=event['saved']['n_saved']:raise ValueError('token count mismatch')\n                result.update(outcome='restored',restored_count=restored['n_restored'])\n            except Exception:\n                # Native failure may leave partial state. Do not publish readiness.\n                raise RuntimeError('native restore failed; abort this start')\n        result['restore_s']=time.monotonic()-started\n        result['gate_closed_at_commit']=closed()\n        assert result['gate_closed_at_commit']\n        dest=root/f\"ready-{i}-{t['kind']}.json\"\n        tmp=dest.with_suffix('.tmp')\n        tmp.write_text(json.dumps(result))\n        os.replace(tmp,dest)\n        claim.unlink()\n    assert closed()\n    children.append(subprocess.Popen(['socat','TCP-LISTEN:18081,bind=127.0.0.1,reuseaddr,fork','TCP:127.0.0.1:18083']))\n    while all(p.poll() is None for p in children):time.sleep(.05)\n    raise RuntimeError('backend or relay exited')\nfinally:\n    for p in reversed(children):\n        if p.poll() is None:p.terminate()\n    for p in reversed(children):\n        try:p.wait(timeout=2)\n        except subprocess.TimeoutExpired:p.kill();p.wait()\n")
          supervisor.chmod(0o700)
          # Generate PID launchers without shell interpolation, and prove identity before inference.
          def make_pid_launcher(script,pid_file,args):
              script.write_text('#!/usr/bin/env python3\nimport os,pathlib\npathlib.Path('+repr(str(pid_file))+').write_text(str(os.getpid()))\nargs='+repr(args)+'\nos.execv(args[0],args)\n')
              script.chmod(0o700)
          probe=root/'launcher-probe.py'
          probe_pid=root/'launcher-probe.pid'
          make_pid_launcher(probe,probe_pid,['/bin/true'])
          test=subprocess.Popen([str(probe)])
          assert test.wait(timeout=5)==0 and int(probe_pid.read_text())==test.pid
          models={}
          for name,port,file in [('a',18081,'model.gguf'),('b',18082,'model-b.gguf')]:
              script=root/('start-'+name+'.sh')
              args=[str(root/'build/bin/llama-server'),'-m',str(root/file),'-c','512','-np','1','-t','2','--host','127.0.0.1','--port',str(port),'--slot-save-path',str(root/'slots')]
              if name=='a':
                  args[args.index('--port')+1]='18083'
                  script.write_text('#!/bin/sh\nexec '+shlex.join([str(supervisor)]+args)+'\n')
              else:
                  make_pid_launcher(script,root/(name+'.pid'),args)
              script.chmod(0o700)
              models[name]={'cmd':str(script),'proxy':f'http://127.0.0.1:{port}'}
          models['a']['cmdStop']=str(hook)+' ${PID}'
          config=root/'swap.json'
          config.write_text(json.dumps({'healthCheckTimeout':30,'models':models}))
          log=open(root/'swap.log','wb')
          p=subprocess.Popen([(root/'swap-path.txt').read_text().strip(),'-config',str(config),'-listen','127.0.0.1:18080'],stdout=log,stderr=log)
          rows=[]
          def receipt():
              (root/'receipt.json').write_text(json.dumps({'scope':'native llama-swap opt-in stop checkpoint and pre-readiness restoration, single-client fixture only','workflow_sha':os.environ['GITHUB_SHA'],'rows':rows},indent=2))
          def completion(port,prompt,model=None,n=8):
              d={'prompt':prompt,'id_slot':0,'n_predict':n,'temperature':0,'seed':42,'cache_prompt':True}
              if model:d['model']=model
              t=time.monotonic()
              r=request(port,'/completion',d)
              return {'content':r['content'],'timings':r['timings'],'wall_s':time.monotonic()-t}
          def pid(name):return int((root/(name+'.pid')).read_text())
          try:
              wait(18080,'/health')
              for i in range(3):
                  row={'rep':i};rows.append(row)
                  prefix=('Once upon a time there was a little cat. '*12)+str(i)+' '
                  seed=completion(18080,prefix,'a',4)
                  target=prefix+seed['content']+' Then '
                  row['seed_pid']=pid('a')
                  snap=root/'slots'/f'session-{i}.bin'
                  assert not snap.exists()
                  (root/'arm.json').write_text(json.dumps(dict(pid=row['seed_pid'],rep=i)))
                  row['b']=completion(18080,'An unrelated story about a dog.','b')
                  event=json.loads((root/f'event-{i}.json').read_text())
                  assert event['pid']==row['seed_pid'] and event['rep']==i and not (root/'arm.json').exists()
                  row['checkpoint_event']=event
                  saved=event['saved'];row['save_s']=event['save_s']
                  row['snapshot_sha256']=hashlib.sha256(snap.read_bytes()).hexdigest()
                  assert row['snapshot_sha256']==event['sha256']
                  row['b_pid']=pid('b')
                  assert not alive(row['seed_pid'])
                  row['cold']=completion(18080,target,'a')
                  row['cold_pid']=pid('a')
                  assert not alive(row['b_pid']) and row['cold_pid']!=row['seed_pid']
                  completion(18080,'An unrelated story about a tree.','b')
                  assert not alive(row['cold_pid'])
                  ticket=dict(rep=i,kind='valid',sha256=event['sha256'],model_sha=os.environ['MODEL_SHA'],runtime_sha=os.environ['LLAMA_REV'])
                  (root/'resume.json').write_text(json.dumps(ticket))
                  row['restored']=completion(18080,target,'a')
                  ready=json.loads((root/f'ready-{i}-valid.json').read_text())
                  row['restore_ready_event']=ready
                  row['restore_pid']=pid('a')
                  assert ready['pid']==row['restore_pid'] and ready['outcome']=='restored' and ready['native_restore_called'] and ready['gate_closed'] and ready['gate_closed_at_commit']
                  assert row['restore_pid'] not in (row['seed_pid'],row['cold_pid'])
                  assert not (root/'resume.json').exists() and not (root/'resume.claim').exists()
                  row['restore_s']=ready['restore_s']
                  restored={'n_restored':ready['restored_count']}
                  completion(18080,'Switch to unrelated model.','b')
                  bad=dict(ticket,kind='negative')
                  if i==0:bad['sha256']='0'*64
                  elif i==1:bad['model_sha']='0'*64
                  else:snap.rename(snap.with_suffix('.backup'))
                  (root/'resume.json').write_text(json.dumps(bad))
                  row['negative']=completion(18080,target,'a')
                  rejected=json.loads((root/f'ready-{i}-negative.json').read_text())
                  row['negative_ready_event']=rejected
                  assert rejected['outcome'] in ('cold_rejected','cold_missing') and not rejected['native_restore_called'] and rejected['gate_closed'] and rejected['gate_closed_at_commit']
                  assert row['negative']['content']==row['cold']['content'] and row['negative']['timings']['prompt_n']==row['cold']['timings']['prompt_n']
                  if i==2:snap.with_suffix('.backup').rename(snap)
                  row['match']=row['cold']['content']==row['restored']['content']
                  row['reduced']=row['restored']['timings']['prompt_n']<row['cold']['timings']['prompt_n']
                  row['restored_count']=restored['n_restored']
                  receipt()
                  assert row['match'] and row['reduced'] and restored['n_restored']==saved['n_saved']>0
                  assert len(list((root/'slots').glob('session-*.bin')))==i+1
          finally:
              p.terminate()
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:p.kill();p.wait()
              log.close()
              receipt()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llama-cache-swap-r7
          path: |
            ${{ runner.temp }}/cache-r0/receipt.json
            ${{ runner.temp }}/cache-r0/identities.txt
            ${{ runner.temp }}/cache-r0/upstream-license.txt
            ${{ runner.temp }}/cache-r0/swap.log
            ${{ runner.temp }}/cache-r0/swap.json
            ${{ runner.temp }}/cache-r0/event-*.json
            ${{ runner.temp }}/cache-r0/ready-*.json
            ${{ runner.temp }}/cache-r0/socat-version.txt
          if-no-files-found: warn
          retention-days: 14
