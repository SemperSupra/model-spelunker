name: Faster Whisper Multilingual Generalization Rep

on:
  push:
    branches:
      - impl/audio-asr-portability-stage
    paths:
      - "experiments/mvp/audio_multilingual_panel.json"
      - "experiments/mvp/run_audio_multilingual_generalization.py"
      - "experiments/mvp/validate_audio_multilingual_generalization.py"
      - ".github/workflows/audio-multilingual-generalization.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: asr/faster-whisper/tiny
  EXPECTED_DIGEST: sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6622753fd5914be87fb1b6d987ceb7cae46c7ff5
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Derive runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out samples
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact ASR runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .asr-venv
          key: model-spelunker-faster-whisper-tiny-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-fw1.2.1-ct2-4.6.0

      - name: Build exact CPU ASR runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .asr-venv
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "faster-whisper==1.2.1" "ctranslate2==4.6.0"

      - name: Verify exact approved Foundry selector
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path('foundry/catalog/approved.json').read_text())
          e=c['artifacts'][os.environ['LOGICAL_ID']]
          assert e['approved_digest']==os.environ['EXPECTED_DIGEST']
          assert e['upstream_exact_revision']=='d90ca5fe260221311c53c58e660288d3deb8d356'
          PY

      - name: Acquire and verify pinned multilingual sample panel
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          m=json.loads(Path('experiments/mvp/audio_multilingual_panel.json').read_text())
          out={'source_repository':m['source_repository'],'source_commit':m['source_commit'],'repository_license':m['repository_license'],'samples':{}}
          for s in m['samples']:
              url=f"https://raw.githubusercontent.com/{m['source_repository']}/{m['source_commit']}/{s['path']}"
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SemperSupra-model-spelunker/1'}),timeout=60).read()
              git=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              assert git==s['git_blob_sha1'], (s['id'],git,s['git_blob_sha1'])
              sha='sha256:'+hashlib.sha256(data).hexdigest()
              Path(f"samples/{s['id']}.wav").write_bytes(data)
              out['samples'][s['id']]={'path':s['path'],'git_blob_sha1':git,'sha256':sha,'size_bytes':len(data),'raw_url':url}
          Path('out/sample-panel-resolved.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'sample_count':len(out['samples']),'total_bytes':sum(v['size_bytes'] for v in out['samples'].values())},sort_keys=True))
          PY

      - name: Authenticate bounded Foundry read
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Hydrate approved model and prove offline reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/model-spelunker-asr-multilingual
          START_NS="$(date +%s%N)"
          MODEL1="$(.asr-venv/bin/python foundry/tools/hydrate.py --catalog foundry/catalog/approved.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-asr-multilingual --oras "$(command -v oras)" | tail -n1)"
          END_NS="$(date +%s%N)"
          MODEL2="$(.asr-venv/bin/python foundry/tools/hydrate.py --catalog foundry/catalog/approved.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-asr-multilingual --oras /bin/false | tail -n1)"
          test "$MODEL1" = "$MODEL2"
          echo "model_dir=$MODEL2" >> "$GITHUB_OUTPUT"
          echo "hydrate_seconds=$(python3 -c "print((${END_NS}-${START_NS})/1e9)")" >> "$GITHUB_OUTPUT"

      - name: Run multilingual generalization rep
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
        run: |
          set -euo pipefail
          /usr/bin/time -v .asr-venv/bin/python experiments/mvp/run_audio_multilingual_generalization.py \
            --model-dir "$MODEL_DIR" \
            --samples-dir samples \
            --panel-manifest experiments/mvp/audio_multilingual_panel.json \
            --resolved-manifest out/sample-panel-resolved.json \
            --output out/audio-multilingual-generalization.json \
            2>&1 | tee out/run.log

      - name: Validate evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1" >/dev/null
          .asr-venv/bin/python experiments/mvp/validate_audio_multilingual_generalization.py out/audio-multilingual-generalization.json | tee out/validation.log

      - name: Summarize descriptive result
        shell: bash
        env:
          HYDRATE_SECONDS: ${{ steps.hydrate.outputs.hydrate_seconds }}
        run: |
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads(Path('out/audio-multilingual-generalization.json').read_text()); d=b['derived_metrics']; c=b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Multilingual audio generalization\n\n')
              f.write(f"- baseline expected-language matches: `{d['baseline_expected_language_matches']}/9`\n")
              f.write(f"- exact baseline encoder repeats: `{d['all_baseline_encoder_repeats_exact']}`\n")
              f.write(f"- exact baseline transcript repeats: `{d['all_baseline_transcript_repeats_exact']}`\n")
              for lang,row in d['per_language'].items():
                  f.write(f"- {lang}: 20dB CER `{row['snr_20db']['normalized_char_edit_distance']:.3f}`, 10dB CER `{row['snr_10db']['normalized_char_edit_distance']:.3f}`, quiet CER `{row['gain_0.125']['normalized_char_edit_distance']:.3f}`, silence CER `{row['silence_500ms']['normalized_char_edit_distance']:.3f}`\n")
              f.write(f"- hydration `{float(os.environ['HYDRATE_SECONDS']):.3f}s`, science `{c['experiment_seconds']:.3f}s`, RSS `{c['peak_rss_mib']:.1f} MiB`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-audio-multilingual-${{ github.run_id }}
          path: |
            out/audio-multilingual-generalization.json
            out/sample-panel-resolved.json
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
