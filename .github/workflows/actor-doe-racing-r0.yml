name: Actor DOE racing robustness R1
on:
  pull_request:
    paths:
      - 'qualification/actor_doe_racing_r0/**'
      - '.github/workflows/actor-doe-racing-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install pinned upstream library
        run: |
          python3 -m venv "$RUNNER_TEMP/exp"
          "$RUNNER_TEMP/exp/bin/pip" install --disable-pip-version-check 'git+https://github.com/optuna/optuna.git@0abf066c1e5d9d83987986869daa3c2bb23df519'
          "$RUNNER_TEMP/exp/bin/pip" freeze > dependencies.txt
      - name: Execute independent synthetic controls
        run: |
          "$RUNNER_TEMP/exp/bin/python" qualification/actor_doe_racing_r0/prove.py evidence
          "$RUNNER_TEMP/exp/bin/python" qualification/actor_doe_racing_r0/robustness.py robustness-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: actor-doe-racing-r0
          path: |
            evidence
            robustness-evidence
            dependencies.txt
          retention-days: 7
