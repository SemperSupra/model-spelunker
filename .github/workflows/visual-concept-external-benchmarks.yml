name: Visual Concept External Benchmark Semantics

on:
  pull_request:
    paths:
      - 'scripts/external_presence_eval.py'
      - 'scripts/xm3600_adapter.py'
      - 'scripts/external_benchmark_ringer.py'
      - 'data/external-benchmarks/xm3600-source.json'
      - '.github/workflows/visual-concept-external-benchmarks.yml'
      - 'docs/visual-concept-external-benchmarks.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-concept-external-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Qualify external benchmark semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/external_benchmark_ringer.py
