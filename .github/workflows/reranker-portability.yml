name: MiniLM Reranker Portability Rep

on:
  push:
    branches:
      - impl/reranker-portability-stage
    paths:
      - "experiments/mvp/run_reranker_portability.py"
      - "experiments/mvp/validate_reranker_portability.py"
      - ".github/workflows/reranker-portability.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: rerank/cross-encoder/ms-marco-minilm-l6-v2
  UPSTREAM_REVISION: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  CANDIDATE_DIGEST: sha256:88a3ed0cffeca20e53ee628f574a9202a647f4abde458122ea169292b62a2315
  FOUNDRY_EVIDENCE_COMMIT: 6033d8e2d39b1fa985021c961ff5f3cfd62205c3
  FOUNDRY_EVIDENCE_PATH: candidates/rerank-ms-marco-minilm-l6-v2/233902d25c440f23af6f7d6e94d2946bac0bee0a/11b8400016e75ea672cfc52c66db3085952b1b51/candidate.json

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact Foundry candidate evidence revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6033d8e2d39b1fa985021c961ff5f3cfd62205c3
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Derive exact CPU runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact reranker runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .reranker-venv
          key: model-spelunker-reranker-minilm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-torch2.14.0-transformers5.16.1-jsonschema4.25.1

      - name: Build exact CPU runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .reranker-venv
          .reranker-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0"
          .reranker-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "transformers==5.16.1" \
            "jsonschema==4.25.1"

      - name: Record exact runtime identity
        shell: bash
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          .reranker-venv/bin/python - <<'PY' | tee out/runtime.json
          import json, os, platform
          import torch, transformers, jsonschema
          print(json.dumps({
              "cache_hit": os.environ.get("CACHE_HIT") == "true",
              "python": platform.python_version(),
              "torch": torch.__version__,
              "transformers": transformers.__version__,
              "jsonschema": __import__("importlib.metadata").metadata.version("jsonschema"),
          }, sort_keys=True))
          PY

      - name: Verify exact Foundry candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          .reranker-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path("foundry", os.environ["FOUNDRY_EVIDENCE_PATH"]).read_text())
          assert c["state"] == "candidate"
          assert c["logical_id"] == os.environ["LOGICAL_ID"]
          assert c["upstream"]["exact_revision"] == os.environ["UPSTREAM_REVISION"]
          assert c["oci"]["digest"] == os.environ["CANDIDATE_DIGEST"]
          assert c["oci"]["pullback_verified"] is True
          assert c["validation"]["status"] == "passed"
          PY

      - name: Authenticate bounded Foundry read
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Hydrate exact candidate digest once and prove local reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          .reranker-venv/bin/python foundry/tools/harvest_reranker_minilm.py temporary-catalog \
            --candidate "foundry/${FOUNDRY_EVIDENCE_PATH}" \
            --output /tmp/reranker-candidate-catalog.json
          rm -rf /tmp/model-spelunker-reranker-candidate
          START_NS="$(date +%s%N)"
          MODEL1="$(.reranker-venv/bin/python foundry/tools/hydrate.py \
            --catalog /tmp/reranker-candidate-catalog.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-reranker-candidate \
            --oras "$(command -v oras)" | tail -n1)"
          END_NS="$(date +%s%N)"
          MODEL2="$(.reranker-venv/bin/python foundry/tools/hydrate.py \
            --catalog /tmp/reranker-candidate-catalog.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-reranker-candidate \
            --oras /bin/false | tail -n1)"
          test "${MODEL1}" = "${MODEL2}"
          test -d "${MODEL2}"
          HYDRATE_SECONDS="$(python3 -c "print((${END_NS}-${START_NS})/1e9)")"
          echo "model_dir=${MODEL2}" >> "$GITHUB_OUTPUT"
          echo "hydrate_seconds=${HYDRATE_SECONDS}" >> "$GITHUB_OUTPUT"
          printf 'model_dir=%s\nhydrate_seconds=%s\n' "${MODEL2}" "${HYDRATE_SECONDS}" | tee out/hydration.txt

      - name: Run scalar reranker portability rep
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
        run: |
          set -euo pipefail
          /usr/bin/time -v .reranker-venv/bin/python experiments/mvp/run_reranker_portability.py \
            --model-dir "${MODEL_DIR}" \
            --identity-digest "${CANDIDATE_DIGEST}" \
            --foundry-record-ref "SemperSupra/model-artifact-foundry@${FOUNDRY_EVIDENCE_COMMIT}:${FOUNDRY_EVIDENCE_PATH}" \
            --output out/reranker-portability.json \
            2>&1 | tee out/run.log

      - name: Validate reranker evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .reranker-venv/bin/python experiments/mvp/validate_reranker_portability.py \
            out/reranker-portability.json | tee out/validation.log

      - name: Summarize descriptive result
        shell: bash
        env:
          HYDRATE_SECONDS: ${{ steps.hydrate.outputs.hydrate_seconds }}
        run: |
          set -euo pipefail
          .reranker-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b = json.loads(Path("out/reranker-portability.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## MiniLM reranker portability — candidate artifact\n\n")
              f.write(f"- Foundry state: `{b['model_identity']['foundry_state']}` (not approved)\n")
              f.write(f"- immutable candidate digest: `{b['artifact_provenance']['identity_digest']}`\n")
              f.write(f"- cold candidate hydration: `{float(os.environ['HYDRATE_SECONDS']):.3f} s`\n")
              f.write(f"- model load: `{b['cost']['model_load_seconds']:.3f} s`\n")
              f.write(f"- science step: `{b['cost']['experiment_seconds']:.3f} s`\n")
              f.write(f"- peak RSS: `{b['cost']['peak_rss_mib']:.1f} MiB`\n")
              f.write(f"- repeat max abs delta: `{b['derived_metrics']['max_repeat_abs_delta']}`\n")
              for row in b['observations']['probe_families']:
                  f.write(f"- {row['family_id']} direct top: `{row['direct_top_id']}`, margin: `{row['direct_best_relevant_margin']:.4f}`, negation delta: `{row['direct_relevant_vs_negated_delta']:.4f}`\n")
                  f.write(f"- {row['family_id']} paraphrase top: `{row['paraphrase_top_id']}`, margin: `{row['paraphrase_best_relevant_margin']:.4f}`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-reranker-portability-${{ github.run_id }}
          path: |
            out/reranker-portability.json
            out/runtime.json
            out/hydration.txt
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
