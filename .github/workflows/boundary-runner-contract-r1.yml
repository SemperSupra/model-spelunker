name: Boundary canonical runner portability R1
on:
  pull_request:
    paths:
      - 'qualification/boundary_contract/**'
      - '.github/workflows/boundary-runner-contract-r1.yml'
permissions:
  contents: read
jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/boundary_contract/prove_runner.py boundary-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-contract-${{ matrix.os }}
          path: boundary-evidence
          retention-days: 7
