name: R39 Sovereign Adapter Approval Fail-Closed
on:
  pull_request:
    paths:
      - 'qualification/adapters/aider_cli.py'
      - 'qualification/test_windows_sovereign_adapters.py'
      - '.github/workflows/r39-aider-failclosed.yml'
permissions:
  contents: read
jobs:
  synthetic-aider-authority:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: No network, model calls, or secrets; reject live Aider invocation
        run: |
          python -m py_compile qualification/adapters/aider_cli.py qualification/test_windows_sovereign_adapters.py
          python qualification/test_windows_sovereign_adapters.py
