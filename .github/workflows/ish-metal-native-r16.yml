name: ISH R17 Metal backend-specific Torch compatibility matrix
on:
  pull_request:
    paths: ['.github/workflows/ish-metal-native-r16.yml']
permissions:
  contents: read
jobs:
  metal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        torch_arm: [declared, upstream_override]
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TORCH_ARM: '${{ matrix.torch_arm }}'
      METAL_REV: d1447c4a539b86166ae85293d269fbdfada47753
      MODEL_REV: 73e3e38d981303bc594367cd910ea6eb48349da8
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_METAL_BACKEND: mlx
      GLOO_SOCKET_IFNAME: lo0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact released native wheel pair and inspect device
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/ish-metal/evidence"
          cd "$RUNNER_TEMP/ish-metal"
          git init upstream
          git -C upstream remote add origin https://github.com/vllm-project/vllm-metal.git
          git -C upstream fetch --depth=1 origin "$METAL_REV"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$METAL_REV"
          git -C upstream rev-parse HEAD > evidence/source.txt
          sw_vers > evidence/platform.txt
          sysctl -n hw.memsize >> evidence/platform.txt
          python3.12 -m venv venv
          source venv/bin/activate
          python -m pip install uv==0.8.22
          core='vllm-0.34.0+cpu-cp38-abi3-macosx_11_0_arm64.whl'
          plugin='vllm_metal-0.34.0-cp312-cp312-macosx_15_0_arm64.whl'
          curl --fail --location --max-time 300 --retry 2 'https://github.com/vllm-project/vllm/releases/download/v0.34.0/vllm-0.34.0%2Bcpu-cp38-abi3-macosx_11_0_arm64.whl' -o "$core"
          curl --fail --location --max-time 120 --retry 2 "https://github.com/vllm-project/vllm-metal/releases/download/v0.34.0/$plugin" -o "$plugin"
          printf '%s  %s\n' cd0abe2a9d698bc0bef36ac9aa38da34307c53572ddee60ca35faef280af99d2 "$core" 27141e0134e92358b494b3609df3a3f4be611852a9201b34ad7dbc0cbad8029f "$plugin" | shasum -a 256 -c -
          # Hold the major ABI and test dependencies at their R16 observed versions.
          uv pip install "./$core" "./$plugin" pytest==9.2.0 numpy==2.3.5 mlx==0.32.4 transformers==5.22.2 "torch==2.14.0"
          if [ "$TORCH_ARM" = upstream_override ]; then
            uv pip install -r upstream/vllm_metal/requirements-torch.txt
          fi
          uv pip freeze > evidence/installed.txt
          set +e
          python -m pip check > evidence/dependency-check.txt 2>&1
          check_status=$?
          set -e
          export CHECK_STATUS="$check_status"
          python - <<'PY'
          import importlib.metadata as md, pathlib,os,json
          import torch, mlx.core as mx, vllm, vllm_metal
          arm=os.environ['TORCH_ARM']
          lines=[x.strip() for x in pathlib.Path('evidence/dependency-check.txt').read_text().splitlines() if x.strip()]
          version=md.version('torch')
          expected='vllm 0.34.0+cpu has requirement torch==2.14.0; platform_system == "Darwin" or platform_machine == "ppc64le" or platform_machine == "riscv64", but you have torch 2.16.0.dev20261013.'
          if arm=='declared':
              assert version=='2.14.0' and os.environ['CHECK_STATUS']=='0',lines
          else:
              assert version=='2.16.0.dev20261013' and os.environ['CHECK_STATUS']=='1' and lines==[expected],lines
          assert 'gpu' in str(mx.default_device()).lower()
          # MLX is the selected compute backend, not PyTorch MPS.
          # Some hosted virtual Metal devices are rejected by the MPS backend.
          assert (torch.tensor([1.,2.],device='cpu')+1).tolist()==[2.,3.]
          x=mx.array([1.,2.])+1
          mx.eval(x)
          assert x.tolist()==[2.,3.]
          mps_available=torch.backends.mps.is_available()
          mps_result='UNAVAILABLE'
          if mps_available:
              try:
                  a=torch.tensor([1.,2.],device='mps')+1
                  mps_result='PASS' if a.cpu().tolist()==[2.,3.] else 'FAIL'
              except Exception as e:
                  mps_result='ERROR:'+type(e).__name__
          pathlib.Path('evidence/abi.json').write_text(json.dumps(dict(arm=arm,torch=version,declared_metadata_clean=os.environ['CHECK_STATUS']=='0',known_upstream_exception=lines if arm=='upstream_override' else [],torch_cpu_operation='PASS',actual_mlx_gpu_operation='PASS',mps_available=mps_available,mps_diagnostic=mps_result,mlx_device=str(mx.default_device())),indent=2))
          PY
          python - <<'PY'
          import hashlib,json,os,pathlib,importlib.metadata
          import mlx.core as mx
          from huggingface_hub import snapshot_download
          assert importlib.metadata.version('vllm-metal')=='0.34.0'
          assert importlib.metadata.version('vllm').startswith('0.34.0')
          assert 'gpu' in str(mx.default_device()).lower()
          root=pathlib.Path(snapshot_download('mlx-community/Qwen3-0.6B-4bit',revision=os.environ['MODEL_REV'],local_dir='model',max_workers=2))
          files=[dict(path=str(p.relative_to(root)),sha256=hashlib.sha256(p.read_bytes()).hexdigest(),bytes=p.stat().st_size) for p in sorted(root.rglob('*')) if p.is_file() and p.suffix in ('.safetensors','.json','.model')]
          digest=hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert digest=='a41e0e6d8b353351d9cbe241c261b95ede3702ddf86bfb418d98b845639dcf2d'
          pathlib.Path('evidence/model-manifest.json').write_text(json.dumps(files,indent=2))
          PY
      - name: Exercise actual upstream native host pool and disk restart oracle
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ish-metal"
          source venv/bin/activate
          export QWEN3_MODEL_PATH="$PWD/model"
          export HF_HUB_OFFLINE=1
          # Copy only test/benchmark helpers, so the installed native wheel is imported,
          # rather than the unbuilt upstream Python package in the source checkout.
          mkdir testbed
          cp -R upstream/tests upstream/tools testbed/
          cd testbed
          python -c 'import vllm_metal; print(vllm_metal.__file__); assert "site-packages" in vllm_metal.__file__'
          test -d "$RUNNER_TEMP/ish-metal/evidence"
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ish-metal/evidence/native"; assert p.is_absolute() and p.parent.is_dir() and "$" not in str(p)'
          python -m pytest tests/e2e/test_kv_offload_e2e.py -q -s --basetemp "$RUNNER_TEMP/ish-metal/evidence/native" --junitxml "$RUNNER_TEMP/ish-metal/evidence/native.xml"
          python - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('../evidence')
          receipts=sorted({p.resolve() for p in root.rglob('restores.json')})
          assert len(receipts)==1
          rows=json.loads(receipts[0].read_text())['restores']
          assert [x['restore'] for x in rows]==['host pool','disk after restart']
          assert all(x['passed'] and x['restored_tokens']>=992 and x['output']=='EXACT' for x in rows)
          (root/'receipt.json').write_text(json.dumps(dict(scope='native upstream host pool and disk restore after restart, random public synthetic token prompts; not task goodput or physical target',torch_arm=os.environ['TORCH_ARM'],source=os.environ['METAL_REV'],model_revision=os.environ['MODEL_REV'],workflow_sha=os.environ['GITHUB_SHA'],restores=rows),indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ish-metal-native-r17b-${{ matrix.torch_arm }}
          path: ${{ runner.temp }}/ish-metal/evidence/
          if-no-files-found: warn
          retention-days: 14
