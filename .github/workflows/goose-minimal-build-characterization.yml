name: Goose Minimal Build Characterization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goose-minimal-build-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOSE_SHA: '2090ad1c65ddb39497601a936a9fe17d66254bfe'
      RUST_TOOLCHAIN: '1.96.1'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: '/tmp/goose-minimal-target'
    steps:
      - name: Record substrate
        shell: bash
        run: |
          set -euo pipefail
          echo "NPROC=$(nproc)"
          free -b
          df -B1 /
          uname -a

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Clone pinned Goose source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/aaif-goose/goose.git "$RUNNER_TEMP/goose"
          git -C "$RUNNER_TEMP/goose" checkout --quiet --detach "$GOOSE_SHA"
          test "$(git -C "$RUNNER_TEMP/goose" rev-parse HEAD)" = "$GOOSE_SHA"

      - name: Characterize default and projected feature graphs
        shell: bash
        working-directory: ${{ runner.temp }}/goose
        run: |
          set -euo pipefail
          cargo tree --locked -p goose-cli -e features >"$RUNNER_TEMP/goose-default-features.txt"
          cargo tree --locked -p goose-cli -e features --no-default-features --features rustls-tls >"$RUNNER_TEMP/goose-minimal-features.txt"

          python3 - <<'PY'
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          for name in ("default","minimal"):
              lines=(root / f"goose-{name}-features.txt").read_text(errors="replace").splitlines()
              feature_lines=[line for line in lines if " feature " in line or "(feature " in line]
              print(f"GOOSE_{name.upper()}_TREE_LINES={len(lines)}")
              print(f"GOOSE_{name.upper()}_FEATURE_LINES={len(feature_lines)}")
          PY

          echo '=== projected root feature evidence ==='
          grep -E 'goose-cli feature|goose feature' "$RUNNER_TEMP/goose-minimal-features.txt" | head -n 80 || true

      - name: Build projected Goose CLI
        shell: bash
        working-directory: ${{ runner.temp }}/goose
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/goose-build-time.txt" \
            cargo build --locked --release -p goose-cli --bin goose --no-default-features --features rustls-tls

          bin="$CARGO_TARGET_DIR/release/goose"
          test -x "$bin"
          echo "GOOSE_BINARY_BYTES=$(stat -c %s "$bin")"
          echo "GOOSE_BINARY_SHA256=$(sha256sum "$bin" | awk '{print $1}')"
          file "$bin"
          ldd "$bin" || true
          cat "$RUNNER_TEMP/goose-build-time.txt"

      - name: Measure cold command surface
        shell: bash
        run: |
          set -euo pipefail
          bin="$CARGO_TARGET_DIR/release/goose"
          "$bin" --version
          for i in 1 2 3 4 5; do
            /usr/bin/time -f "GOOSE_VERSION_START_${i}_SECONDS=%e" "$bin" --version >/dev/null
          done
          "$bin" --help | sed -n '1,120p'
