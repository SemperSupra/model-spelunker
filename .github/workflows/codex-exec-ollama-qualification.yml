name: Codex Exec Ollama Qualification

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task id from qualification/tasks
        required: true
        default: boundary-bugfix-v0

permissions:
  contents: read

concurrency:
  group: codex-exec-ollama-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: codex-exec 0.154.0 + Qwen3 1.7B
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODEX_SHA: '6b9826e3aa83b1a5947db50f4332cb9c65f1b340'
      CODEX_VERSION: '0.154.0'
      RUST_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: '/tmp/codex-exec-qualification-target'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-codex-exec-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      QUALIFICATION_TASK: ${{ inputs.task }}
      CODEX_HOME: '${{ github.workspace }}/.codex-exec-qual-home'
      CANDIDATE_META: '/tmp/model-spelunker-codex-exec-candidate.json'
      RECEIPT: '/tmp/model-spelunker-codex-exec-receipt.json'
      DIAGNOSTICS: '/tmp/model-spelunker-codex-exec-diagnostics.json'
      SUBSTRATE_PROFILE_COMMIT: 'codex-exec-qwen17-gha-v1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned codex-exec only
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          git clone --quiet --filter=blob:none https://github.com/openai/codex.git "$RUNNER_TEMP/codex"
          git -C "$RUNNER_TEMP/codex" checkout --quiet --detach "$CODEX_SHA"
          test "$(git -C "$RUNNER_TEMP/codex" rev-parse HEAD)" = "$CODEX_SHA"
          cd "$RUNNER_TEMP/codex/codex-rs"
          cargo tree -p codex-exec --depth 1 >/dev/null
          cargo build --locked --release -p codex-exec --bin codex-exec
          bin="$CARGO_TARGET_DIR/release/codex-exec"
          test -x "$bin"
          echo "CODEX_EXEC_BIN=$bin" >> "$GITHUB_ENV"
          echo "CODEX_EXEC_BINARY_SHA256=$(sha256sum "$bin" | awk '{print $1}')" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Install pinned Ollama and hydrate exact model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$OLLAMA_MODELS" "$CODEX_HOME"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          OLLAMA_HOST="$OLLAMA_HOST" nohup "$runtime/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_HOST" "$runtime/bin/ollama" pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags", timeout=10) as response:
              data=json.load(response)
          wanted=os.environ["OLLAMA_MODEL_TAG"]
          row=next((m for m in data.get("models",[]) if m.get("name")==wanted),None)
          if row is None:
              raise SystemExit(f"model not present: {wanted}")
          digest=str(row.get("digest") or "").removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")

          candidate={
              "harness":{"name":"codex-exec","version":os.environ["CODEX_VERSION"]},
              "model":{
                  "provider":"ollama",
                  "id":wanted,
                  "artifact_ref":f"ollama-sha256:{digest}",
              },
              "toolset":["filesystem","shell"],
              "configuration":{
                  "source_revision":os.environ["CODEX_SHA"],
                  "binary_digest":"sha256:"+os.environ["CODEX_EXEC_BINARY_SHA256"],
                  "mode":"oss",
                  "local_provider":"ollama",
                  "sandbox":"workspace-write",
                  "ephemeral":True,
                  "web_search":"disabled",
                  "reasoning_effort":"none",
                  "model_instructions_variant":"minimal-local-v1",
                  "model_metadata_variant":"known-local-v1",
                  "tool_surface":"unified-shell",
                  "ollama_context_length":int(os.environ["OLLAMA_CONTEXT_LENGTH"]),
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(
              json.dumps(candidate,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Build local model metadata
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="$RUNNER_TEMP/codex-exec-local-models.json"
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/openai/codex/$CODEX_SHA/codex-rs/models-manager/models.json" \
            --output "$catalog_file"
          CATALOG_FILE="$catalog_file" python3 - <<'PY'
          import copy,json,os
          from pathlib import Path
          path=Path(os.environ["CATALOG_FILE"])
          catalog=json.loads(path.read_text(encoding="utf-8"))
          template=copy.deepcopy(catalog["models"][0])
          template.update({
              "slug":os.environ["OLLAMA_MODEL_TAG"],
              "display_name":"Qwen3 1.7B local",
              "description":"Qualification-only local Ollama model metadata.",
              "default_reasoning_level":None,
              "supported_reasoning_levels":[],
              "shell_type":"unified_exec",
              "visibility":"none",
              "supported_in_api":True,
              "priority":99,
              "minimal_client_version":"0.154.0",
              "support_verbosity":False,
              "default_verbosity":None,
              "apply_patch_tool_type":None,
              "web_search_tool_type":"text",
              "context_window":40960,
              "max_context_window":40960,
              "effective_context_window_percent":95,
              "include_skills_usage_instructions":False,
              "include_apps_usage_instructions":False,
              "include_plugin_usage_instructions":False,
              "supports_reasoning_summary_parameter":False,
              "default_reasoning_summary":"none",
              "supports_image_detail_original":False,
              "input_modalities":["text"],
              "experimental_supported_tools":[],
              "supports_search_tool":False,
              "supports_experimental_context":False,
              "use_responses_lite":False,
              "node_repl_auto_review_required":False,
              "node_repl_disabled":True,
              "tool_mode":"direct",
              "multi_agent_version":None,
              "multi_agent_reasoning_effort":None,
              "model_messages":{"instructions_template":"Local coding model."},
          })
          path.write_text(json.dumps({"models":[template]},indent=2,sort_keys=True)+"\n")
          PY
          echo "CODEX_MODEL_CATALOG=$catalog_file" >> "$GITHUB_ENV"

          instructions_file="$RUNNER_TEMP/codex-exec-minimal-local-instructions.md"
          cat >"$instructions_file" <<'EOF'
          You are a coding agent operating in the current workspace.
          Follow the user's request exactly.
          Use the available tools to inspect or modify files as needed.
          Do not access the network.
          Make the smallest correct change and stop.
          EOF
          echo "CODEX_INSTRUCTIONS_FILE=$instructions_file" >> "$GITHUB_ENV"

      - name: Run harness-neutral task through source-built codex-exec
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY || true
          unset CODEX_API_KEY || true

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-codex-exec-ollama \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            --diagnostics "$DIAGNOSTICS" \
            "qualification/tasks/$QUALIFICATION_TASK" \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- "$CODEX_EXEC_BIN" \
              --oss \
              --local-provider ollama \
              --model "$OLLAMA_MODEL_TAG" \
              --sandbox workspace-write \
              --skip-git-repo-check \
              --ephemeral \
              --json \
              -c 'web_search="disabled"' \
              -c 'model_reasoning_effort="none"' \
              -c "model_instructions_file=\"$CODEX_INSTRUCTIONS_FILE\"" \
              -c "model_catalog_json=\"$CODEX_MODEL_CATALOG\"" \
              -
          qualification_rc=$?
          set -e

          test -f "$RECEIPT"
          QUALIFICATION_RC="$qualification_rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads(Path(os.environ["RECEIPT"]).read_text())
          rc=int(os.environ["QUALIFICATION_RC"])
          assert receipt["candidate"]["harness"]["name"]=="codex-exec"
          assert receipt["candidate"]["model"]["id"]==os.environ["OLLAMA_MODEL_TAG"]
          assert rc==(0 if receipt["observation"]["success"] else 1)
          print(json.dumps(receipt,sort_keys=True))
          print("QUALIFICATION_RESULT="+("PASS" if receipt["observation"]["success"] else "FAIL (valid observation)"))
          PY

      - name: Upload immutable qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-exec-ollama-qualification-${{ inputs.task }}-${{ github.run_id }}
          path: ${{ env.RECEIPT }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Show bounded diagnostics on infrastructure failure
        if: failure()
        shell: bash
        run: |
          cat "$DIAGNOSTICS" || true
          tail -n 160 "$RUNNER_TEMP/ollama.log" || true
