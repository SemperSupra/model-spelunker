name: Minimal experiment evidence canary

on:
  pull_request:
    branches:
      - rep/siglip2-reproduction-001

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prove plan/execution MATCH and DEVIATION
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/evidence-canary"
          mkdir -p "$root/result"
          ROOT="$root" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          inputs = {
              "study.json": b'{"study_id":"canary"}\n',
              "run.sh": b'#!/usr/bin/env bash\n',
              "run_reproduction.py": b'print("canary")\n',
          }
          manifest = {"schema_version": 1, "capsule_sha256": "0" * 64, "files": {}}
          for name, payload in inputs.items():
              (root / name).write_bytes(payload)
              manifest["files"][name] = {
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "bytes": len(payload),
              }
          (root / "capsule-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")

          result_dir = root / "result"
          (result_dir / "study.json").write_bytes(inputs["study.json"])
          result = {
              "study_id": "canary",
              "execution_disposition": "EXECUTED_PASSED",
              "scientific_disposition": "INCONCLUSIVE",
              "study_declaration_sha256": manifest["files"]["study.json"]["sha256"],
          }
          (result_dir / "result.json").write_text(json.dumps(result, indent=2) + "\n")

          def ident(path):
              data = path.read_bytes()
              return {"sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}

          receipt = {
              "schema_version": 1,
              "record_type": "execution-receipt",
              "task_exit_code": 0,
              "inputs": {name: ident(root / name) for name in inputs},
              "outputs": {
                  "study.json": ident(result_dir / "study.json"),
                  "result.json": ident(result_dir / "result.json"),
              },
          }
          (result_dir / "execution-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/result" > "$root/match.json"
          grep -q '"status": "MATCH"' "$root/match.json"

          ROOT="$root" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["ROOT"]) / "result" / "execution-receipt.json"
          receipt = json.loads(path.read_text())
          receipt["inputs"]["run.sh"]["sha256"] = "f" * 64
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

          set +e
          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/result" > "$root/deviation.json"
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q '"status": "DEVIATION"' "$root/deviation.json"
          grep -q '"subject": "input:run.sh"' "$root/deviation.json"

      - name: Prove failed study still leaves experiment evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/failure-canary"
          mkdir -p "$root/out" "$root/fakebin"
          cp studies/siglip2-model-card-zsic-001/run.sh "$root/run.sh"
          printf '%s\n' '{"study_id":"failure-canary"}' > "$root/study.json"
          cat > "$root/run_reproduction.py" <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["RESULT_JSON"])
          out.write_text(json.dumps({
              "study_id": "failure-canary",
              "execution_disposition": "EXECUTED_FAILED",
              "scientific_disposition": "INCONCLUSIVE"
          }) + "\n")
          raise SystemExit(7)
          PY
          cat > "$root/fakebin/python3" <<'SH'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-m" && "${2:-}" == "pip" ]]; then
            exit 0
          fi
          exec /usr/bin/python3 "$@"
          SH
          chmod +x "$root/fakebin/python3" "$root/run.sh"

          set +e
          (
            cd "$root"
            PATH="$root/fakebin:$PATH" SEALED_RESULT_DIR="$root/out" bash ./run.sh
          )
          rc=$?
          set -e

          test "$rc" -eq 7
          test -f "$root/out/result.json"
          test -f "$root/out/study.json"
          test -f "$root/out/execution-receipt.json"
          ROOT="$root" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          receipt = json.loads((root / "out" / "execution-receipt.json").read_text())
          assert receipt["task_exit_code"] == 7
          for name in ("study.json", "run.sh", "run_reproduction.py"):
              data = (root / name).read_bytes()
              assert receipt["inputs"][name]["sha256"] == hashlib.sha256(data).hexdigest()
              assert receipt["inputs"][name]["bytes"] == len(data)
          print("failure evidence preserved; nonzero verdict propagated")
          PY
