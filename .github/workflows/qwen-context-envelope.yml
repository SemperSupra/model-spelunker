name: Qwen Public Direct Model Context-Envelope Crossover

on:
  pull_request:
    paths:
      - '.github/workflows/qwen-context-envelope.yml'
      - 'qualification/qwencode_context_envelope/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-context-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-bands:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        band: [small, large, offline-critics]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Real model inference against exact public small or Qwen-shaped context
        if: matrix.band != 'offline-critics'
        shell: bash
        run: |
          set -euo pipefail
          bash qualification/qwencode_context_envelope/run.sh '${{ matrix.band }}'
      - name: Separate pure public context source / negative critic
        if: matrix.band == 'offline-critics'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/qwencode_context_envelope -p test_compare.py -v
      - name: Preserve one deterministic per-profile redacted receipt
        if: matrix.band != 'offline-critics' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qwen-public-context-${{ matrix.band }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen-context-${{ matrix.band }}-receipt.json
          retention-days: 7
          if-no-files-found: ignore
