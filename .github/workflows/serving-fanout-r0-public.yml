name: serving-fanout-r0-public-synthetic
on:
  pull_request:
    paths:
      - 'qualification/serving_fanout_r0/**'
      - '.github/workflows/serving-fanout-r0-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-go-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned PR source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node24)
      - name: Run deterministic negative and reproducibility tests
        working-directory: qualification/serving_fanout_r0/protocol
        run: |
          go version
          go test -count=3 ./...
      - name: Compare synthetic latency-throughput tradeoff
        working-directory: qualification/serving_fanout_r0/protocol
        run: |
          go run . -fixture ../workloads/illustrative-2slot.json -policy fifo > "$RUNNER_TEMP/fifo.json"
          go run . -fixture ../workloads/illustrative-2slot.json -policy reserved > "$RUNNER_TEMP/reserved.json"
          python3 - "$RUNNER_TEMP/fifo.json" "$RUNNER_TEMP/reserved.json" <<'PY'
          import json, sys
          fifo, reserved = [json.load(open(path, encoding='utf-8')) for path in sys.argv[1:]]
          assert fifo["evidence_class"] == reserved["evidence_class"] == "SYNTHETIC_SIMULATION_NOT_HARDWARE"
          assert fifo["fixture_sha256"] == reserved["fixture_sha256"]
          assert fifo["interactive"]["p95_queue_wait_ticks"] == 49
          assert reserved["interactive"]["p95_queue_wait_ticks"] == 0
          assert fifo["batch"]["makespan_ticks"] == 50
          assert reserved["batch"]["makespan_ticks"] == 100
          print("SYNTHETIC ONLY: FIFO and reserved policies each have distinct trade-offs")
          PY
