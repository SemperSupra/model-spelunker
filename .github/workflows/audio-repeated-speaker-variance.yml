name: Faster Whisper Repeated-Speaker Variance Rep

on:
  push:
    branches:
      - impl/audio-asr-portability-stage
    paths:
      - "experiments/mvp/audio_mls_repeated_speaker_panel.json"
      - "experiments/mvp/prepare_mls_repeated_speaker_panel.py"
      - "experiments/mvp/run_audio_repeated_speaker_variance.py"
      - "experiments/mvp/validate_audio_repeated_speaker_variance.py"
      - ".github/workflows/audio-repeated-speaker-variance.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: asr/faster-whisper/tiny
  EXPECTED_DIGEST: sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42
  MLS_REVISION: 2e83e61823b4c47dcbcb1980bb88601274127609

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6622753fd5914be87fb1b6d987ceb7cae46c7ff5
          path: foundry
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with: {version: 1.3.3}
      - name: Derive cache key
        id: key
        shell: bash
        run: |
          mkdir -p out mls-parquet mls-samples
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY
      - name: Restore exact ASR runtime
        id: asr-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .asr-venv
          key: model-spelunker-faster-whisper-tiny-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.python_tag }}-fw1.2.1-ct2-4.6.0
      - name: Build exact CPU ASR runtime on cache miss
        if: steps.asr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m venv .asr-venv
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input "faster-whisper==1.2.1" "ctranslate2==4.6.0"
      - name: Restore MLS panel parser runtime
        id: panel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .panel-venv
          key: model-spelunker-mls-panel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.python_tag }}-pyarrow21.0.0
      - name: Build parser runtime on cache miss
        if: steps.panel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 -m venv .panel-venv
          .panel-venv/bin/python -m pip install --disable-pip-version-check --no-input "pyarrow==21.0.0"
      - name: Verify approved Foundry selector
        shell: bash
        run: |
          .asr-venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          e=json.loads(Path('foundry/catalog/approved.json').read_text())['artifacts'][os.environ['LOGICAL_ID']]
          assert e['approved_digest']==os.environ['EXPECTED_DIGEST']
          assert e['upstream_exact_revision']=='d90ca5fe260221311c53c58e660288d3deb8d356'
          PY
      - name: Acquire exact pinned MLS source parquets
        shell: bash
        run: |
          set -euo pipefail
          for lang in german french spanish; do
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
              "https://huggingface.co/datasets/facebook/multilingual_librispeech/resolve/${MLS_REVISION}/${lang}/1_hours-00000-of-00001.parquet?download=true" \
              -o "mls-parquet/${lang}.parquet"
          done
          python3 - <<'PY' | tee out/mls-source-downloads-repeat.json
          import hashlib,json,os
          from pathlib import Path
          x={}
          for l in ('german','french','spanish'):
            b=(Path('mls-parquet')/f'{l}.parquet').read_bytes(); assert len(b)>10_000_000; x[l]={'bytes':len(b),'sha256':'sha256:'+hashlib.sha256(b).hexdigest()}
          print(json.dumps({'repository':'facebook/multilingual_librispeech','revision':os.environ['MLS_REVISION'],'files':x},sort_keys=True))
          PY
      - name: Resolve frozen speakers to three deterministic utterances each
        shell: bash
        run: |
          .panel-venv/bin/python experiments/mvp/prepare_mls_repeated_speaker_panel.py \
            --manifest experiments/mvp/audio_mls_repeated_speaker_panel.json \
            --parquet-dir mls-parquet --samples-dir mls-samples \
            --output out/mls-repeated-speaker-panel.json | tee out/repeated-panel-selection.log
      - name: Authenticate bounded Foundry read
        shell: bash
        env: {GHCR_TOKEN: "${{ github.token }}"}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Hydrate approved model and prove offline reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/model-spelunker-asr-repeat
          MODEL1="$(.asr-venv/bin/python foundry/tools/hydrate.py --catalog foundry/catalog/approved.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-asr-repeat --oras "$(command -v oras)" | tail -n1)"
          MODEL2="$(.asr-venv/bin/python foundry/tools/hydrate.py --catalog foundry/catalog/approved.json --id "$LOGICAL_ID" --cache-root /tmp/model-spelunker-asr-repeat --oras /bin/false | tail -n1)"
          test "$MODEL1" = "$MODEL2"
          echo "model_dir=$MODEL2" >> "$GITHUB_OUTPUT"
      - name: Run repeated-speaker variance rep
        shell: bash
        env: {MODEL_DIR: "${{ steps.hydrate.outputs.model_dir }}"}
        run: |
          /usr/bin/time -v .asr-venv/bin/python experiments/mvp/run_audio_repeated_speaker_variance.py \
            --model-dir "$MODEL_DIR" --samples-dir mls-samples \
            --panel out/mls-repeated-speaker-panel.json \
            --output out/audio-repeated-speaker-variance.json 2>&1 | tee out/run.log
      - name: Validate evidence independently
        shell: bash
        run: |
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1" >/dev/null
          .asr-venv/bin/python experiments/mvp/validate_audio_repeated_speaker_variance.py out/audio-repeated-speaker-variance.json | tee out/validation.log
      - name: Summarize descriptive variance result
        shell: bash
        run: |
          .asr-venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads(Path('out/audio-repeated-speaker-variance.json').read_text());d=b['derived_metrics'];c=b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## Repeated-speaker / utterance variance\n\n')
            for lang,s in d['per_language'].items():
              f.write(f"- {lang} speakers `{s['speaker_ids']}`\n")
              for cond in ('baseline','snr_20db','snr_10db'):
                q=s['conditions'][cond]['ground_truth_variance_partition']; r=s['conditions'][cond]['relative_cer_variance_partition']
                f.write(f"  - {cond}: GT between/within `{q['between_speaker_mean_variance']:.5f}/{q['mean_within_speaker_utterance_variance']:.5f}`; relative between fraction `{r['descriptive_between_fraction']:.3f}`\n")
            f.write(f"- science `{c['experiment_seconds']:.2f}s`, RSS `{c['peak_rss_mib']:.1f} MiB`\n")
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-audio-repeated-speaker-${{ github.run_id }}
          path: |
            out/audio-repeated-speaker-variance.json
            out/mls-repeated-speaker-panel.json
            out/mls-source-downloads-repeat.json
            out/repeated-panel-selection.log
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
