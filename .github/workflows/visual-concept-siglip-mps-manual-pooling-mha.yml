name: SigLIP MPS Manual Vision Pooling MHA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile treatment
        run: python3 -m py_compile scripts/visual_concept_siglip_mps_manual_pooling_mha.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned inference dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            torch==2.14.0 transformers==5.17.0 pillow==12.3.0 requests==2.34.2 \
            sentencepiece==0.2.2 protobuf==7.36.1
      - name: Run manual vision pooling MHA discriminator
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
        run: |
          set -euo pipefail
          python scripts/visual_concept_siglip_mps_manual_pooling_mha.py \
            --config config/visual-concept-worker-public-safe-siglip.json \
            --out "$RUNNER_TEMP/visual-concept-siglip-mps-manual-pooling-mha.json"
      - name: Validate treatment receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"visual-concept-siglip-mps-manual-pooling-mha.json").read_text())
          assert r["runtime"]["mps_fallback_env"]=="0"
          assert r["model"]["family"]=="siglip"
          assert r["oracle"]["baseline_cpu_pass"] is True
          assert r["treatment"]["global_linear_matmul_bias"] is True
          assert r["treatment"]["manual_vision_pooling_mha"] is True
          print(json.dumps({
            "rankings":r["rankings"],
            "cpu_manual_equivalence":r["cpu_manual_equivalence"],
            "cpu_vs_manual_mps":r["cpu_vs_manual_mps"],
            "oracle":r["oracle"],
          },sort_keys=True))
          PY
      - name: Upload treatment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-concept-siglip-mps-manual-pooling-mha-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-concept-siglip-mps-manual-pooling-mha.json
          if-no-files-found: error
          retention-days: 7
