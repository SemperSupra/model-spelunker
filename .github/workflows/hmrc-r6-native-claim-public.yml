name: HMRC R6 native Qwen model vs source-bound deterministic claim gate
# Independent frozen synthetic EN/DE/TH facts; actual Go R5 verifier;
# actual pinned public Ollama/Qwen CPU. No private runner or paid API.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_claim_r6/**'
      - 'qualification/hmrc_native_claim_r6.py'
      - 'qualification/fixtures/hmrc_native_claim_r6.json'
      - '.github/workflows/hmrc-r6-native-claim-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-blue-source-critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Frozen oracle separation and actual R5 typed verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/hmrc_native_claim_r6.py
          python3 qualification/hmrc_native_claim_r6.py --self-test
          (cd qualification/hmrc_claim_r6 && go vet ./... && go test -v -count=1 ./...)
  actual-native-qwen-and-go:
    needs: red-blue-source-critic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_CONTEXT_LENGTH: '32768'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Compile exact local Go claim verifier with no cloud model
        shell: bash
        run: |
          set -euo pipefail
          (cd qualification/hmrc_claim_r6 && go build -o "$RUNNER_TEMP/hmrc-claim-admit" ./cmd/admit)
          test -x "$RUNNER_TEMP/hmrc-claim-admit"
          python3 qualification/hmrc_native_claim_r6.py --self-test
      - name: Install exact checked public Ollama CPU runtime and model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" --output "$archive"
          printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$runtime" "$RUNNER_TEMP/hmrc-r6-models"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Authenticate public Qwen3 runtime identity against existing pinned digest
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/hmrc-r6-models"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_MAX_LOADED_MODELS=1 ollama serve >"$RUNNER_TEMP/hmrc-ollama.log" 2>&1 &
          for n in $(seq 1 60); do
            if curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as r:
              models=json.load(r)["models"]
          m=next((x for x in models if x["name"]==os.environ["OLLAMA_MODEL_TAG"]),None)
          assert m and m["digest"].removeprefix("sha256:").startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"])
          print("EXACT_PINNED_PUBLIC_MODEL=YES")
          PY
      - name: Forty actual Qwen generations paired with read-only Go verified claims
        shell: bash
        run: |
          set -euo pipefail
          for seed in 19 53; do
            python3 qualification/hmrc_native_claim_r6.py --seed "$seed" \
              --admit "$RUNNER_TEMP/hmrc-claim-admit" --out "hmrc-native-claims-$seed.json"
          done
          python3 - <<'PY'
          import json
          scores=[]
          for seed in (19,53):
              with open(f"hmrc-native-claims-{seed}.json") as f:
                  d=json.load(f)
              assert d["native_ollama_qwen_model_executed"] is True
              assert d["actual_go_r5_verifier_executed"] is True
              assert d["agent_harness_tool_task_accepted"] is False
              assert d["autonomous_action_granted"] is False
              assert d["model_call_count"]==20 and len(d["rows"])==20
              assert sum(r["negative"] for r in d["rows"])==12
              assert d["deterministic_tool"]["correct"]==20
              assert d["model_postvalidated"]["negative_abstained"]==12
              scores.append(d)
          print("R6_PAIRED_MODEL_GUARD_TOTALS="+json.dumps({
              arm:sum(d[arm]["correct"] for d in scores)
              for arm in ("model_only","model_postvalidated","deterministic_tool")},sort_keys=True))
          print("SOURCE_CATALOG_SYNTHETIC_ONLY=YES; NO_PRODUCTION_MODEL_ADMISSION")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hmrc-r6-real-model-vs-typed-claims
          path: hmrc-native-claims-*.json
          if-no-files-found: ignore
          retention-days: 14
