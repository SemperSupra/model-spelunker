name: Memory vs Skill - Public Qwen Qualification Screen

# Source-public, credential-free only. This is a 1-rep screening experiment,
# not an evaluation of OpenCode auto-memory or autonomous model learning.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: learning-bootcamp-screen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-qwen-learning-screen:
    # Do not execute untrusted fork-supplied code in any runner with a token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.task }} / ${{ matrix.arm }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: boundary-bugfix-v0
            arm: control
            mode: none
          - task: boundary-bugfix-v0
            arm: episodic-memory
            mode: memory-recall-v1
          - task: boundary-bugfix-v0
            arm: procedural-skill
            mode: skill-procedure-v1
          - task: validation-discovery-v0
            arm: control
            mode: none
          - task: validation-discovery-v0
            arm: episodic-memory
            mode: memory-recall-v1
          - task: validation-discovery-v0
            arm: procedural-skill
            mode: skill-procedure-v1
    uses: ./.github/workflows/openworker-prebuilt-ollama-qualification.yml
    with:
      artifact_ref: ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83
      admission_ref: github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json
      task: ${{ matrix.task }}
      reasoning_effort: none
      python_version: ''
      realization_profile_ref: ''
      realization_digest: ''
      treatment_id: ${{ matrix.arm }}-${{ matrix.task }}
      tool_hint_mode: ${{ matrix.mode }}
      output_diagnostic_mode: none
