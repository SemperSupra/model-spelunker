name: Qwen Public Independent Actor Batch Contract

on:
  pull_request:
    paths:
      - 'qualification/qwen_batches/**'
      - '.github/workflows/qwen-batch-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-batch-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        band: [positive-and-actor-card, negative-critics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact public packet, deterministic card contract
        if: matrix.band == 'positive-and-actor-card'
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/qwen_batches/contract.py validate
          python3 qualification/qwen_batches/contract.py candidates > "$RUNNER_TEMP/candidates.json"
          python3 qualification/qwen_batches/contract.py cards > "$RUNNER_TEMP/cards.jsonl"
          python3 -m unittest discover -s qualification/qwen_batches -p test_contract.py -k ContractPositive -v
          python3 - "$RUNNER_TEMP/candidates.json" "$RUNNER_TEMP/cards.jsonl" <<'PY'
          import json,sys,pathlib
          plan=json.loads(pathlib.Path(sys.argv[1]).read_text())
          cards=[json.loads(x) for x in pathlib.Path(sys.argv[2]).read_text().splitlines()]
          assert plan['dispatch_authorized'] is False
          assert plan['candidate_ids'] == [] and plan['in_progress'] == ['B07-REAL-QWEN-HARNESS']
          assert plan['failed'] == []
          assert len(cards)==7
          assert all(x['max_tool_calls']<=8 and x['max_context_tokens']<=1600 for x in cards)
          assert plan['collisions']==0 and plan['private_actions_minutes']==0 and plan['verified_count']==4
          print('PASS independent public packet/card/eligibility, no dispatch')
          PY
      - name: Execute adversarial admission/scope/forged-PASS negatives independently
        if: matrix.band == 'negative-critics'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/qwen_batches -p test_contract.py -k ContractNegatives -v
          echo "PASS independent negative fixtures; private source/credential effect remains denied"
