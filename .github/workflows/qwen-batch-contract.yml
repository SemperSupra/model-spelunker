name: Qwen Public Independent Actor Batch Contract

on:
  pull_request:
    paths:
      - 'qualification/qwen_batches/**'
      - '.github/workflows/qwen-batch-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-batch-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        band: [positive-and-actor-card, negative-critics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict Qwen schema and non-scheduling status census
        if: matrix.band == 'positive-and-actor-card'
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/qwen_batches/contract.py validate
          python3 qualification/qwen_batches/contract.py status > "$RUNNER_TEMP/qwen-status.json"
          python3 qualification/qwen_batches/contract.py hash > "$RUNNER_TEMP/qwen-ledger-hash.txt"
          python3 -m unittest discover -s qualification/qwen_batches -p test_contract.py -k ContractPositive -v
          python3 - "$RUNNER_TEMP/qwen-status.json" <<'PY'
          import json,sys,pathlib
          v=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert v['planner']=='EXISTING_SUPRAGOFLOW_GO_BATCH_WAVE'
          assert v['dispatcher']=='AGENT_DISPATCH_ONLY'
          assert v['dispatch_authorized'] is False and v['candidate_selection']=='NOT_IMPLEMENTED'
          assert 'candidate_ids' not in v and 'cards' not in v
          assert v['counts']['DONE_VERIFIED']==4
          assert v['counts']['FAILED']==2
          assert v['counts']['BLOCKED_ADMISSION']==2
          assert v['counts']['READY']==0 and v['counts']['IN_PROGRESS']==0
          assert v['private_actions_minutes']==0
          print('PASS strict status-only Qwen ledger; external Go planner is sole wave selector')
          PY
      - name: Execute adversarial admission/scope/forged-PASS negatives independently
        if: matrix.band == 'negative-critics'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/qwen_batches -p test_contract.py -k ContractNegatives -v
          echo "PASS independent negative fixtures; private source/credential effect remains denied"
