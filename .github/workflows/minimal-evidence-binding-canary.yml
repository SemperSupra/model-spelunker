name: Minimal experiment evidence binding canary

on:
  pull_request:
    branches:
      - rep/siglip2-reproduction-001

permissions:
  contents: read

jobs:
  prove-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prove decrypted-layout transport binding
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/evidence-binding"
          mkdir -p "$root/decrypted/files"
          ROOT="$root" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          decrypted = root / "decrypted"
          files = decrypted / "files"
          planned = {
              "study.json": b'{"study_id":"binding-canary"}\n',
              "run.sh": b'#!/usr/bin/env bash\n',
              "run_reproduction.py": b'print("binding")\n',
          }
          manifest = {"schema_version": 1, "capsule_sha256": "a" * 64, "files": {}}
          for name, payload in planned.items():
              manifest["files"][name] = {
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "bytes": len(payload),
              }
          (root / "capsule-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (files / "study.json").write_bytes(planned["study.json"])
          result = {
              "study_id": "binding-canary",
              "execution_disposition": "EXECUTED_PASSED",
              "scientific_disposition": "INCONCLUSIVE",
              "study_declaration_sha256": manifest["files"]["study.json"]["sha256"],
          }
          (files / "result.json").write_text(json.dumps(result, indent=2) + "\n")

          def ident_bytes(payload):
              return {"sha256": hashlib.sha256(payload).hexdigest(), "bytes": len(payload)}
          def ident_file(path):
              data = path.read_bytes()
              return ident_bytes(data)

          receipt = {
              "schema_version": 1,
              "record_type": "execution-receipt",
              "task_exit_code": 0,
              "inputs": {name: ident_bytes(payload) for name, payload in planned.items()},
              "outputs": {
                  "study.json": ident_file(files / "study.json"),
                  "result.json": ident_file(files / "result.json"),
              },
          }
          (files / "execution-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          execution = {
              "schema_version": 1,
              "assignment_id": "sealed-binding-canary",
              "capsule_sha256": manifest["capsule_sha256"],
              "task_exit_code": 0,
              "exit_code": 0,
              "run_id": "canary-run",
              "worker_revision": "canary-worker",
          }
          (decrypted / "execution.json").write_text(json.dumps(execution, indent=2) + "\n")
          PY

          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/decrypted" > "$root/match-root.json"
          grep -q '"status": "MATCH"' "$root/match-root.json"
          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/decrypted/files" > "$root/match-files.json"
          grep -q '"status": "MATCH"' "$root/match-files.json"

          ROOT="$root" python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["ROOT"]) / "decrypted" / "execution.json"
          execution = json.loads(path.read_text())
          execution["capsule_sha256"] = "b" * 64
          path.write_text(json.dumps(execution, indent=2) + "\n")
          PY
          set +e
          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/decrypted" > "$root/capsule-deviation.json"
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q '"subject": "execution:capsule_sha256"' "$root/capsule-deviation.json"

          ROOT="$root" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          path = root / "decrypted" / "execution.json"
          execution = json.loads(path.read_text())
          execution["capsule_sha256"] = "a" * 64
          execution["task_exit_code"] = 9
          path.write_text(json.dumps(execution, indent=2) + "\n")
          PY
          set +e
          python3 tools/check_plan_execution.py "$root/capsule-manifest.json" "$root/decrypted" > "$root/exit-deviation.json"
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q '"subject": "execution:task_exit_code"' "$root/exit-deviation.json"
