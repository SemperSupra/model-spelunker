name: HMRC R3 joined native inference and evidence memory recovery
# Public-free disposable model+checkpoint+memory experiment; not production.
on:
  pull_request:
    paths:
      - 'qualification/hmrc_integrated_r3/**'
      - '.github/workflows/hmrc-r3-native-joined-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-state-oracle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Go source/evidence state transition, hostile capacity and replay
        working-directory: qualification/hmrc_integrated_r3
        run: |
          go vet ./...
          go test -v -count=1 ./...
          go test -race -count=5 ./...
      - name: Independent Python memory reconstruction source critic
        shell: bash
        run: |
          python3 -m py_compile qualification/hmrc_integrated_r3/recover.py
          python3 qualification/hmrc_integrated_r3/recover.py --self-test

  native-joined-public-cpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_CONTEXT_LENGTH: '32768'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify source and state gates before model hydration
        shell: bash
        run: |
          set -euo pipefail
          (cd qualification/hmrc_integrated_r3 && go test -count=1 ./...)
          python3 qualification/hmrc_integrated_r3/recover.py --self-test
      - name: Install exact public Ollama binary from existing admitted recipe
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error \
            "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$runtime" "$RUNNER_TEMP/hmrc-models"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Start model and verify exact public Qwen artifact
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/hmrc-models"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for n in $(seq 1 60); do
            if curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=10) as r:
              m=json.load(r)["models"]
          v=next((x for x in m if x["name"]==os.environ["OLLAMA_MODEL_TAG"]),None)
          assert v and v["digest"].removeprefix("sha256:").startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"])
          print("R3_MODEL_IDENTITY_VERIFIED=YES")
          PY
          curl --fail --silent --show-error --max-time 150 \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3:1.7b","prompt":"OK","stream":false,"keep_alive":"5m","options":{"num_predict":4}}' \
            "http://$OLLAMA_HOST/api/generate" >"$RUNNER_TEMP/hmrc-r3-warm.json"
      - name: Native model-context-to-evidence compaction with durable restart
        working-directory: qualification/hmrc_integrated_r3
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/qualify \
            --state "$RUNNER_TEMP/hmrc-r3-checkpoint.json" \
            --out "$RUNNER_TEMP/hmrc-r3-policy.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hmrc-r3-policy.json").read_text())
          assert d["runtime_context_tokens"]==32768
          assert d["policy_context_cap_synthetic"]==1000
          assert d["recovery_verified"] and d["protected_survived"] and d["compacted"]
          assert d["evicted_source_ids"]==["SYN_ATLAS_DLE_R8_NEXT","SYN_ATLAS_CPE_R5_BLUE"]
          assert not d["full_agent_task_qualified"] and not d["physical_kv_cache_qualified"]
          print("NATIVE_SERVER_TO_MEMORY_COMPACT_AND_RECOVER=PASS")
          PY
      - name: Query same native model after evidence-backed memory reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/hmrc_integrated_r3/recover.py \
            --state "$RUNNER_TEMP/hmrc-r3-checkpoint.json" \
            --policy "$RUNNER_TEMP/hmrc-r3-policy.json" \
            --out "$RUNNER_TEMP/hmrc-r3-reconstruction.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hmrc-r3-reconstruction.json").read_text())
          assert d["real_native_model_inference_executed"]
          assert len(d["rows"])==6
          assert set(d["summary"])=={"no-recall","source-scoped-fts"}
          assert not d["full_agent_task_qualified"] and not d["physical_kv_cache_qualified"]
          assert all(x["expected"] in d["evicted_source_ids"] for x in d["rows"])
          print("R3_MODEL_BACKED_RECOVERY=EXECUTED; AGENT_TASK=NOT_RUN")
          PY
      - name: Publish source-neutral checkpoint and model receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hmrc-r3-joined-public-receipts
          path: |
            ${{ runner.temp }}/hmrc-r3-checkpoint.json
            ${{ runner.temp }}/hmrc-r3-policy.json
            ${{ runner.temp }}/hmrc-r3-reconstruction.json
          if-no-files-found: ignore
          retention-days: 14
