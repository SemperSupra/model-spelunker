name: Model Spelunker Sink Token Replication

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/run_sink_token_replication.py"
      - "experiments/mvp/validate_sink_token_replication.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run frozen sink-token replication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_sink_token_replication.py \
            --output out/sink-token-replication.json \
            2>&1 | tee out-run.log

      - name: Validate preregistered replication
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_sink_token_replication.py out/sink-token-replication.json \
            | tee out-validation.log

      - name: Summarize frozen A replication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path
          b = json.loads(Path("out/sink-token-replication.json").read_text())
          p = b["derived_metrics"]["primary_A_vs_newline"]
          s = b["derived_metrics"]["condition_summary"]
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "primary_A_vs_newline": p,
              "condition_summary": s,
              "cost": b["cost"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Frozen sink-token A replication\n\n")
              f.write(f"- A vs newline mean correct-margin delta: `{p['mean_margin_delta']:.4f}`\n")
              f.write(f"- top-1 rate delta: `{p['top1_rate_delta']:.4f}`\n")
              f.write(f"- mean correct-rank delta (negative is better): `{p['mean_rank_delta']:.4f}`\n")
              f.write(f"- tasks improved/worsened by margin: `{p['positive_margin_delta_tasks']}/{p['negative_margin_delta_tasks']}`\n")
              f.write(f"- adverse shifts > {p['adverse_margin_threshold']}: `{p['adverse_gt_threshold_tasks']}`\n\n")
              f.write("| Condition | Mean margin | Mean rank | Top-1 | L18H8 sink mass |\n")
              f.write("|---|---:|---:|---:|---:|\n")
              for cid, row in s.items():
                  f.write(f"| {cid} | {row['mean_correct_margin']:.4f} | {row['mean_correct_rank']:.3f} | {row['top1_rate']:.3f} | {row['mean_sink_mass']:.6f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-sink-token-replication-${{ github.run_id }}
          path: |
            out/sink-token-replication.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
