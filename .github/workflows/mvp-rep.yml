name: Model Spelunker Protocol Ablation

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/protocol-ablation.json"
      - "experiments/mvp/validate_rep.py"
      - "experiments/mvp/compare_equivalence.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run protocol-ablation corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_rep.py \
            --probes experiments/mvp/protocol-ablation.json \
            --output out/protocol-ablation.json \
            2>&1 | tee out-run.log

      - name: Validate ablation evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_rep.py out/protocol-ablation.json --min-probes 18 \
            | tee out-validation.log

      - name: Build isolated ablation probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("experiments/mvp/protocol-ablation.json").read_text())
          probe_id = "arith-a-native-vs-no-gen"
          probes = [p for p in source["probes"] if p["probe_id"] == probe_id]
          assert len(probes) == 1
          Path("out/isolated-probes.json").write_text(json.dumps({
              "schema_version": source["schema_version"],
              "corpus_id": "protocol-ablation-v1-isolated",
              "probes": probes,
          }, indent=2) + "\n")
          PY

      - name: Run fresh-process isolated ablation probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_rep.py \
            --probes out/isolated-probes.json \
            --model-dir /tmp/model-spelunker-smollm2 \
            --output out/isolated-rep.json \
            2>&1 | tee out-isolated-run.log

      - name: Validate isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_rep.py out/isolated-rep.json --min-probes 1 \
            | tee out-isolated-validation.log

      - name: Recheck batching equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/compare_equivalence.py \
            out/protocol-ablation.json out/isolated-rep.json \
            --probe-id arith-a-native-vs-no-gen \
            | tee out-equivalence.log

      - name: Summarize protocol-control results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          b = json.loads(Path("out/protocol-ablation.json").read_text())
          groups = defaultdict(list)
          for p in b["observations"]["probes"]:
              groups[p["contrast_id"]].append(p)

          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "corpus_id": b["probe_id"],
              "contrasts": {},
          }
          for contrast, probes in sorted(groups.items()):
              left_correct = sum(p["conditions"][0]["candidate_correct"] is True for p in probes)
              right_correct = sum(p["conditions"][1]["candidate_correct"] is True for p in probes)
              left_winners = defaultdict(int)
              right_winners = defaultdict(int)
              generation_seen = 0
              surface_generation_agree = 0
              final_distances = []
              max_distances = []
              for p in probes:
                  left, right = p["conditions"]
                  left_winners[left["candidate_winner"]] += 1
                  right_winners[right["candidate_winner"]] += 1
                  for c in (left, right):
                      if c["generation_candidate"] is not None:
                          generation_seen += 1
                          surface_generation_agree += int(c["surface_generation_agree"] is True)
                  final_distances.append(p["activation_contrast"][-1]["cosine_distance"])
                  max_distances.append(max(x["cosine_distance"] for x in p["activation_contrast"]))
              summary["contrasts"][contrast] = {
                  "n": len(probes),
                  "left_candidate_accuracy": left_correct / len(probes),
                  "right_candidate_accuracy": right_correct / len(probes),
                  "left_winners": dict(left_winners),
                  "right_winners": dict(right_winners),
                  "mean_final_layer_cosine_distance": sum(final_distances) / len(final_distances),
                  "mean_max_layer_cosine_distance": sum(max_distances) / len(max_distances),
                  "generation_candidate_parse_count": generation_seen,
                  "surface_generation_agreement_rate_when_parseable": (
                      surface_generation_agree / generation_seen if generation_seen else None
                  ),
              }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Protocol-ablation result\n\n")
              f.write(f"- run: `{summary['run_id']}`\n")
              f.write(f"- artifact: `{summary['artifact_identity']}`\n")
              f.write(f"- corpus: `{summary['corpus_id']}`\n\n")
              f.write("| Contrast | N | Left accuracy | Right accuracy | Mean final cosine distance | Left winners | Right winners |\n")
              f.write("|---|---:|---:|---:|---:|---|---|\n")
              for name, s in summary["contrasts"].items():
                  f.write(f"| {name} | {s['n']} | {s['left_candidate_accuracy']:.3f} | {s['right_candidate_accuracy']:.3f} | {s['mean_final_layer_cosine_distance']:.6f} | {s['left_winners']} | {s['right_winners']} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-protocol-${{ github.run_id }}
          path: |
            out/protocol-ablation.json
            out/isolated-rep.json
            out/isolated-probes.json
            out-summary.json
            out-validation.log
            out-isolated-validation.log
            out-equivalence.log
            out-run.log
            out-isolated-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
