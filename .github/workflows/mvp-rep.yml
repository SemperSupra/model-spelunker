name: Model Spelunker Attention Flow

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/run_aligned_activation_patch.py"
      - "experiments/mvp/run_attention_flow.py"
      - "experiments/mvp/validate_attention_flow.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run attention-flow localization corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_attention_flow.py \
            --output out/attention-flow.json \
            2>&1 | tee out-run.log

      - name: Validate relational evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_attention_flow.py out/attention-flow.json \
            | tee out-validation.log

      - name: Summarize information-flow result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/attention-flow.json").read_text())
          d = b["derived_metrics"]
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "top_user_attention_change_heads": d["top_user_attention_change_heads"],
              "top_aligned_attention_tv_heads": d["top_aligned_attention_tv_heads"],
              "top_user_hidden_divergence_layers": d["top_user_hidden_divergence_layers"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Attention / information-flow localization\n\n")
              f.write("### Top user-attention changes\n\n")
              f.write("| Layer | Head | mean |Δ user mass| | aligned TV |\n")
              f.write("|---:|---:|---:|---:|\n")
              for row in d["top_user_attention_change_heads"][:10]:
                  f.write(f"| {row['layer']} | {row['head']} | {row['mean_abs_user_mass_delta']:.4f} | {row['mean_aligned_normalized_tv']:.4f} |\n")
              f.write("\n### Top user-content residual divergence\n\n")
              f.write("| Layer | User cosine distance | Boundary cosine distance |\n")
              f.write("|---:|---:|---:|\n")
              for row in d["top_user_hidden_divergence_layers"]:
                  f.write(f"| {row['layer']} | {row['mean_user_hidden_cosine_distance']:.4f} | {row['mean_boundary_hidden_cosine_distance']:.4f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-attention-flow-${{ github.run_id }}
          path: |
            out/attention-flow.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
