name: Model Spelunker TinyLlama Portability

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_cross_model_portability.py"
      - "experiments/mvp/run_tinyllama_portability.py"
      - "experiments/mvp/requirements.txt"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline and derive runtime key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          date +%s%N > out/setup-start-ns.txt
          python3 --version
          uname -a
          df -h /
          free -h
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore qualified prebuilt runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .runtime-venv
          key: model-spelunker-venv-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-torch2.5.1-${{ hashFiles('experiments/mvp/requirements.txt') }}

      - name: Build exact runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .runtime-venv
          .runtime-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          .runtime-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Record runtime ready latency
        shell: bash
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          .runtime-venv/bin/python - <<'PY'
          import json, os, time
          from pathlib import Path
          start = int(Path('out/setup-start-ns.txt').read_text().strip())
          payload = {
              'cache_hit': os.environ.get('CACHE_HIT') == 'true',
              'setup_to_runtime_ready_seconds': (time.time_ns() - start) / 1e9,
          }
          Path('out/runtime-ready.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Run TinyLlama third-family portability rep
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v .runtime-venv/bin/python experiments/mvp/run_tinyllama_portability.py \
            --output out/tinyllama-portability.json \
            2>&1 | tee out-run.log

      - name: Validate portable evidence contract
        shell: bash
        run: |
          set -euo pipefail
          .runtime-venv/bin/python - <<'PY' | tee out-validation.log
          import json
          from pathlib import Path
          import jsonschema
          b = json.loads(Path('out/tinyllama-portability.json').read_text())
          jsonschema.validate(b, json.loads(Path('schemas/observation-bundle.schema.json').read_text()))
          assert b['probe_id'] == 'cross-model-portability-tinyllama-v1'
          assert b['access_tier'] == 'A2' and b['evidence_level'] == 'REPRODUCED'
          assert b['model_identity']['repository'] == 'TinyLlama/TinyLlama-1.1B-Chat-v1.0'
          assert b['model_identity']['revision'] == 'fe8a4ea1ffedaf415f4da2f062534de366a451e6'
          p = b['artifact_provenance']
          assert p['tracked'] is True and p['verified'] is True and p['identity_kind'] == 'content-manifest'
          assert p['identity_digest'].startswith('sha256:')
          tasks = b['observations']['tasks']
          assert len(tasks) == 6
          for task in tasks:
              assert set(task['conditions']) == {'native', 'raw', 'newline_raw'}
              for row in task['conditions'].values():
                  assert len(row['candidate_scores']) == 5 and len(row['hidden_summary']) > 4 and len(row['attention_heads']) > 0
          d = b['derived_metrics']
          assert set(d['condition_summary']) == {'native', 'raw', 'newline_raw'}
          assert all(d['portable_instrument_checks'].values())
          assert d['portability_rep']['family_ordinal'] == 3
          assert 0 < float(b['cost']['peak_rss_mib']) < 15000
          print(json.dumps({'validated': True, 'run_id': b['provenance']['run_id'], 'manifest': p['identity_digest'], 'conditions': d['condition_summary'], 'peak_rss_mib': b['cost']['peak_rss_mib'], 'total_seconds': b['cost']['total_seconds']}, sort_keys=True))
          PY

      - name: Summarize portability and resource envelope
        shell: bash
        run: |
          set -euo pipefail
          .runtime-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b = json.loads(Path('out/tinyllama-portability.json').read_text())
          r = json.loads(Path('out/runtime-ready.json').read_text())
          d, c = b['derived_metrics'], b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('## TinyLlama third-family portability\n\n')
              f.write(f"- runtime cache hit: `{r['cache_hit']}`\n")
              f.write(f"- setup to runtime ready: `{r['setup_to_runtime_ready_seconds']:.3f} s`\n")
              f.write(f"- exact model revision: `{b['model_identity']['revision']}`\n")
              f.write(f"- content-manifest: `{b['artifact_provenance']['identity_digest']}`\n")
              f.write(f"- peak RSS: `{c['peak_rss_mib']:.1f} MiB`\n")
              f.write(f"- total script time: `{c['total_seconds']:.2f} s`\n\n")
              f.write('| Condition | Top-1 | Mean rank | Mean margin |\n|---|---:|---:|---:|\n')
              for cid, row in d['condition_summary'].items():
                  f.write(f"| {cid} | {row['top1_rate']:.3f} | {row['mean_correct_rank']:.3f} | {row['mean_correct_margin']:.4f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-tinyllama-portability-${{ github.run_id }}
          path: |
            out/tinyllama-portability.json
            out/runtime-ready.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
