name: Model Spelunker Protocol Localization

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_protocol_localization.py"
      - "experiments/mvp/protocol-localization-spec.json"
      - "experiments/mvp/validate_rep.py"
      - "experiments/mvp/compare_equivalence.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run normalized protocol-localization corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_protocol_localization.py \
            --output out/protocol-localization.json \
            2>&1 | tee out-run.log

      - name: Validate localization evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_rep.py out/protocol-localization.json --min-probes 18 \
            | tee out-validation.log

      - name: Build isolated localization probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "experiments/mvp")
          import run_protocol_localization as loc
          source = json.loads(loc.expand_spec().read_text())
          probe_id = "arith-a-full-vs-no-system"
          probes = [p for p in source["probes"] if p["probe_id"] == probe_id]
          assert len(probes) == 1
          Path("out/isolated-probes.json").write_text(json.dumps({
              "schema_version": source["schema_version"],
              "corpus_id": "protocol-localization-v2-isolated",
              "probes": probes,
          }, indent=2) + "\n")
          PY

      - name: Run fresh-process isolated localization probe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_protocol_localization.py \
            --probes out/isolated-probes.json \
            --model-dir /tmp/model-spelunker-smollm2 \
            --output out/isolated-rep.json \
            2>&1 | tee out-isolated-run.log

      - name: Validate isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_rep.py out/isolated-rep.json --min-probes 1 \
            | tee out-isolated-validation.log

      - name: Recheck batching equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/compare_equivalence.py \
            out/protocol-localization.json out/isolated-rep.json \
            --probe-id arith-a-full-vs-no-system \
            | tee out-equivalence.log

      - name: Summarize localization results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          b = json.loads(Path("out/protocol-localization.json").read_text())
          groups = defaultdict(list)
          for p in b["observations"]["probes"]:
              groups[p["contrast_id"]].append(p)

          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "corpus_id": b["probe_id"],
              "cost": b["cost"],
              "contrasts": {},
          }
          for contrast, probes in sorted(groups.items()):
              final_distances = []
              max_distances = []
              rows = []
              left_correct = right_correct = 0
              agreement_seen = agreement_yes = 0
              for p in probes:
                  left, right = p["conditions"]
                  left_correct += int(left["candidate_correct"] is True)
                  right_correct += int(right["candidate_correct"] is True)
                  final_distances.append(p["activation_contrast"][-1]["cosine_distance"])
                  max_distances.append(max(x["cosine_distance"] for x in p["activation_contrast"]))
                  for c in (left, right):
                      if c["surface_generation_agree"] is not None:
                          agreement_seen += 1
                          agreement_yes += int(c["surface_generation_agree"] is True)
                  rows.append({
                      "probe_id": p["probe_id"],
                      "expected": p["expected_candidate"],
                      "left_winner": left["candidate_winner"],
                      "right_winner": right["candidate_winner"],
                      "left_expected_margin": left["expected_candidate_margin"],
                      "right_expected_margin": right["expected_candidate_margin"],
                      "left_input_tokens": left["input_tokens"],
                      "right_input_tokens": right["input_tokens"],
                  })
              summary["contrasts"][contrast] = {
                  "n": len(probes),
                  "left_candidate_accuracy": left_correct / len(probes),
                  "right_candidate_accuracy": right_correct / len(probes),
                  "mean_final_layer_cosine_distance": sum(final_distances) / len(final_distances),
                  "mean_max_layer_cosine_distance": sum(max_distances) / len(max_distances),
                  "surface_generation_agreement_rate_when_parseable": agreement_yes / agreement_seen if agreement_seen else None,
                  "rows": rows,
              }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Normalized protocol-localization result\n\n")
              f.write(f"- run: `{summary['run_id']}`\n")
              f.write(f"- artifact: `{summary['artifact_identity']}`\n")
              f.write(f"- corpus: `{summary['corpus_id']}`\n")
              f.write(f"- total experiment seconds: `{summary['cost']['experiment_seconds']:.2f}`\n\n")
              f.write("| Contrast | N | Left accuracy | Right accuracy | Mean final cosine distance | Mean max cosine distance |\n")
              f.write("|---|---:|---:|---:|---:|---:|\n")
              for name, s in summary["contrasts"].items():
                  f.write(f"| {name} | {s['n']} | {s['left_candidate_accuracy']:.3f} | {s['right_candidate_accuracy']:.3f} | {s['mean_final_layer_cosine_distance']:.6f} | {s['mean_max_layer_cosine_distance']:.6f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-localization-${{ github.run_id }}
          path: |
            out/protocol-localization.json
            out/isolated-rep.json
            out/isolated-probes.json
            out-summary.json
            out-validation.log
            out-isolated-validation.log
            out-equivalence.log
            out-run.log
            out-isolated-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
