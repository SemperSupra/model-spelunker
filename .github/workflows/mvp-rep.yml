name: Model Spelunker Sink Token Panel

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/run_sink_token_panel.py"
      - "experiments/mvp/validate_sink_token_panel.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run sink-token identity panel
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_sink_token_panel.py \
            --output out/sink-token-panel.json \
            2>&1 | tee out-run.log

      - name: Validate predictive evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_sink_token_panel.py out/sink-token-panel.json \
            | tee out-validation.log

      - name: Summarize screen-to-holdout transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/sink-token-panel.json").read_text())
          d = b["derived_metrics"]
          rows = []
          for pid, row in d["panel_summary"].items():
              rows.append({
                  "panel_id": pid,
                  "kind": row["kind"],
                  "token_id": row.get("token_id"),
                  "cal_margin": row["calibration_mean_margin"],
                  "cal_top1": row["calibration_top1_rate"],
                  "hold_margin": row["holdout_mean_margin"],
                  "hold_top1": row["holdout_top1_rate"],
                  "sink_mass": row["mean_sink_mass"],
              })
          eligible = [x for x in rows if x["kind"] == "one-token"]
          eligible.sort(key=lambda x: (-x["cal_margin"], x["panel_id"]))
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "eligible_panel": b["observations"]["eligible_panel"],
              "ineligible_preregistered_panel": b["observations"]["ineligible_preregistered_panel"],
              "frozen_calibration_top3": d["frozen_calibration_top3"],
              "calibration_holdout_rank_correlation": d["calibration_holdout_rank_correlation"],
              "calibration_holdout_margin_correlation": d["calibration_holdout_margin_correlation"],
              "transfer": d["transfer"],
              "rows": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Attention-sink token identity screen → holdout\n\n")
              f.write(f"- frozen calibration top-3: `{', '.join(d['frozen_calibration_top3'])}`\n")
              f.write(f"- rank correlation calibration↔holdout: `{d['calibration_holdout_rank_correlation']}`\n")
              f.write(f"- margin correlation calibration↔holdout: `{d['calibration_holdout_margin_correlation']}`\n\n")
              f.write("| Token condition | Token ID | Cal margin | Cal top-1 | Holdout margin | Holdout top-1 | L18H8 sink mass |\n")
              f.write("|---|---:|---:|---:|---:|---:|---:|\n")
              for row in sorted(rows, key=lambda x: (x['kind'] != 'one-token', -x['cal_margin'], x['panel_id'])):
                  f.write(f"| {row['panel_id']} | {row['token_id'] if row['token_id'] is not None else ''} | {row['cal_margin']:.4f} | {row['cal_top1']:.3f} | {row['hold_margin']:.4f} | {row['hold_top1']:.3f} | {row['sink_mass']:.6f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-sink-token-panel-${{ github.run_id }}
          path: |
            out/sink-token-panel.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
