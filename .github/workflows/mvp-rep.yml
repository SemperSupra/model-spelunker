name: Model Spelunker Candidate Neighborhood

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_protocol_localization.py"
      - "experiments/mvp/run_candidate_neighborhood.py"
      - "experiments/mvp/candidate-neighborhood-spec.json"
      - "experiments/mvp/validate_candidate_neighborhood.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run candidate-neighborhood corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_candidate_neighborhood.py \
            --output out/candidate-neighborhood.json \
            2>&1 | tee out-run.log

      - name: Validate rank evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_candidate_neighborhood.py out/candidate-neighborhood.json \
            | tee out-validation.log

      - name: Summarize candidate ranks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/candidate-neighborhood.json").read_text())
          condition_stats = {
              "user-wrapper": {"top1": 0, "total": 0, "rank_sum": 0, "rr_sum": 0.0, "total_mean_winner_agree": 0, "generation_seen": 0, "generation_mean_winner_agree": 0},
              "no-user-wrapper": {"top1": 0, "total": 0, "rank_sum": 0, "rr_sum": 0.0, "total_mean_winner_agree": 0, "generation_seen": 0, "generation_mean_winner_agree": 0},
          }
          rows = []
          final_distances = []
          for p in b["observations"]["probes"]:
              row = {"probe_id": p["probe_id"], "expected": p["expected_candidate"]}
              for c in p["conditions"]:
                  s = condition_stats[c["condition_id"]]
                  rank = int(c["expected_candidate_rank_mean"])
                  s["total"] += 1
                  s["top1"] += int(rank == 1)
                  s["rank_sum"] += rank
                  s["rr_sum"] += 1.0 / rank
                  s["total_mean_winner_agree"] += int(c["candidate_winner"] == c["candidate_winner_total_logprob"])
                  if c["generation_candidate"] is not None:
                      s["generation_seen"] += 1
                      s["generation_mean_winner_agree"] += int(c["generation_candidate"] == c["candidate_winner"])
                  row[c["condition_id"]] = {
                      "mean_winner": c["candidate_winner"],
                      "total_winner": c["candidate_winner_total_logprob"],
                      "expected_rank_mean": c["expected_candidate_rank_mean"],
                      "expected_rank_total": c["expected_candidate_rank_total"],
                      "expected_mean_margin": c["expected_candidate_margin"],
                      "generation": c["generation"],
                      "generation_candidate": c["generation_candidate"],
                      "candidate_token_counts": {x["candidate"]: x["token_count"] for x in c["candidate_scores"]},
                  }
              final_distances.append(p["activation_contrast"][-1]["cosine_distance"])
              rows.append(row)

          for s in condition_stats.values():
              n = s["total"]
              s["top1_rate"] = s["top1"] / n
              s["mean_expected_rank"] = s["rank_sum"] / n
              s["mean_reciprocal_rank"] = s["rr_sum"] / n
              s["total_mean_winner_agreement_rate"] = s["total_mean_winner_agree"] / n
              s["generation_mean_winner_agreement_rate_when_exact_candidate"] = (
                  s["generation_mean_winner_agree"] / s["generation_seen"] if s["generation_seen"] else None
              )

          summary = {
              "run_id": b["provenance"]["run_id"],
              "corpus_id": b["probe_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "condition_stats": condition_stats,
              "mean_wrapper_effect_final_cosine_distance": sum(final_distances) / len(final_distances),
              "tasks": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Candidate-neighborhood rank result\n\n")
              for condition_id, s in condition_stats.items():
                  f.write(
                      f"- **{condition_id}**: top-1 `{s['top1']}/{s['total']}`, "
                      f"mean correct rank `{s['mean_expected_rank']:.3f}`, MRR `{s['mean_reciprocal_rank']:.3f}`, "
                      f"total/mean winner agreement `{s['total_mean_winner_agreement_rate']:.3f}`\n"
                  )
              f.write(f"- mean wrapper-effect final cosine distance: `{summary['mean_wrapper_effect_final_cosine_distance']:.6f}`\n\n")
              f.write("| Task | Expected | Wrapped mean rank/winner | Unwrapped mean rank/winner | Wrapped generation | Unwrapped generation |\n")
              f.write("|---|---|---|---|---|---|\n")
              for row in rows:
                  a, z = row["user-wrapper"], row["no-user-wrapper"]
                  f.write(
                      f"| {row['probe_id']} | {row['expected']} | {a['expected_rank_mean']} / {a['mean_winner']} | "
                      f"{z['expected_rank_mean']} / {z['mean_winner']} | {a['generation']} | {z['generation']} |\n"
                  )
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-candidate-neighborhood-${{ github.run_id }}
          path: |
            out/candidate-neighborhood.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
