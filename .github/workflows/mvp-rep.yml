name: Model Spelunker Neutral Prefix Challenge

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/run_neutral_prefix_challenge.py"
      - "experiments/mvp/validate_neutral_prefix_challenge.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run neutral-prefix challenge corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_neutral_prefix_challenge.py \
            --output out/neutral-prefix-challenge.json \
            2>&1 | tee out-run.log

      - name: Validate causal evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_neutral_prefix_challenge.py out/neutral-prefix-challenge.json \
            | tee out-validation.log

      - name: Summarize specificity result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/neutral-prefix-challenge.json").read_text())
          d = b["derived_metrics"]
          rows = []
          for head in d["head_condition_summary"]:
              key = f"L{head['layer']}H{head['head']}"
              for condition, m in head["conditions"].items():
                  rows.append({
                      "head": key,
                      "condition": condition,
                      "prefix_mass": m["mean_prefix_mass"],
                      "user_mass": m["mean_user_mass"],
                      "boundary_mass": m["mean_boundary_mass"],
                  })
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "tokenizer_metadata": b["observations"]["tokenizer_metadata"],
              "prefix_tokenization": b["observations"]["prefix_tokenization"],
              "condition_summary": d["condition_summary"],
              "head_conditions": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Neutral-prefix attention-sink challenge\n\n")
              f.write("### Behavior\n\n")
              f.write("| Condition | Top-1 | Mean rank | Mean correct margin |\n")
              f.write("|---|---:|---:|---:|\n")
              for name, row in d["condition_summary"].items():
                  f.write(f"| {name} | {row['top1_rate']:.3f} | {row['mean_correct_rank']:.3f} | {row['mean_correct_margin']:.4f} |\n")
              f.write("\n### L18H8 routing\n\n")
              f.write("| Condition | Prefix mass | User mass | Boundary mass |\n")
              f.write("|---|---:|---:|---:|\n")
              target = next(x for x in d["head_condition_summary"] if x["layer"] == 18 and x["head"] == 8)
              for name, m in target["conditions"].items():
                  f.write(f"| {name} | {m['mean_prefix_mass']:.6f} | {m['mean_user_mass']:.6f} | {m['mean_boundary_mass']:.6f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-neutral-prefix-${{ github.run_id }}
          path: |
            out/neutral-prefix-challenge.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
