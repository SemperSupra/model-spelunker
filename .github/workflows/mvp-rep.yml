name: Model Spelunker Prefix Attention Factorial

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/run_prefix_attention_factorial.py"
      - "experiments/mvp/validate_prefix_attention_factorial.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run prefix attention factorial corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_prefix_attention_factorial.py \
            --output out/prefix-attention-factorial.json \
            2>&1 | tee out-run.log

      - name: Validate causal evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_prefix_attention_factorial.py out/prefix-attention-factorial.json \
            | tee out-validation.log

      - name: Summarize factorial result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/prefix-attention-factorial.json").read_text())
          d = b["derived_metrics"]
          rows = []
          for h in d["head_factor_summary"]:
              rows.append({
                  "layer": h["layer"],
                  "head": h["head"],
                  "user_marker": h["user_mass_factor_effects"]["marker_main_effect"],
                  "user_role": h["user_mass_factor_effects"]["role_main_effect"],
                  "user_interaction": h["user_mass_factor_effects"]["interaction"],
                  "prefix_marker": h["control_prefix_mass_factor_effects"]["marker_main_effect"],
                  "prefix_role": h["control_prefix_mass_factor_effects"]["role_main_effect"],
                  "prefix_interaction": h["control_prefix_mass_factor_effects"]["interaction"],
              })
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "prefix_tokenization": b["observations"]["prefix_tokenization"],
              "behavior_summary": d["behavior_summary"],
              "behavior_factor_effects": d["behavior_factor_effects"],
              "heads": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Prefix attention factorial\n\n")
              f.write("| Head | Marker effect on user mass | Role effect | Interaction | Marker effect on prefix mass |\n")
              f.write("|---|---:|---:|---:|---:|\n")
              for row in rows:
                  f.write(f"| L{row['layer']}H{row['head']} | {row['user_marker']:.4f} | {row['user_role']:.4f} | {row['user_interaction']:.4f} | {row['prefix_marker']:.4f} |\n")
              f.write("\n### Behavior\n\n")
              f.write("| Condition | Top-1 | Mean rank | Mean correct margin |\n")
              f.write("|---|---:|---:|---:|\n")
              for name, row in d["behavior_summary"].items():
                  f.write(f"| {name} | {row['top1_rate']:.3f} | {row['mean_correct_rank']:.3f} | {row['mean_correct_margin']:.4f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-prefix-factorial-${{ github.run_id }}
          path: |
            out/prefix-attention-factorial.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
