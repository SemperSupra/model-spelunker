name: Model Spelunker Runtime Cache Qualification

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/requirements.txt"
      - "experiments/mvp/runtime_cache_probe.py"
      - "experiments/mvp/check_runtime_cache.py"
      - "experiments/mvp/runtime-cache-nonce.txt"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Start setup timer and derive exact cache key inputs
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          date +%s%N > out/setup-start-ns.txt
          python3 --version
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact pip cache
        id: pip-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: model-spelunker-pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-torch2.5.1-${{ hashFiles('experiments/mvp/requirements.txt') }}

      - name: Install exact CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Measure restored runtime
        shell: bash
        env:
          CACHE_HIT: ${{ steps.pip-cache.outputs.cache-hit }}
          CACHE_KEY: model-spelunker-pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-torch2.5.1-${{ hashFiles('experiments/mvp/requirements.txt') }}
        run: |
          set -euo pipefail
          python3 experiments/mvp/runtime_cache_probe.py \
            --started-ns-file out/setup-start-ns.txt \
            --cache-hit "$CACHE_HIT" \
            --cache-key "$CACHE_KEY" \
            --output out/runtime-cache-metrics.json \
            | tee out-runtime-cache.log

      - name: Validate runtime identity
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/check_runtime_cache.py out/runtime-cache-metrics.json \
            | tee out-validation.log

      - name: Summarize cache qualification run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('out/runtime-cache-metrics.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('## Runtime/pip cache qualification\n\n')
              f.write(f"- exact cache hit: `{m['cache_hit']}`\n")
              f.write(f"- restore + install elapsed: `{m['setup_restore_install_seconds']:.3f} s`\n")
              f.write(f"- pip cache size: `{m['pip_cache_size_bytes'] / (1024**2):.1f} MiB`\n")
              f.write(f"- pip environment hash: `{m['pip_freeze_sha256']}`\n")
              f.write(f"- deterministic Torch smoke hash: `{m['torch_smoke_sha256']}`\n")
          PY

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-runtime-cache-${{ github.run_id }}
          path: |
            out/runtime-cache-metrics.json
            out-runtime-cache.log
            out-validation.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
