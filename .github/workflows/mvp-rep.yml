name: Model Spelunker Activation POKE

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_activation_poke.py"
      - "experiments/mvp/validate_activation_poke.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run activation POKE corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_activation_poke.py \
            --output out/activation-poke.json \
            2>&1 | tee out-run.log

      - name: Validate causal evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_activation_poke.py out/activation-poke.json \
            | tee out-validation.log

      - name: Summarize intervention result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/activation-poke.json").read_text())
          variants = b["derived_metrics"]["aggregate_variants"]
          rows = []
          for name, m in sorted(variants.items()):
              rows.append({
                  "variant": name,
                  "surface_progress": m["mean_surface_progress_to_start"],
                  "hidden_progress": m["mean_hidden_progress_to_start"],
                  "top1": m["top1_correct_rate"],
              })
          best_surface = max(rows, key=lambda x: x["surface_progress"])
          best_hidden = max(rows, key=lambda x: x["hidden_progress"])
          random_rows = [x for x in rows if "random-matched" in x["variant"]]
          summary = {
              "run_id": b["provenance"]["run_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "best_surface_progress": best_surface,
              "best_hidden_progress": best_hidden,
              "matched_random_controls": random_rows,
              "variants": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Activation POKE causal rep\n\n")
              f.write(f"- best candidate-surface progress toward actual start-token state: `{best_surface['variant']}` = `{best_surface['surface_progress']:.3f}`\n")
              f.write(f"- best final-hidden progress toward actual start-token state: `{best_hidden['variant']}` = `{best_hidden['hidden_progress']:.3f}`\n\n")
              f.write("| Variant | Mean surface progress | Mean hidden progress | Top-1 correct rate |\n")
              f.write("|---|---:|---:|---:|\n")
              for row in rows:
                  f.write(f"| {row['variant']} | {row['surface_progress']:.3f} | {row['hidden_progress']:.3f} | {row['top1']:.3f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-activation-poke-${{ github.run_id }}
          path: |
            out/activation-poke.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
