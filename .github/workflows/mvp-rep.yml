name: Model Spelunker Label Permutation

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_protocol_localization.py"
      - "experiments/mvp/run_label_permutation.py"
      - "experiments/mvp/label-permutation-spec.json"
      - "experiments/mvp/validate_rep.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run label-permutation corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_label_permutation.py \
            --output out/label-permutation.json \
            2>&1 | tee out-run.log

      - name: Validate evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_rep.py out/label-permutation.json --min-probes 12 \
            | tee out-validation.log

      - name: Summarize label-bias falsification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          b = json.loads(Path("out/label-permutation.json").read_text())
          probes = b["observations"]["probes"]
          by_task = defaultdict(dict)
          condition_stats = {
              "user-wrapper": {"correct": 0, "total": 0, "a": 0, "b": 0},
              "no-user-wrapper": {"correct": 0, "total": 0, "a": 0, "b": 0},
          }
          contrast_distances = defaultdict(list)

          for p in probes:
              task_id, labeling = p["probe_id"].rsplit("-correct-is-", 1)
              labeling_id = "correct-is-" + labeling
              by_task[task_id][labeling_id] = p
              contrast_distances[labeling_id].append(p["activation_contrast"][-1]["cosine_distance"])
              for c in p["conditions"]:
                  s = condition_stats[c["condition_id"]]
                  s["total"] += 1
                  s["correct"] += int(c["candidate_correct"] is True)
                  s[c["candidate_winner"].lower()] += 1

          semantic_follow = {"user-wrapper": 0, "no-user-wrapper": 0}
          complete_tasks = 0
          task_rows = []
          for task_id, labelings in sorted(by_task.items()):
              if set(labelings) != {"correct-is-a", "correct-is-b"}:
                  continue
              complete_tasks += 1
              row = {"task_id": task_id}
              for index, condition_id in enumerate(("user-wrapper", "no-user-wrapper")):
                  win_a = labelings["correct-is-a"]["conditions"][index]["candidate_winner"]
                  win_b = labelings["correct-is-b"]["conditions"][index]["candidate_winner"]
                  follows = win_a == "A" and win_b == "B"
                  semantic_follow[condition_id] += int(follows)
                  row[condition_id] = {
                      "winner_when_correct_is_a": win_a,
                      "winner_when_correct_is_b": win_b,
                      "follows_semantic_answer_across_swap": follows,
                  }
              task_rows.append(row)

          summary = {
              "run_id": b["provenance"]["run_id"],
              "corpus_id": b["probe_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "condition_stats": condition_stats,
              "complete_task_pairs": complete_tasks,
              "semantic_follow_task_count": semantic_follow,
              "semantic_follow_rate": {
                  k: semantic_follow[k] / complete_tasks if complete_tasks else None
                  for k in semantic_follow
              },
              "mean_wrapper_effect_final_cosine_distance": {
                  k: sum(v) / len(v) for k, v in contrast_distances.items()
              },
              "tasks": task_rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Label-permutation falsification\n\n")
              for condition_id, stats in condition_stats.items():
                  f.write(
                      f"- **{condition_id}**: accuracy `{stats['correct']}/{stats['total']}`, "
                      f"A winners `{stats['a']}`, B winners `{stats['b']}`, "
                      f"semantic-follow pairs `{semantic_follow[condition_id]}/{complete_tasks}`\n"
                  )
              f.write("\n")
              for labeling, distance in summary["mean_wrapper_effect_final_cosine_distance"].items():
                  f.write(f"- mean wrapper-effect final cosine distance ({labeling}): `{distance:.6f}`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-label-permutation-${{ github.run_id }}
          path: |
            out/label-permutation.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
