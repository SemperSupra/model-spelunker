name: Model Spelunker Semantic Content

on:
  push:
    branches:
      - impl/mvp-execution
    paths:
      - "experiments/mvp/run_rep.py"
      - "experiments/mvp/run_protocol_localization.py"
      - "experiments/mvp/run_semantic_content.py"
      - "experiments/mvp/semantic-content-spec.json"
      - "experiments/mvp/validate_semantic_content.py"
      - "schemas/**"
      - ".github/workflows/mvp-rep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-mvp-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record runner baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h /
          free -h

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1"
          python3 -m pip install --disable-pip-version-check --no-input \
            -r experiments/mvp/requirements.txt

      - name: Run semantic-content corpus
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 experiments/mvp/run_semantic_content.py \
            --output out/semantic-content.json \
            2>&1 | tee out-run.log

      - name: Validate semantic candidates and token matching
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/mvp/validate_semantic_content.py out/semantic-content.json \
            | tee out-validation.log

      - name: Summarize semantic-content result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee out-summary.json
          import json
          import os
          from pathlib import Path

          b = json.loads(Path("out/semantic-content.json").read_text())
          stats = {
              "user-wrapper": {"correct": 0, "total": 0},
              "no-user-wrapper": {"correct": 0, "total": 0},
          }
          rows = []
          final_distances = []
          for p in b["observations"]["probes"]:
              row = {
                  "probe_id": p["probe_id"],
                  "expected": p["expected_candidate"],
              }
              for c in p["conditions"]:
                  stats[c["condition_id"]]["total"] += 1
                  stats[c["condition_id"]]["correct"] += int(c["candidate_correct"] is True)
                  token_counts = {x["candidate"]: len(x["tokens"]) for x in c["candidate_scores"]}
                  row[c["condition_id"]] = {
                      "winner": c["candidate_winner"],
                      "correct": c["candidate_correct"],
                      "expected_margin": c["expected_candidate_margin"],
                      "candidate_token_counts": token_counts,
                      "generation": c["generation"],
                  }
              final_distances.append(p["activation_contrast"][-1]["cosine_distance"])
              rows.append(row)

          summary = {
              "run_id": b["provenance"]["run_id"],
              "corpus_id": b["probe_id"],
              "artifact_identity": b["artifact_provenance"]["identity_digest"],
              "cost": b["cost"],
              "condition_stats": stats,
              "mean_wrapper_effect_final_cosine_distance": sum(final_distances) / len(final_distances),
              "tasks": rows,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Direct semantic-content scoring\n\n")
              for condition_id, s in stats.items():
                  f.write(f"- **{condition_id}**: `{s['correct']}/{s['total']}` semantic candidate accuracy\n")
              f.write(f"- mean wrapper-effect final cosine distance: `{summary['mean_wrapper_effect_final_cosine_distance']:.6f}`\n\n")
              f.write("| Task | Expected | Wrapped winner | Unwrapped winner | Wrapped margin | Unwrapped margin |\n")
              f.write("|---|---|---|---|---:|---:|\n")
              for row in rows:
                  a, z = row["user-wrapper"], row["no-user-wrapper"]
                  f.write(f"| {row['probe_id']} | {row['expected']} | {a['winner']} | {z['winner']} | {a['expected_margin']:.4f} | {z['expected_margin']:.4f} |\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-semantic-content-${{ github.run_id }}
          path: |
            out/semantic-content.json
            out-summary.json
            out-validation.log
            out-run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
