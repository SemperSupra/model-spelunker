name: Android Embodied Local Qualification

on:
  push:
    branches:
      - exp/android-embodied-qualification
    paths:
      - ".github/workflows/android-embodied-hosted-qualification.yml"
      - "qualification/adapters/android_mobile_tools.py"
      - "qualification/adapters/android_reference_actor.py"
      - "qualification/adapters/openworker_projected.py"
      - "qualification/run_android_embodied.py"
      - "qualification/run_task.py"
      - "qualification/test_android_embodied.py"
      - "qualification/tasks/android-settings-24h-struct-v0/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-embodied-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate mobile task and harness contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            qualification/adapters/android_mobile_tools.py \
            qualification/adapters/android_reference_actor.py \
            qualification/run_android_embodied.py \
            qualification/run_task.py
          python3 qualification/tasks/android-settings-24h-struct-v0/verify.py --self-test
          python3 -m unittest -v qualification/test_android_embodied.py

  qualify:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENWORKER_UPSTREAM_SHA: "5bc10d928e0b64aae74313349a3b17bd19643ae2"
      HARNESS_ARTIFACT_REF: "ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83"
      HARNESS_ADMISSION_REF: "github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json"
      OLLAMA_VERSION: "0.34.1"
      OLLAMA_ARCHIVE_SHA256: "f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034"
      OLLAMA_MODEL_TAG: "qwen3:1.7b"
      OLLAMA_MODEL_DIGEST_PREFIX: "8f68893c685c"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/tmp/model-spelunker-android-ollama-models"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      MODEL_SPELUNKER_MODEL: "ollama:qwen3:1.7b"
      MODEL_SPELUNKER_REASONING_EFFORT: "none"
      MODEL_SPELUNKER_MAX_TOKENS: "2048"
      CANDIDATE_META: "/tmp/model-spelunker-android-candidate.json"
      RECEIPT: "/tmp/model-spelunker-android-receipt.json"
      REFERENCE_RECEIPT: "/tmp/model-spelunker-android-reference-receipt.json"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hydrate admitted OpenWorker artifact
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$HARNESS_ARTIFACT_REF" >/dev/null
          extract="$RUNNER_TEMP/openworker-artifact"
          mkdir -p "$extract"
          cid="$(docker create "$HARNESS_ARTIFACT_REF" /artifact/noop)"
          docker cp "$cid:/artifact/." "$extract/"
          docker rm "$cid" >/dev/null
          test -s "$extract/build-receipt.json"

          ARTIFACT_ROOT="$extract" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["ARTIFACT_ROOT"])
          receipt=json.loads((root/"build-receipt.json").read_text())
          assert receipt["harness"]["name"]=="openworker"
          assert receipt["source"]["revision"]==os.environ["OPENWORKER_UPSTREAM_SHA"]
          for row in receipt["payload"]["files"]:
              data=(root/row["path"]).read_bytes()
              assert len(data)==row["bytes"]
              assert hashlib.sha256(data).hexdigest()==row["sha256"]
          print("PASS admitted OpenWorker artifact integrity")
          PY

          venv="$RUNNER_TEMP/openworker-prebuilt-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --no-index --no-deps "$extract/wheelhouse"/*.whl
          "$venv/bin/python" -c 'import coworker; import coworker.engine'
          echo "OPENWORKER_VENV=$venv" >> "$GITHUB_ENV"

      - name: Install pinned Ollama ephemerally
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"

      - name: Start isolated Ollama and hydrate pinned model
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import json,os,urllib.request
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags",timeout=10) as response:
              data=json.load(response)
          wanted=os.environ["OLLAMA_MODEL_TAG"]
          row=next((m for m in data.get("models",[]) if m.get("name")==wanted),None)
          if row is None:
              raise SystemExit(f"model not present: {wanted}")
          digest=str(row.get("digest") or "").removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"OLLAMA_MODEL_DIGEST={digest}\n")
          print("PASS pinned Qwen3 artifact admission")
          PY

      - name: Build exact configured-actor metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          task=json.loads(Path("qualification/tasks/android-settings-24h-struct-v0/task.json").read_text())
          candidate={
              "harness":{
                  "name":"openworker",
                  "version":os.environ["OPENWORKER_UPSTREAM_SHA"],
                  "artifact_ref":os.environ["HARNESS_ARTIFACT_REF"],
                  "admission_ref":os.environ["HARNESS_ADMISSION_REF"],
              },
              "model":{
                  "provider":"ollama",
                  "id":os.environ["OLLAMA_MODEL_TAG"],
                  "artifact_ref":"ollama-sha256:"+os.environ["OLLAMA_MODEL_DIGEST"],
                  "treatment_kind":"local-artifact",
              },
              "toolset":task["projected_tools"],
              "configuration":{
                  "projection":task["projected_tools"],
                  "parallel_tool_calls":False,
                  "max_tokens":int(os.environ["MODEL_SPELUNKER_MAX_TOKENS"]),
                  "reasoning_effort":"none",
                  "max_iterations":4,
                  "ollama_context_length":int(os.environ["OLLAMA_CONTEXT_LENGTH"]),
                  "harness_delivery":"prebuilt-admitted-artifact",
              },
          }
          Path(os.environ["CANDIDATE_META"]).write_text(
              json.dumps(candidate,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Calibrate then execute local embodied actor rep
        id: embodied
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY DEEPSEEK_API_KEY GROQ_API_KEY NVIDIA_API_KEY OPENROUTER_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done
          set +e
          python3 qualification/run_android_embodied.py \
            --task-dir qualification/tasks/android-settings-24h-struct-v0 \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id "gha-ubuntu-24.04-android-api35-kvm-openworker-prebuilt-ollama" \
            --substrate-profile-commit "prebuilt-openworker-ollama-v1+android-api35-v1" \
            --candidate-meta "$CANDIDATE_META" \
            --receipt "$RECEIPT" \
            --reference-receipt "$REFERENCE_RECEIPT" \
            -- "$OPENWORKER_VENV/bin/python" \
              "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e
          echo "qualification_rc=$rc" >> "$GITHUB_OUTPUT"
          test -f "$REFERENCE_RECEIPT"
          if [ "$rc" -ne 0 ]; then
            echo "ANDROID_EMBODIED_RESULT=nonzero-$rc"
          fi

      - name: Inspect bounded receipts and resource tail
        if: always()
        run: |
          set -euo pipefail
          for f in "$REFERENCE_RECEIPT" "$RECEIPT"; do
            if [ -f "$f" ]; then
              python3 - "$f" <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(json.dumps({
              "run_id":r.get("run_id"),
              "task":(r.get("task") or {}).get("id"),
              "candidate":(r.get("candidate") or {}).get("model"),
              "success":(r.get("observation") or {}).get("success"),
              "failure_class":(r.get("observation") or {}).get("failure_class"),
              "mobile_action_count":(r.get("observation") or {}).get("mobile_action_count"),
              "failure_signals":(r.get("observation") or {}).get("failure_signals"),
          },sort_keys=True))
          PY
            fi
          done
          echo "OLLAMA_LOG_TAIL"
          tail -80 "$RUNNER_TEMP/ollama.log" || true
          free -h || true
          df -h / "$RUNNER_TEMP" || true

      - name: Upload public-safe qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-embodied-local-${{ github.run_attempt }}
          path: |
            /tmp/model-spelunker-android-reference-receipt.json
            /tmp/model-spelunker-android-receipt.json
          if-no-files-found: warn
          retention-days: 7
