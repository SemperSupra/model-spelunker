name: OpenWorker Tool-Use Hint Interview

# Controlled A/B: same immutable admitted harness, model, task, venue, tool
# projection, external verifier. Vary only explicit prompt treatment.
on:
  pull_request:
    paths:
      - '.github/workflows/openworker-tool-use-hint-interview.yml'
      - '.github/workflows/openworker-prebuilt-ollama-qualification.yml'
      - 'qualification/adapters/openworker_projected.py'
      - 'qualification/adapters/tool_hint.py'
      - 'qualification/test_tool_hint.py'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: openworker-tool-use-hint-interview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  interview:
    name: Boundary task / ${{ matrix.treatment_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - treatment_id: tool-hint-control
            tool_hint_mode: none
          - treatment_id: tool-hint-inspect-v1
            tool_hint_mode: inspect-before-claim-v1
    uses: ./.github/workflows/openworker-prebuilt-ollama-qualification.yml
    with:
      artifact_ref: ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83
      admission_ref: github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json
      task: boundary-bugfix-v0
      reasoning_effort: none
      treatment_id: ${{ matrix.treatment_id }}
      tool_hint_mode: ${{ matrix.tool_hint_mode }}
