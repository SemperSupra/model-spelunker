name: OpenWorker Qwen Model-Capacity Discriminator

# One bounded model-selection treatment; other actor/task factors match
# the earlier Qwen3 1.7B policy-first workcell. No sovereign machine use.
on:
  pull_request:
    paths:
      - '.github/workflows/openworker-model-capacity-discriminator.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: openworker-qwen4b-capacity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  task_interview:
    name: OpenWorker Qwen3 4B / boundary policy task
    uses: ./.github/workflows/openworker-prebuilt-ollama-qualification.yml
    with:
      artifact_ref: ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83
      admission_ref: github:SemperSupra/model-spelunker@4f939c4beccb7652b851c4a228d78d804b0e95c7:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission-v2.json
      task: boundary-bugfix-v0
      model_tag: qwen3:4b
      model_digest_prefix: 359d7dd4bcda
      reasoning_effort: none
      treatment_id: qwen3-4b-policy-first
      tool_hint_mode: policy-first-v1
      output_diagnostic_mode: boundary-output-v1
