# FROZEN after corrected validator PASS run 36114495478; no repeat is earned.
# validator-replay-v2: same preserved generator artifact; validator semantics corrected only
name: Native TTS Validator Replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  validate-preserved-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '36114073053'
      SOURCE_ARTIFACT_ID: '10854915251'
      SOURCE_ARTIFACT_DIGEST: 'sha256:77f089041e5364b0f0513e3663fe98a28727bffacbc9de22520921d5a5f59920'
      EXPECTED_AUDIO_SHA256: 'sha256:03ba34974a9421862eb78ba0e212fd06263bcbb48427a5f34f8cfa7e843a7542'
      FOUNDRY_REF: '6622753fd5914be87fb1b6d987ceb7cae46c7ff5'
      LOGICAL_ID: 'asr/faster-whisper/tiny'
      EXPECTED_DIGEST: 'sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download preserved generator artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-tts-generator-36114073053
          path: ${{ runner.temp }}/tts-generator
          github-token: ${{ github.token }}
          run-id: 36114073053

      - name: Bind preserved audio identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"tts-generator"
          audio=root/"speech.aiff"
          generation=json.loads((root/"generation.json").read_text())
          sha="sha256:"+hashlib.sha256(audio.read_bytes()).hexdigest()
          assert sha == os.environ["EXPECTED_AUDIO_SHA256"]
          assert sha == generation["output"]["sha256"]
          assert generation["status"] == "generated"
          assert generation["actor"]["requested_voice"] == "Samantha"
          assert generation["actor"]["voice_admitted"] is True
          print("PASS preserved generator identity "+sha)
          PY

      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: ${{ env.FOUNDRY_REF }}
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Build exact ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .asr-venv
          .asr-venv/bin/python -m pip install --quiet --disable-pip-version-check --no-input             "faster-whisper==1.2.1"             "ctranslate2==4.6.0"
          PYTHONPATH=. .asr-venv/bin/python qualification/test_validate_tts_audio.py

      - name: Verify and hydrate approved ASR artifact
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          catalog=json.loads(Path("foundry/catalog/approved.json").read_text())
          entry=catalog["artifacts"][os.environ["LOGICAL_ID"]]
          assert entry["approved_digest"] == os.environ["EXPECTED_DIGEST"]
          assert entry["upstream_exact_revision"] == "d90ca5fe260221311c53c58e660288d3deb8d356"
          assert entry["license_spdx_id"] == "MIT"
          PY
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cache="$RUNNER_TEMP/tts-validator/foundry-cache"
          mkdir -p "$cache"
          MODEL_DIR="$(.asr-venv/bin/python foundry/tools/hydrate.py             --catalog foundry/catalog/approved.json             --id "$LOGICAL_ID"             --cache-root "$cache"             --oras "$(command -v oras)" | tail -n1)"
          test -d "$MODEL_DIR"
          echo "MODEL_DIR=$MODEL_DIR" >> "$GITHUB_ENV"

      - name: Validate preserved speech and record final disposition
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tts-validation"
          mkdir -p "$out"
          set +e
          PYTHONPATH=. .asr-venv/bin/python qualification/validate_tts_audio.py             --model-dir "$MODEL_DIR"             --audio "$RUNNER_TEMP/tts-generator/speech.aiff"             --source qualification/tasks/tts-content-fidelity-v0/fixture/source.txt             --generation-evidence "$RUNNER_TEMP/tts-generator/generation.json"             --output "$out/validation.json"             --max-wer 0.10
          rc=$?
          set -e
          test -s "$out/validation.json"
          RC="$rc" python3 - "$out/validation.json" "$RUNNER_TEMP/tts-generator/generation.json" "$out/final-result.json" <<'PY'
          import json,os,sys
          validation=json.load(open(sys.argv[1]))
          generation=json.load(open(sys.argv[2]))
          rc=int(os.environ["RC"])
          assert rc == (0 if validation["success"] else 1)
          result={
              "schema_version":1,
              "record_type":"tts-qualification-result",
              "experiment_id":"macos-say-samantha-tts-content-v0-screen",
              "task_id":"tts-content-fidelity-v0",
              "actor_id":"macos-say-samantha-macos26-arm64-v0",
              "source_generator_run_id":"36114073053",
              "source_generator_artifact_id":"10854915251",
              "source_generator_artifact_digest":"sha256:77f089041e5364b0f0513e3663fe98a28727bffacbc9de22520921d5a5f59920",
              "generation":generation,
              "validation":validation,
              "success":validation["success"],
              "termination_class":"semantic-success" if validation["success"] else "semantic-failure",
          }
          open(sys.argv[3],"w").write(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("TTS_QUALIFICATION_RESULT="+("PASS" if result["success"] else "FAIL_VALID_OBSERVATION"))
          print("TTS_ASR_LANGUAGE="+str(validation["transcript"]["language"]))
          print("TTS_ASR_WER="+str(validation["transcript"]["word_error_rate"]))
          print("TTS_ASR_MISSING_TOKENS="+json.dumps(validation["transcript"]["missing_required_tokens"]))
          print("TTS_AUDIO_DURATION_SECONDS="+str(validation["audio"]["duration_seconds"]))
          print("TTS_AUDIO_SHA256="+str(validation["audio"]["sha256"]))
          PY
          exit 0

      - name: Upload joined validator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tts-validator-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/tts-validation/**
          if-no-files-found: warn
          retention-days: 30
