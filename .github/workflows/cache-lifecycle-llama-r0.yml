name: Cache lifecycle R1 llama.cpp model switch
on:
  pull_request:
    paths: ['.github/workflows/cache-lifecycle-llama-r0.yml']
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LLAMA_REV: a6ac41c757c066941766164439f6876f2deaab04
      MODEL_SHA: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned native CPU server and obtain verified public fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-r0"
          cd "$RUNNER_TEMP/cache-r0"
          git init upstream
          git -C upstream remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C upstream fetch --depth=1 origin "$LLAMA_REV"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$LLAMA_REV"
          cmake -S upstream -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build --target llama-server -j 2
          curl --fail --location --retry 2 --max-time 120 https://huggingface.co/ggml-org/test-model-stories260K/resolve/main/stories260K-f32.gguf -o model.gguf
          printf '%s  model.gguf\n' "$MODEL_SHA" | sha256sum -c -
          curl --fail --location --retry 2 --max-time 120 https://huggingface.co/ggml-org/stories15M_MOE/resolve/main/stories15M_MOE-F16.gguf -o model-b.gguf
          printf '%s  model-b.gguf\n' 1240dfc1957df9f3550dd6c1d9e64b466fc2f452d8bc34bd4e45e1a1e2ca6055 | sha256sum -c -
          sha256sum build/bin/llama-server model.gguf model-b.gguf > identities.txt
          cp upstream/LICENSE upstream-license.txt
      - name: Paired cold and restored continuations across process destruction
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cache-r0"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time,urllib.request
          root=pathlib.Path.cwd()
          (root/'slots').mkdir()
          rows=[]
          def receipt():
              (root/'receipt.json').write_text(json.dumps(dict(source=os.environ['LLAMA_REV'],model_sha=os.environ['MODEL_SHA'],workflow_sha=os.environ['GITHUB_SHA'],scope='tiny CPU fixture, not agent or GPU qualification',rows=rows),indent=2))
          def req(path,data=None):
              body=None if data is None else json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18081'+path,data=body,headers={'Content-Type':'application/json'}),timeout=30) as r:
                  return json.load(r)
          def start(model='model.gguf'):
              log=open(root/'server.log','ab')
              t=time.monotonic()
              p=subprocess.Popen([str(root/'build/bin/llama-server'),'-m',str(root/model),'-c','512','-np','1','-t','2','--host','127.0.0.1','--port','18081','--slot-save-path',str(root/'slots')],stdout=log,stderr=log)
              log.close()
              for _ in range(120):
                  if p.poll() is not None: raise RuntimeError('server exited')
                  try:
                      req('/health')
                      return p,time.monotonic()-t
                  except OSError: time.sleep(.25)
              p.kill();p.wait()
              raise RuntimeError('readiness timeout')
          def stop(p):
              p.terminate()
              try:p.wait(timeout=10)
              except subprocess.TimeoutExpired:p.kill();p.wait()
              assert p.poll() is not None
          def completion(prompt,n):
              t=time.monotonic()
              r=req('/completion',dict(prompt=prompt,id_slot=0,n_predict=n,temperature=0,seed=42,cache_prompt=True))
              return dict(content=r['content'],timings=r['timings'],wall_s=time.monotonic()-t)
          for i in range(3):
              prefix=('Once upon a time there was a little cat. '*12)+str(i)+' '
              p,startup=start()
              try:
                  seed=completion(prefix,4)
                  target=prefix+seed['content']+' Then '
                  tokens=req('/tokenize',{'content':target})['tokens']
                  t=time.monotonic()
                  saved=req('/slots/0?action=save',{'filename':'session.bin'})
                  save_s=time.monotonic()-t
                  snapshot=root/'slots/session.bin'
                  digest=hashlib.sha256(snapshot.read_bytes()).hexdigest()
                  old=p.pid
              finally:stop(p)
              row=dict(rep=i,seed=seed,save=saved,save_s=save_s,bytes=snapshot.stat().st_size,snapshot_sha=digest,old_pid=old,seed_startup_s=startup,target_tokens=tokens)
              rows.append(row);receipt()
              b,b_start=start('model-b.gguf')
              try:
                  row['model_b']=dict(pid=b.pid,startup_s=b_start,completion=completion('An unrelated story about a dog.',8))
                  assert b.pid!=old and row['model_b']['completion']['timings']['predicted_n']>0
              finally:stop(b);receipt()
              assert hashlib.sha256(snapshot.read_bytes()).hexdigest()==digest
              for arm in (['cold','restore'] if i%2==0 else ['restore','cold']):
                  p,startup=start()
                  try:
                      assert p.pid not in (old,row['model_b']['pid'])
                      a=dict(pid=p.pid,startup_s=startup)
                      row[arm]=a
                      if arm=='restore':
                          t=time.monotonic()
                          a['restore']=req('/slots/0?action=restore',{'filename':'session.bin'})
                          a['restore_s']=time.monotonic()-t
                      a['completion']=completion(target,8)
                  finally:stop(p);receipt()
              cold=row['cold']['completion']; warm=row['restore']['completion']
              row['output_match']=cold['content']==warm['content']
              row['prefill_reduced']=warm['timings']['prompt_n']<cold['timings']['prompt_n']
              row['restored_count_matches']=row['restore']['restore']['n_restored']==saved['n_saved']>0
              receipt()
          assert all(r['output_match'] and r['prefill_reduced'] and r['restored_count_matches'] for r in rows), 'native cache witness failed'
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: llama-cache-lifecycle-r1
          path: |
            ${{ runner.temp }}/cache-r0/receipt.json
            ${{ runner.temp }}/cache-r0/identities.txt
            ${{ runner.temp }}/cache-r0/upstream-license.txt
            ${{ runner.temp }}/cache-r0/server.log
          if-no-files-found: warn
          retention-days: 14
