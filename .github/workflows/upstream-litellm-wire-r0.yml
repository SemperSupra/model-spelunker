name: LiteLLM native tool wire R0
on:
  pull_request:
    paths:
      - '.github/workflows/upstream-litellm-wire-r0.yml'
permissions:
  contents: read
jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install pinned gateway
        run: |
          python3 -m venv "$RUNNER_TEMP/lite"
          "$RUNNER_TEMP/lite/bin/pip" install --disable-pip-version-check 'litellm[proxy] @ git+https://github.com/BerriAI/litellm.git@489e1bcacb6fac79795459542ceb941ba69c4ee4'
          "$RUNNER_TEMP/lite/bin/pip" freeze > dependencies.txt
      - name: Exercise real HTTP gateway with separate synthetic provider
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          LITELLM_TELEMETRY: 'False'
        run: |
          cat > "$RUNNER_TEMP/wire.py" <<'PY'
          import json, time, subprocess, os, urllib.request, urllib.error, threading, sys
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from pathlib import Path
          from copy import deepcopy
          temp=Path(os.environ["RUNNER_TEMP"])
          observed=[]
          tool={"type":"function","function":{"name":"lookup","description":"Read synthetic value","parameters":{"type":"object","properties":{"key":{"type":"string"}},"required":["key"],"additionalProperties":False}}}
          message={"role":"assistant","content":None,"tool_calls":[{"id":"call_fixture","type":"function","function":{"name":"lookup","arguments":'{"key":"alpha"}'}}]}
          class Provider(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_POST(self):
                  q=json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  observed.append(q)
                  if q["messages"][-1]["content"]=="FAIL_FIXTURE":
                      self.send_response(400); self.send_header("Content-Type","application/json"); self.end_headers()
                      self.wfile.write(b'{"error":{"message":"synthetic rejected input","type":"invalid_request_error","code":"invalid_request"}}'); return
                  if q.get("stream"):
                      self.send_response(200); self.send_header("Content-Type","text/event-stream"); self.end_headers()
                      for delta,finish in [({"role":"assistant","tool_calls":[{"index":0,"id":"call_fixture","type":"function","function":{"name":"lookup","arguments":""}}]},None),({"tool_calls":[{"index":0,"function":{"arguments":'{"key":'}}]},None),({"tool_calls":[{"index":0,"function":{"arguments":'"alpha"}'}}]},None),({},"tool_calls")]:
                          obj={"id":"chatcmpl-fixture","object":"chat.completion.chunk","created":1,"model":"fixture","choices":[{"index":0,"delta":delta,"finish_reason":finish}]}
                          self.wfile.write(("data: "+json.dumps(obj)+"\n\n").encode()); self.wfile.flush()
                      self.wfile.write(b"data: [DONE]\n\n"); return
                  obj={"id":"chatcmpl-fixture","object":"chat.completion","created":1,"model":"fixture","choices":[{"index":0,"message":message,"finish_reason":"tool_calls"}],"usage":{"prompt_tokens":17,"completion_tokens":8,"total_tokens":25}}
                  self.send_response(200); self.send_header("Content-Type","application/json"); self.end_headers(); self.wfile.write(json.dumps(obj).encode())
          server=ThreadingHTTPServer(("127.0.0.1",18761),Provider)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          cfg=temp/"lite-wire.yaml"
          cfg.write_text("model_list:\n  - model_name: fixture\n    litellm_params:\n      model: openai/fixture\n      api_base: http://127.0.0.1:18761/v1\n      api_key: synthetic-not-a-secret\n      num_retries: 0\n")
          receipt={"source":"489e1bcacb6fac79795459542ceb941ba69c4ee4","scope":"synthetic provider wire, not model inference","cases":[],"status":"ERROR"}
          with (temp/"gateway.log").open("w") as log:
              proc=subprocess.Popen([str(temp/"lite/bin/litellm"),"--config",str(cfg),"--host","127.0.0.1","--port","18762"],stdout=log,stderr=subprocess.STDOUT)
              try:
                  for i in range(60):
                      if proc.poll() is not None: raise RuntimeError("gateway exited")
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18762/health/liveliness",timeout=2) as res:
                              if res.status==200: break
                      except OSError: time.sleep(1)
                  else: raise RuntimeError("gateway did not become ready")
                  def call(port,q):
                      req=urllib.request.Request(f"http://127.0.0.1:{port}/v1/chat/completions",data=json.dumps(q).encode(),headers={"Content-Type":"application/json","Authorization":"Bearer synthetic-not-a-secret"})
                      start=time.perf_counter()
                      try:
                          with urllib.request.urlopen(req,timeout=20) as res: return res.status,res.read().decode(),time.perf_counter()-start
                      except urllib.error.HTTPError as e: return e.code,e.read().decode(),time.perf_counter()-start
                  def parse_stream(s):
                      name=""; args=""; ident=""; finish=None
                      for line in s.splitlines():
                          if not line.startswith("data: ") or line=="data: [DONE]": continue
                          for c in json.loads(line[6:]).get("choices",[]):
                              finish=c.get("finish_reason") or finish
                              for t in c.get("delta",{}).get("tool_calls",[]):
                                  name+=t.get("function",{}).get("name") or ""
                                  args+=t.get("function",{}).get("arguments") or ""
                                  ident=t.get("id") or ident
                      return [ident,name,json.loads(args),finish]
                  for stream,content in [(False,"lookup alpha"),(True,"lookup alpha"),(False,"FAIL_FIXTURE")]:
                      q={"model":"fixture","messages":[{"role":"user","content":content}],"tools":[tool],"tool_choice":"auto","stream":stream}
                      a,raw,ta=call(18761,q)
                      b,via,tb=call(18762,q)
                      if a==200 and b==200:
                          if stream: match=parse_stream(raw)==parse_stream(via)==["call_fixture","lookup",{"key":"alpha"},"tool_calls"]
                          else:
                              x=json.loads(via); match=x["choices"][0]["message"]["tool_calls"]==message["tool_calls"] and x["choices"][0]["finish_reason"]=="tool_calls"
                      else: match=a==b==400
                      wire=observed[-1] if observed else {}
                      request_match=wire.get("messages")==q["messages"] and wire.get("tools")==q["tools"]
                      receipt["cases"].append({"stream":stream,"failure_fixture":content=="FAIL_FIXTURE","direct_status":a,"proxy_status":b,"direct_s":ta,"proxy_s":tb,"response_match":match,"request_match":request_match})
                  receipt["status"]="PASS" if all(x["response_match"] and x["request_match"] for x in receipt["cases"]) else "FAIL"
              finally:
                  proc.terminate()
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired: proc.kill(); proc.wait()
                  server.shutdown()
                  Path("litellm-wire-receipt.json").write_text(json.dumps(receipt,indent=2))
                  print("LITELLM_WIRE="+json.dumps(receipt))
              assert receipt["status"]=="PASS"
          PY
          "$RUNNER_TEMP/lite/bin/python" "$RUNNER_TEMP/wire.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: litellm-wire-r0
          path: |
            dependencies.txt
            litellm-wire-receipt.json
          retention-days: 7
