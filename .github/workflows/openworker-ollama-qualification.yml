name: OpenWorker Ollama Qualification

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task id from qualification/tasks
        required: true
        default: text-repair-v0

permissions:
  contents: read

concurrency:
  group: openworker-ollama-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openworker-qwen3-1-7b:
    name: OpenWorker projected + Qwen3 1.7B
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENWORKER_UPSTREAM_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-openworker-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      MODEL_SPELUNKER_MODEL: 'ollama:qwen3:1.7b'
      QUALIFICATION_TASK: ${{ inputs.task }}
      CANDIDATE_META: '/tmp/model-spelunker-openworker-candidate.json'
      RECEIPT: '/tmp/model-spelunker-openworker-receipt.json'
      DIAGNOSTICS: '/tmp/model-spelunker-openworker-diagnostics.json'
      SUBSTRATE_PROFILE_COMMIT: '93a108783bd60dc830fab1b67b78eaab8bfdae97'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker"

      - name: Install pinned Ollama ephemerally
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          test -x "$runtime/bin/ollama"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          installed="$("$runtime/bin/ollama" --version 2>&1)"
          echo "$installed"
          grep -F "$OLLAMA_VERSION" <<<"$installed"

      - name: Start isolated Ollama and hydrate pinned model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags", timeout=10) as response:
              data = json.load(response)
          wanted = os.environ['OLLAMA_MODEL_TAG']
          row = next((m for m in data.get('models', []) if m.get('name') == wanted), None)
          if row is None:
              raise SystemExit(f"pulled model not present in /api/tags: {wanted}")
          digest = str(row.get('digest') or '').removeprefix('sha256:')
          expected = os.environ['OLLAMA_MODEL_DIGEST_PREFIX']
          if not digest.startswith(expected):
              raise SystemExit(f"model digest drift: expected prefix {expected}, got {digest}")

          task_path = Path("qualification/tasks") / os.environ["QUALIFICATION_TASK"] / "task.json"
          if not task_path.is_file():
              raise SystemExit(f"unknown qualification task: {os.environ['QUALIFICATION_TASK']}")
          task = json.loads(task_path.read_text(encoding="utf-8"))
          projected_tools = task.get("projected_tools") or ["read_file", "write_file"]

          candidate = {
              'harness': {'name': 'openworker', 'version': os.environ['OPENWORKER_UPSTREAM_SHA']},
              'model': {
                  'provider': 'ollama',
                  'id': wanted,
                  'artifact_ref': f"ollama-sha256:{digest}",
              },
              'toolset': projected_tools,
              'configuration': {
                  'projection': projected_tools,
                  'parallel_tool_calls': False,
                  'max_tokens': 2048,
                  'reasoning_effort': 'none',
                  'max_iterations': 4,
                  'ollama_context_length': int(os.environ['OLLAMA_CONTEXT_LENGTH']),
              },
          }
          Path(os.environ['CANDIDATE_META']).write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'model': wanted, 'digest': row.get('digest'), 'size': row.get('size')}, sort_keys=True))
          PY

      - name: Run harness-neutral task through projected OpenWorker
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY; do
            unset "$key" || true
          done

          set +e
          python qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-ollama \
            --substrate-profile-commit "$SUBSTRATE_PROFILE_COMMIT" \
            --diagnostics "$DIAGNOSTICS" \
            "qualification/tasks/$QUALIFICATION_TASK" \
            "$CANDIDATE_META" \
            "$RECEIPT" \
            -- "$RUNNER_TEMP/openworker-venv/bin/python" \
              "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          qualification_rc=$?
          set -e

          test -f "$RECEIPT"
          QUALIFICATION_RC="$qualification_rc" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ['RECEIPT']).read_text())
          rc = int(os.environ['QUALIFICATION_RC'])
          assert receipt['candidate']['harness']['name'] == 'openworker'
          assert receipt['candidate']['model']['id'] == os.environ['OLLAMA_MODEL_TAG']
          assert rc == (0 if receipt['observation']['success'] else 1)
          print(json.dumps(receipt, sort_keys=True))
          if receipt['observation']['success']:
              print('QUALIFICATION_RESULT=PASS')
          else:
              print('QUALIFICATION_RESULT=FAIL (valid observation; workflow infrastructure remains healthy)')
          PY

          echo '=== bounded candidate diagnostics (credential-free rep) ==='
          cat "$DIAGNOSTICS"
          echo '=== bounded Ollama timing diagnostics ==='
          grep -E 'task [0-9]+ \| prompt processing|prompt eval|eval rate|total duration|load duration|prompt_eval|eval_count|processing task|new prompt' "$RUNNER_TEMP/ollama.log" | tail -n 120 || true

      - name: Upload immutable qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openworker-ollama-qualification-${{ inputs.task }}-${{ github.run_id }}
          path: ${{ env.RECEIPT }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Show bounded Ollama diagnostics on infrastructure failure
        if: failure()
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/ollama.log" || true
