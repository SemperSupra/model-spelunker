name: Unified Telemetry Usage Operational Interview

on:
  push:
    branches:
      - exp/telemetry-usage-operational-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-telemetry-usage-operational-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-and-operational:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[telemetry-usage-operational]')
    environment: hosted-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENWORKER_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      ACTOR_ID: 'openworker-deepseek-flash-ubuntu24-code-v2'
      CONTROL_EXPERIMENT: 'openworker-deepseek-code-boundary-bugfix-v2-control'
      OP_EXPERIMENT: 'openworker-deepseek-telemetry-usage-v0-operational'
      MODEL_SPELUNKER_MODEL: 'deepseek:deepseek-flash'
      MODEL_SPELUNKER_REASONING_EFFORT: 'none'
      MODEL_SPELUNKER_MAX_TOKENS: '2048'
      MODEL_SPELUNKER_MAX_ITERATIONS: '4'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate prospective task and verifier before inference
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/tasks/telemetry-usage-normalization-v0/verify.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          actor=json.loads(Path("qualification/actors/openworker-deepseek-flash-ubuntu24-code-v2.json").read_text())
          control=json.loads(Path("qualification/experiments/openworker-deepseek-code-boundary-bugfix-v2-control.json").read_text())
          operational=json.loads(Path("qualification/experiments/openworker-deepseek-telemetry-usage-v0-operational.json").read_text())
          task=json.loads(Path("qualification/tasks/telemetry-usage-normalization-v0/task.json").read_text())
          assert actor["schema_version"] == 2
          assert actor["toolset"] == ["list_files","read_file","write_file"]
          assert actor["configuration"]["max_tokens"] == 2048
          assert actor["configuration"]["max_iterations"] == 4
          assert control["experimental_role"] == "control"
          assert operational["experimental_role"] == "operational"
          assert operational["task"]["id"] == task["id"]
          assert len(task["ksa_requirements"]) == 5
          print("PASS frozen reference/operational contracts")
          PY

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_SHA"

      - name: Install OpenWorker
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/openworker-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --upgrade pip
          "$venv/bin/python" -m pip install --quiet -e "$RUNNER_TEMP/openworker"
          "$venv/bin/python" -c 'import coworker; import coworker.engine'
          echo "OPENWORKER_VENV=$venv" >> "$GITHUB_ENV"

      - name: Stage DeepSeek credential and zero-inference admission
        shell: bash
        env:
          SELECTED_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo 'QUALIFICATION_BOUNDARY=missing-DEEPSEEK_API_KEY'; exit 78; }
          umask 077
          keyfile="$RUNNER_TEMP/deepseek.key"
          printf '%s' "$SELECTED_API_KEY" > "$keyfile"
          KEYFILE="$keyfile" python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          key=Path(os.environ["KEYFILE"]).read_text()
          req=urllib.request.Request(
              "https://api.deepseek.com/user/balance",
              headers={"Accept":"application/json","Authorization":"Bearer "+key},
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          if data.get("is_available") is not True:
              raise SystemExit("DeepSeek authenticated but API balance is unavailable")
          print("DEEPSEEK_ADMISSION="+json.dumps({"authenticated":True,"available":True},sort_keys=True))
          PY
          echo "DEEPSEEK_KEY_FILE=$keyfile" >> "$GITHUB_ENV"

      - name: Run same-config boundary-bugfix reference control
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/telemetry-usage-interview"
          mkdir -p "$out"
          receipt="$out/reference-receipt.json"
          diagnostics="$out/reference-diagnostics.json"
          export DEEPSEEK_API_KEY="$(cat "$DEEPSEEK_KEY_FILE")"

          set +e
          python3 qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-hosted-api \
            --substrate-profile-commit "$GITHUB_SHA" \
            --experiment "qualification/experiments/$CONTROL_EXPERIMENT.json" \
            --diagnostics "$diagnostics" \
            --candidate-env-mode minimal \
            --projected-tools-source candidate \
            --pass-env DEEPSEEK_API_KEY \
            --pass-env MODEL_SPELUNKER_MODEL \
            --pass-env MODEL_SPELUNKER_REASONING_EFFORT \
            --pass-env MODEL_SPELUNKER_MAX_TOKENS \
            --pass-env MODEL_SPELUNKER_MAX_ITERATIONS \
            qualification/tasks/boundary-bugfix-v0 \
            "qualification/actors/$ACTOR_ID.json" \
            "$receipt" \
            -- "$OPENWORKER_VENV/bin/python" "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e

          test -s "$receipt"
          RC="$rc" RECEIPT="$receipt" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["RECEIPT"]))
          obs=r["observation"]
          print("CODE_REFERENCE_RESULT="+("PASS" if obs["success"] else "FAIL"))
          print("CODE_REFERENCE_TERMINATION="+str(obs.get("termination_class")))
          print("CODE_REFERENCE_WALL_SECONDS="+str(obs.get("wall_seconds")))
          assert int(os.environ["RC"]) == (0 if obs["success"] else 1)
          assert obs["success"] is True, "reference control must pass before operational work"
          assert obs["termination_class"] == "semantic-success"
          PY

      - name: Run prospective telemetry-normalizer operational work sample
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/telemetry-usage-interview"
          receipt="$out/operational-receipt.json"
          diagnostics="$out/operational-diagnostics.json"
          snapshot="$out/operational-output"
          export DEEPSEEK_API_KEY="$(cat "$DEEPSEEK_KEY_FILE")"

          set +e
          python3 qualification/run_task.py \
            --task-commit "$GITHUB_SHA" \
            --substrate-profile-id gha-linux-x64-openworker-hosted-api \
            --substrate-profile-commit "$GITHUB_SHA" \
            --experiment "qualification/experiments/$OP_EXPERIMENT.json" \
            --diagnostics "$diagnostics" \
            --snapshot-dir "$snapshot" \
            --candidate-env-mode minimal \
            --projected-tools-source candidate \
            --pass-env DEEPSEEK_API_KEY \
            --pass-env MODEL_SPELUNKER_MODEL \
            --pass-env MODEL_SPELUNKER_REASONING_EFFORT \
            --pass-env MODEL_SPELUNKER_MAX_TOKENS \
            --pass-env MODEL_SPELUNKER_MAX_ITERATIONS \
            qualification/tasks/telemetry-usage-normalization-v0 \
            "qualification/actors/$ACTOR_ID.json" \
            "$receipt" \
            -- "$OPENWORKER_VENV/bin/python" "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e
          unset DEEPSEEK_API_KEY

          test -s "$receipt"
          RC="$rc" RECEIPT="$receipt" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["RECEIPT"]))
          obs=r["observation"]
          assert int(os.environ["RC"]) == (0 if obs["success"] else 1)
          assert r["schema_version"] == 2
          assert r["task"]["id"] == "telemetry-usage-normalization-v0"
          assert r["experiment"]["experimental_role"] == "operational"
          print("TELEMETRY_USAGE_RESULT="+("PASS" if obs["success"] else "FAIL_VALID_OBSERVATION"))
          print("TELEMETRY_USAGE_TERMINATION="+str(obs.get("termination_class")))
          print("TELEMETRY_USAGE_FAILURE_CLASS="+str(obs.get("failure_class")))
          print("TELEMETRY_USAGE_MODEL_CALLS_STARTED="+str((obs.get("workload") or {}).get("model_calls_started")))
          print("TELEMETRY_USAGE_MODEL_ROUNDS="+str((obs.get("workload") or {}).get("model_rounds")))
          print("TELEMETRY_USAGE_TOOL_CALLS="+str(obs.get("tool_calls")))
          print("TELEMETRY_USAGE_WALL_SECONDS="+str(obs.get("wall_seconds")))
          PY

          # Valid semantic negative/censored evidence is still a completed experiment.
          exit 0

      - name: Upload immutable interview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-usage-operational-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/telemetry-usage-interview/**
          if-no-files-found: warn
          retention-days: 30

      - name: Remove staged provider credential
        if: always()
        shell: bash
        run: rm -f "${DEEPSEEK_KEY_FILE:-}" || true
