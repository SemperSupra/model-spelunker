name: SigLIP2 Source Freeze (temporary)

on:
  push:
    branches:
      - experiment/siglip2-source-freeze

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hydrate exact public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/siglip2-source"
          cd "$RUNNER_TEMP/siglip2-source"

          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Model-Spelunker/1.0 (+https://github.com/SemperSupra/model-spelunker)' \
            --output arxiv-2502.14786v1-source.tar \
            'https://arxiv.org/src/2502.14786v1'

          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Model-Spelunker/1.0 (+https://github.com/SemperSupra/model-spelunker)' \
            --output README_siglip2.md \
            'https://raw.githubusercontent.com/google-research/big_vision/0127fb6b337ee2a27bf4e54dea79cff176527356/big_vision/configs/proj/image_text/README_siglip2.md'

          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          root=pathlib.Path.cwd()
          rows={}
          for name in ("arxiv-2502.14786v1-source.tar","README_siglip2.md"):
              data=(root/name).read_bytes()
              rows[name]={"sha256":hashlib.sha256(data).hexdigest(),"size_bytes":len(data)}
          members=[]
          with tarfile.open(root/"arxiv-2502.14786v1-source.tar","r:*") as tf:
              for m in tf.getmembers():
                  if m.isfile():
                      members.append({"name":m.name,"size_bytes":m.size})
          manifest={
              "schema_version":1,
              "paper":{"arxiv_id":"2502.14786v1","source_url":"https://arxiv.org/src/2502.14786v1"},
              "checkpoint_readme":{
                  "repository":"google-research/big_vision",
                  "revision":"0127fb6b337ee2a27bf4e54dea79cff176527356",
                  "git_blob":"1c1af0a38209b7cbeb87c34c420c3c4455bdaa48",
                  "path":"big_vision/configs/proj/image_text/README_siglip2.md"
              },
              "files":rows,
              "arxiv_source_members":sorted(members,key=lambda x:x["name"]),
          }
          (root/"source_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("SOURCE_FREEZE="+json.dumps(manifest,sort_keys=True))
          PY

      - name: Upload frozen source packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siglip2-2502.14786v1-source-freeze
          path: |
            ${{ runner.temp }}/siglip2-source/arxiv-2502.14786v1-source.tar
            ${{ runner.temp }}/siglip2-source/README_siglip2.md
            ${{ runner.temp }}/siglip2-source/source_manifest.json
          retention-days: 30
