name: Faster Whisper Audio ASR Portability Rep

on:
  push:
    branches:
      - impl/audio-asr-portability-stage
    paths:
      - "experiments/mvp/run_audio_asr_portability.py"
      - "experiments/mvp/validate_audio_asr_portability.py"
      - ".github/workflows/audio-asr-portability.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: asr/faster-whisper/tiny
  EXPECTED_DIGEST: sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42
  FIXTURE_COMMIT: 6e3be77e1a105e59086e3e21ff5f609fd6fa89a5

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6622753fd5914be87fb1b6d987ceb7cae46c7ff5
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Derive exact ASR runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out fixture
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact ASR runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .asr-venv
          key: model-spelunker-faster-whisper-tiny-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-fw1.2.1-ct2-4.6.0

      - name: Build exact CPU ASR runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .asr-venv
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "faster-whisper==1.2.1" \
            "ctranslate2==4.6.0"

      - name: Record exact runtime identity
        shell: bash
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY' | tee out/runtime.json
          import importlib.metadata, json, os, platform
          import numpy
          print(json.dumps({
              "cache_hit": os.environ.get("CACHE_HIT") == "true",
              "python": platform.python_version(),
              "numpy": numpy.__version__,
              "faster_whisper": importlib.metadata.version("faster-whisper"),
              "ctranslate2": importlib.metadata.version("ctranslate2"),
          }, sort_keys=True))
          PY

      - name: Verify exact approved Foundry selector
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path("foundry/catalog/approved.json").read_text())
          entry = catalog["artifacts"][os.environ["LOGICAL_ID"]]
          assert entry["approved_digest"] == os.environ["EXPECTED_DIGEST"]
          assert entry["upstream_exact_revision"] == "d90ca5fe260221311c53c58e660288d3deb8d356"
          assert entry["license_spdx_id"] == "MIT"
          PY

      - name: Acquire exact pinned JFK fixture and record identity
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          commit = os.environ["FIXTURE_COMMIT"]
          url = f"https://raw.githubusercontent.com/openai/whisper/{commit}/tests/jfk.flac"
          req = urllib.request.Request(url, headers={"User-Agent": "SemperSupra-model-spelunker/1"})
          data = urllib.request.urlopen(req, timeout=120).read()
          path = Path("fixture/jfk.flac")
          path.write_bytes(data)
          meta = {
              "repository": "openai/whisper",
              "commit_sha": commit,
              "path": "tests/jfk.flac",
              "source_url": url,
              "size_bytes": len(data),
              "sha256": "sha256:" + hashlib.sha256(data).hexdigest(),
          }
          Path("fixture/jfk.json").write_text(json.dumps(meta, indent=2, sort_keys=True) + "\n")
          print(json.dumps(meta, sort_keys=True))
          PY

      - name: Authenticate bounded Foundry read
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Hydrate exact approved model and prove offline reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/model-spelunker-asr-approved
          START_NS="$(date +%s%N)"
          MODEL1="$(.asr-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-asr-approved \
            --oras "$(command -v oras)" | tail -n1)"
          END_NS="$(date +%s%N)"
          MODEL2="$(.asr-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-asr-approved \
            --oras /bin/false | tail -n1)"
          test "${MODEL1}" = "${MODEL2}"
          test -d "${MODEL2}"
          HYDRATE_SECONDS="$(python3 -c "print((${END_NS}-${START_NS})/1e9)")"
          echo "model_dir=${MODEL2}" >> "$GITHUB_OUTPUT"
          echo "hydrate_seconds=${HYDRATE_SECONDS}" >> "$GITHUB_OUTPUT"
          printf 'model_dir=%s\nhydrate_seconds=%s\n' "${MODEL2}" "${HYDRATE_SECONDS}" | tee out/hydration.txt

      - name: Run audio ASR portability rep
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
        run: |
          set -euo pipefail
          /usr/bin/time -v .asr-venv/bin/python experiments/mvp/run_audio_asr_portability.py \
            --model-dir "${MODEL_DIR}" \
            --fixture fixture/jfk.flac \
            --fixture-meta fixture/jfk.json \
            --output out/audio-asr-portability.json \
            2>&1 | tee out/run.log

      - name: Validate audio evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          .asr-venv/bin/python experiments/mvp/validate_audio_asr_portability.py \
            out/audio-asr-portability.json | tee out/validation.log

      - name: Summarize descriptive result
        shell: bash
        env:
          HYDRATE_SECONDS: ${{ steps.hydrate.outputs.hydrate_seconds }}
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b = json.loads(Path("out/audio-asr-portability.json").read_text())
          d, c = b['derived_metrics'], b['cost']
          baseline = next(r for r in b['observations']['variants'] if r['id'] == 'baseline')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write('## Faster-Whisper audio portability\n\n')
              f.write(f"- approved digest: `{b['artifact_provenance']['identity_digest']}`\n")
              f.write(f"- fixture sha256: `{b['observations']['fixture']['sha256']}`\n")
              f.write(f"- baseline transcript: `{baseline['result']['transcript']}`\n")
              f.write(f"- speech perturbation edit distances: `{d['speech_variant_normalized_word_edit_distances']}`\n")
              f.write(f"- no-speech control word counts: `{d['no_speech_control_transcript_word_counts']}`\n")
              f.write(f"- no-speech max probabilities: `{d['no_speech_control_max_no_speech_prob']}`\n")
              f.write(f"- exact baseline repeat transcript: `{d['baseline_repeat_exact_transcript']}`\n")
              f.write(f"- cold hydration: `{float(os.environ['HYDRATE_SECONDS']):.3f} s`\n")
              f.write(f"- model load: `{c['model_load_seconds']:.3f} s`, science: `{c['experiment_seconds']:.3f} s`, RSS: `{c['peak_rss_mib']:.1f} MiB`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-audio-asr-portability-${{ github.run_id }}
          path: |
            out/audio-asr-portability.json
            out/runtime.json
            out/hydration.txt
            out/validation.log
            out/run.log
            fixture/jfk.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
