name: R42 Cross-Platform HID Human IO Contract
on:
  pull_request:
    paths:
      - 'qualification/human_io/**'
      - 'qualification/test_human_io_contract.py'
      - '.github/workflows/r42-human-io-contract.yml'
permissions:
  contents: read
jobs:
  human-io-contract:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate all candidate channels and fail-closed intent projections
        run: |
          python -m py_compile qualification/human_io/hid_contract.py qualification/test_human_io_contract.py
          python -m qualification.test_human_io_contract
