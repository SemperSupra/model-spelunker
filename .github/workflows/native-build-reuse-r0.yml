name: Native CPU build reuse R0
on:
  pull_request:
    paths:
      - '.github/workflows/native-build-reuse-r0.yml'
      - 'qualification/serving_fanout_r0/native_build_reuse_r0/**'
permissions:
  contents: read
jobs:
  producer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.produce.outputs.manifest_sha256 }}
      tar_sha256: ${{ steps.produce.outputs.tar_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start measured job interval
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,time
          pathlib.Path(os.environ['RUNNER_TEMP'],'native-reuse-clock.json').write_text(json.dumps({
            'job_started_s':time.monotonic(),'job_started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PY
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Reject independent packaging and identity faults before building
        run: python3 -m unittest discover -s qualification/serving_fanout_r0/native_build_reuse_r0 -p 'test_*.py' -v
      - name: Produce one exact native CPU artifact
        id: produce
        run: |
          python3 qualification/serving_fanout_r0/native_build_reuse_r0/proof.py produce \
            --work "$RUNNER_TEMP/native-reuse-build" --out "$RUNNER_TEMP/native-reuse-producer" \
            --clock "$RUNNER_TEMP/native-reuse-clock.json"
      - name: Share immutable same-run payload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-reuse-r0-payload
          path: |
            ${{ runner.temp }}/native-reuse-producer/native-build-reuse.tar
            ${{ runner.temp }}/native-reuse-producer/manifest.json
            ${{ runner.temp }}/native-reuse-producer/producer.json
          if-no-files-found: error
          retention-days: 3
      - name: Record producer interval through payload upload
        if: always()
        env:
          NATIVE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          NATIVE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          clock=json.loads((root/'native-reuse-clock.json').read_text())
          out=root/'native-reuse-producer';out.mkdir(exist_ok=True)
          (out/'producer-final.json').write_text(json.dumps({
            'job_interval_through_payload_upload_s':time.monotonic()-clock['job_started_s'],
            'artifact_id':os.environ.get('NATIVE_ARTIFACT_ID'),
            'artifact_digest':os.environ.get('NATIVE_ARTIFACT_DIGEST'),
            'excludes':'runner provisioning, queue wait, and final evidence upload'},indent=2))
          PY
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-reuse-r0-producer-evidence
          path: |
            ${{ runner.temp }}/native-reuse-producer/*.json
            ${{ runner.temp }}/native-reuse-producer/*.txt
            ${{ runner.temp }}/native-reuse-producer/*.log
            ${{ runner.temp }}/native-reuse-producer/ldd/*.txt
          if-no-files-found: warn
          retention-days: 14
  consumer:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        consumer: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
      NATIVE_ARTIFACT_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.producer.outputs.manifest_sha256 }}
      EXPECTED_TAR_SHA256: ${{ needs.producer.outputs.tar_sha256 }}
      CONSUMER_ID: ${{ matrix.consumer }}
    steps:
      - name: Start measured job interval
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,time
          pathlib.Path(os.environ['RUNNER_TEMP'],'native-reuse-clock.json').write_text(json.dumps({
            'job_started_s':time.monotonic(),'job_started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PY
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Run independent consumer boundary controls
        run: python3 -m unittest discover -s qualification/serving_fanout_r0/native_build_reuse_r0 -p 'test_*.py' -v
      - name: Start artifact download interval
        run: |
          python3 - <<'PY'
          import json,os,pathlib,time
          path=pathlib.Path(os.environ['RUNNER_TEMP'],'native-reuse-clock.json')
          clock=json.loads(path.read_text());clock['download_started_s']=time.monotonic()
          path.write_text(json.dumps(clock))
          PY
      - name: Download the producer's exact immutable artifact ID
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-reuse-download
          digest-mismatch: error
      - name: Verify complete payload and external dependencies, then exercise native CLI
        run: |
          python3 qualification/serving_fanout_r0/native_build_reuse_r0/proof.py consume \
            --archive "$RUNNER_TEMP/native-reuse-download/native-build-reuse.tar" \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" --tar-sha256 "$EXPECTED_TAR_SHA256" \
            --consumer "$CONSUMER_ID" --out "$RUNNER_TEMP/native-reuse-consumer" \
            --clock "$RUNNER_TEMP/native-reuse-clock.json"
      - name: Preserve independent consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-reuse-r0-consumer-${{ matrix.consumer }}
          path: |
            ${{ runner.temp }}/native-reuse-consumer/consumer.json
            ${{ runner.temp }}/native-reuse-consumer/*.txt
            ${{ runner.temp }}/native-reuse-consumer/ldd/*.txt
          if-no-files-found: warn
          retention-days: 14
