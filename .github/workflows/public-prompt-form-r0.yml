name: Public synthetic native prompt wording pilot
on:
  pull_request:
    paths:
      - 'qualification/public_prompt_form_r0.py'
      - '.github/workflows/public-prompt-form-r0.yml'
permissions:
  contents: read
jobs:
  source-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python3 qualification/public_prompt_form_r0.py --self-test
  native-paired-screen:
    needs: source-control
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [original, numbered]
        target: [a.txt, b.txt]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Actual native public synthetic task
        env:
          PILOT_ARM: ${{ matrix.arm }}
          PILOT_TARGET: ${{ matrix.target }}
        run: python3 qualification/public_prompt_form_r0.py --arm "$PILOT_ARM" --target "$PILOT_TARGET" --out "public-prompt-pilot-$PILOT_ARM-$PILOT_TARGET.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-prompt-pilot-${{ matrix.arm }}-${{ matrix.target }}
          path: public-prompt-pilot-*.json
          if-no-files-found: ignore
          retention-days: 7
