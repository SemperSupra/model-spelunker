name: Compass Binding Public-Safe Contract Oracle

on:
  pull_request:
    paths:
      - 'qualification/compass_binding_r0/**'
      - '.github/workflows/compass-binding-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-go-oracle:
    name: offline-go-oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR source (no credentials retained)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public, offline, Go stdlib negative-oracle tests
        shell: bash
        run: |
          set -euo pipefail
          go version
          cd qualification/compass_binding_r0
          GOPROXY=off GOSUMDB=off go test -count=3 -v ./...
          GOPROXY=off GOSUMDB=off go vet ./...
