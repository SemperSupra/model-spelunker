name: Visual Concept MPS Divergence Localization

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  localize:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-26
            analyzer: clip
            config: config/visual-concept-worker-public-safe.json
          - runner: macos-26
            analyzer: siglip
            config: config/visual-concept-worker-public-safe-siglip.json
          - runner: xcode-27
            analyzer: clip
            config: config/visual-concept-worker-public-safe.json
          - runner: xcode-27
            analyzer: siglip
            config: config/visual-concept-worker-public-safe-siglip.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            torch==2.14.0 \
            transformers==5.17.0 \
            pillow==12.3.0 \
            requests==2.34.2 \
            sentencepiece==0.2.2 \
            protobuf==7.36.1
      - name: Localize CPU versus MPS divergence
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TRANSFORMERS_VERBOSITY: error
          TOKENIZERS_PARALLELISM: 'false'
          PYTORCH_ENABLE_MPS_FALLBACK: '0'
          CANDIDATE_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mps-localization"
          python scripts/visual_concept_mps_localization.py \
            --config "$CANDIDATE_CONFIG" \
            --runner-label "${{ matrix.runner }}" \
            --output "$RUNNER_TEMP/mps-localization/${{ matrix.analyzer }}.json"
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-concept-mps-localization-${{ matrix.runner }}-${{ matrix.analyzer }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mps-localization/${{ matrix.analyzer }}.json
          if-no-files-found: error
          retention-days: 14
