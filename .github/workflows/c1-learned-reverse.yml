name: C1 Learned Reverse Longitudinal Rep

on:
  push:
    branches:
      - impl/c1-tracr-calibration-stage
    paths:
      - "experiments/mvp/run_c1_learned_reverse.py"
      - "experiments/mvp/validate_c1_learned_reverse.py"
      - ".github/workflows/c1-learned-reverse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-spelunker-public-model-lane
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TRACR_REVISION: 9ce2b8c82b6ba10e62e86cf6f390e7536d4fd2cd

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact archived Tracr revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/tracr
          ref: 9ce2b8c82b6ba10e62e86cf6f390e7536d4fd2cd
          path: tracr-src
          persist-credentials: false

      - name: Verify exact Tracr source and license
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tracr-src rev-parse HEAD)" = "${TRACR_REVISION}"
          grep -q "Apache License" tracr-src/LICENSE

      - name: Derive exact C1 runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact C1 runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tracr-venv
          key: model-spelunker-tracr-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-jax0.4.38-haiku0.0.13-np1.26.4-${{ env.TRACR_REVISION }}

      - name: Build exact CPU C1 runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .tracr-venv
          .tracr-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "numpy==1.26.4" "jax==0.4.38" "jaxlib==0.4.38" \
            "dm-haiku==0.0.13" "chex==0.1.88" "einops==0.8.0" \
            "networkx==3.4.2" "typing_extensions==4.12.2"
          .tracr-venv/bin/python -m pip install --disable-pip-version-check --no-input --no-deps ./tracr-src

      - name: Rebind exact local Tracr source on cache hit or miss
        shell: bash
        run: |
          set -euo pipefail
          .tracr-venv/bin/python -m pip install --disable-pip-version-check --no-input --no-deps --force-reinstall ./tracr-src >/dev/null
          .tracr-venv/bin/python - <<'PY' | tee out/runtime.json
          import importlib.metadata, json, platform
          import jax, jaxlib, numpy, scipy
          out={
              'python':platform.python_version(),
              'numpy':numpy.__version__,
              'jax':jax.__version__,
              'jaxlib':jaxlib.__version__,
              'scipy':scipy.__version__,
              'dm_haiku':importlib.metadata.version('dm-haiku'),
              'chex':importlib.metadata.version('chex'),
              'tracr':importlib.metadata.version('tracr'),
          }
          print(json.dumps(out,sort_keys=True))
          assert out['numpy']=='1.26.4' and out['jax']=='0.4.38' and out['jaxlib']=='0.4.38'
          assert out['dm_haiku']=='0.0.13' and out['chex']=='0.1.88'
          PY

      - name: Run learned reverse longitudinal specimen
        shell: bash
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -euo pipefail
          /usr/bin/time -v .tracr-venv/bin/python experiments/mvp/run_c1_learned_reverse.py \
            --output out/c1-learned-reverse.json \
            2>&1 | tee out/run.log

      - name: Validate longitudinal evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .tracr-venv/bin/python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1" >/dev/null
          .tracr-venv/bin/python experiments/mvp/validate_c1_learned_reverse.py \
            out/c1-learned-reverse.json | tee out/validation.log

      - name: Summarize descriptive result
        shell: bash
        run: |
          set -euo pipefail
          .tracr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads(Path('out/c1-learned-reverse.json').read_text()); d=b['derived_metrics']; o=b['observations']; c=b['cost']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as f:
              f.write('## C1 learned reverse longitudinal specimen\n\n')
              f.write(f"- oracle identity matches Rep 33: `{d['oracle_identity_matches_rep33']}`\n")
              f.write(f"- exact deterministic training replay: `{d['learned_deterministic_replay_exact']}`\n")
              f.write(f"- final train/test/all sequence accuracy: `{d['final_train_sequence_accuracy']:.3f}` / `{d['final_test_sequence_accuracy']:.3f}` / `{d['final_all_sequence_accuracy']:.3f}`\n")
              f.write(f"- test accuracy trajectory: `{d['checkpoint_test_sequence_accuracy']}`\n")
              f.write(f"- opposite-route probability trajectory: `{d['checkpoint_best_opposite_route_probability']}`\n")
              f.write(f"- best CKA-to-oracle trajectory: `{d['checkpoint_best_cka_to_oracle']}`\n")
              f.write(f"- route probability vs test accuracy correlation: `{d['route_probability_vs_test_accuracy_pearson']:.3f}`\n")
              f.write(f"- compiled-oracle block ablations: `{d['oracle_attention_ablation_sequence_accuracy']}`\n")
              f.write(f"- learned-final block ablations: `{d['learned_final_ablation_test_sequence_accuracy']}`\n")
              f.write(f"- training `{c['training_seconds']:.3f}s`; replay `{c['deterministic_replay_seconds']:.3f}s`; RSS `{c['peak_rss_mib']:.1f} MiB`\n")
              f.write('- One seed only. Performance is descriptive, not an acceptance gate.\n')
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-c1-learned-reverse-${{ github.run_id }}
          path: |
            out/c1-learned-reverse.json
            out/runtime.json
            out/validation.log
            out/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
