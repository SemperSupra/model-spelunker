name: RDT&E Retrospective Trajectory Bench

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deterministic-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bench
        run: >-
          python -m py_compile
          qualification/rdte/retrospective/reduce_trace.py
          qualification/rdte/retrospective/run_batch.py
          qualification/rdte/retrospective/test_bench.py
          qualification/rdte/retrospective/verify_github_sources.py
          qualification/rdte/retrospective/test_source_verifier.py
          qualification/rdte/retrospective/project_codex_actions_log.py
          qualification/rdte/retrospective/test_codex_actions_projection.py
          qualification/rdte/retrospective/project_openworker_stdout.py
          qualification/rdte/retrospective/test_openworker_projection.py
          qualification/rdte/retrospective/analyze_process_variants.py
          qualification/rdte/retrospective/test_process_variants.py
      - name: Run deterministic tests
        run: >-
          python -m unittest -v
          qualification.rdte.retrospective.test_bench
          qualification.rdte.retrospective.test_source_verifier
          qualification.rdte.retrospective.test_codex_actions_projection
          qualification.rdte.retrospective.test_openworker_projection
          qualification.rdte.retrospective.test_process_variants
      - name: Verify source facts available from this execution venue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rdte/source-verification
          manifests=(
            jules-q4o-same-session-noop.json
            jules-q4o-feedback-unknown.json
            jules-provider-reject.json
            codex-false-completion.json
            goose-censored-historical.json
          )
          for manifest in "${manifests[@]}"
          do
            python qualification/rdte/retrospective/verify_github_sources.py \
              "qualification/rdte/retrospective/manifests/$manifest" \
              --output ".rdte/source-verification/$manifest"
          done
      - name: Project retained Codex native traces from historical Actions cohort
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rdte/native-traces
          jobs=(
            "105906244416:qwen17-effort-unset"
            "105906244528:qwen17-effort-none"
            "105906244550:qwen06-effort-none"
          )
          for item in "${jobs[@]}"
          do
            job_id="${item%%:*}"
            label="${item#*:}"
            raw_log="$RUNNER_TEMP/codex-job-$job_id.log"
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SemperSupra/model-spelunker/actions/jobs/$job_id/logs" \
              -o "$raw_log"
            python qualification/rdte/retrospective/project_codex_actions_log.py \
              "$raw_log" \
              --source-ref "github-actions:SemperSupra/model-spelunker/run/35446508113/job/$job_id" \
              --output ".rdte/native-traces/$label.json"
            rm -f "$raw_log"
          done
      - name: Run initial five-rep batch
        run: >-
          python qualification/rdte/retrospective/run_batch.py
          --manifests qualification/rdte/retrospective/manifests
          --out-dir .rdte/retrospective
      - name: Upload disposable RDT&E result bundle
        uses: actions/upload-artifact@v4
        with:
          name: retrospective-trajectory-rdte
          path: |
            .rdte/retrospective
            .rdte/source-verification
            .rdte/native-traces
          if-no-files-found: error
          retention-days: 14
