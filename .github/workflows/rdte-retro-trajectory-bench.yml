name: RDT&E Retrospective Trajectory Bench

on:
  pull_request:
    paths:
      - 'qualification/rdte/retrospective/**'
      - '.github/workflows/rdte-retro-trajectory-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bench
        run: >-
          python -m py_compile
          qualification/rdte/retrospective/reduce_trace.py
          qualification/rdte/retrospective/run_batch.py
          qualification/rdte/retrospective/test_bench.py
      - name: Run deterministic tests
        run: python -m unittest -v qualification.rdte.retrospective.test_bench
      - name: Run initial five-rep batch
        run: >-
          python qualification/rdte/retrospective/run_batch.py
          --manifests qualification/rdte/retrospective/manifests
          --out-dir .rdte/retrospective
      - name: Upload disposable RDT&E result bundle
        uses: actions/upload-artifact@v4
        with:
          name: retrospective-trajectory-rdte
          path: .rdte/retrospective
          if-no-files-found: error
          retention-days: 14
