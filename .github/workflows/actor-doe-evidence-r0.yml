name: Actor DOE evidence purpose gate R0
on:
  pull_request:
    paths:
      - 'qualification/actor_doe_evidence_r0/**'
      - '.github/workflows/actor-doe-evidence-r0.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: python qualification/actor_doe_evidence_r0/prove.py evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: actor-doe-evidence-r0
          path: evidence
          retention-days: 7
