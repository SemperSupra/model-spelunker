name: OpenWorker FIFO4 Validator Steering

on:
  pull_request:
    branches:
      - exp/persona-openworker-fifo4-draft-repair
    paths:
      - "qualifications/persona-openworker-001/**"
      - "fixtures/rtl-fifo4-v1/**"
      - ".github/workflows/openworker-fifo4-validator-steering.yml"

permissions:
  contents: read

jobs:
  fifo4-validator-steering:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'exp/openworker-validator-steering-fifo4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Static preflight
        shell: bash
        run: |
          cd qualifications/persona-openworker-001
          python3 -m py_compile run_reproduction.py
          python3 -m json.tool qualification.json >/dev/null
          bash -n run.sh
          test -f failed-specialist-draft.v
          test -f ../../fixtures/rtl-fifo4-v1/spec.md
          test -f ../../fixtures/rtl-fifo4-v1/tb.sv

      - name: Run validator-steering qualification
        id: qualification
        shell: bash
        env:
          RESULT_DIR: ${{ runner.temp }}/openworker-fifo4-validator-steering
        run: |
          mkdir -p "$RESULT_DIR"
          cd qualifications/persona-openworker-001
          set +e
          SEALED_RESULT_DIR="$RESULT_DIR" bash run.sh
          rc=$?
          set -e
          echo "task_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "${RUNNER_TEMP}/persona-openworker-ollama/ollama.log" ]; then
            cp "${RUNNER_TEMP}/persona-openworker-ollama/ollama.log" "$RESULT_DIR/ollama.log"
          fi
          exit 0

      - name: Upload validator-steering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openworker-fifo4-validator-steering
          path: ${{ runner.temp }}/openworker-fifo4-validator-steering
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Preserve execution verdict
        if: always()
        shell: bash
        env:
          TASK_RC: ${{ steps.qualification.outputs.task_rc }}
        run: |
          test -n "$TASK_RC" || exit 1
          exit "$TASK_RC"
