name: RDT&E OpenWorker Prospective Trace

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  owt-p1:
    name: OWT-P1 prospective native-event projection
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENWORKER_UPSTREAM_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      HARNESS_ARTIFACT_REF: 'ghcr.io/sempersupra/model-spelunker-harness-openworker@sha256:e8c9da992ee4c1ce3934e6e9874c3129c4b00cec38428ed9cf1fe47190a9fe83'
      HARNESS_ADMISSION_REF: 'github:SemperSupra/model-spelunker@9ac78865c2b1f20e18ca39087d8b267b98993769:qualification/harness-artifacts/openworker-5bc10d928e0b-linux-x64.admission.json'
      OLLAMA_VERSION: '0.34.1'
      OLLAMA_ARCHIVE_SHA256: 'f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034'
      OLLAMA_MODEL_TAG: 'qwen3:1.7b'
      OLLAMA_MODEL_DIGEST_PREFIX: '8f68893c685c'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: '/tmp/model-spelunker-openworker-rdte-models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '32768'
      MODEL_SPELUNKER_MODEL: 'ollama:qwen3:1.7b'
      MODEL_SPELUNKER_REASONING_EFFORT: 'none'
      MODEL_SPELUNKER_MAX_ITERATIONS: '4'
      MODEL_SPELUNKER_PROJECTED_TOOLS: 'read_file,write_file'
      MODEL_SPELUNKER_WRITE_TARGET: 'value.txt'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout RDT&E branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate admitted OpenWorker artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$HARNESS_ARTIFACT_REF" >/dev/null
          extract="$RUNNER_TEMP/openworker-artifact"
          mkdir -p "$extract"
          cid="$(docker create "$HARNESS_ARTIFACT_REF" /artifact/noop)"
          docker cp "$cid:/artifact/." "$extract/"
          docker rm "$cid" >/dev/null
          test -s "$extract/build-receipt.json"

          ARTIFACT_ROOT="$extract" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["ARTIFACT_ROOT"])
          receipt=json.loads((root/"build-receipt.json").read_text())
          assert receipt["harness"]["name"]=="openworker"
          assert receipt["source"]["revision"]==os.environ["OPENWORKER_UPSTREAM_SHA"]
          for row in receipt["payload"]["files"]:
              path=root/row["path"]
              data=path.read_bytes()
              assert len(data)==row["bytes"]
              assert hashlib.sha256(data).hexdigest()==row["sha256"]
          PY

          venv="$RUNNER_TEMP/openworker-rdte-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --no-index --no-deps "$extract/wheelhouse"/*.whl
          "$venv/bin/python" -c 'import coworker; import coworker.engine'
          echo "OPENWORKER_VENV=$venv" >> "$GITHUB_ENV"

      - name: Install pinned Ollama and hydrate model
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3             "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"             --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime" "$OLLAMA_MODELS"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          nohup env             OLLAMA_HOST="$OLLAMA_HOST"             OLLAMA_MODELS="$OLLAMA_MODELS"             OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL"             OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS"             OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH"             "$runtime/bin/ollama" serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "http://$OLLAMA_HOST/api/tags" >/dev/null
          OLLAMA_HOST="$OLLAMA_HOST" "$runtime/bin/ollama" pull "$OLLAMA_MODEL_TAG"

          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags", timeout=10) as response:
              data=json.load(response)
          row=next(m for m in data["models"] if m.get("name")==os.environ["OLLAMA_MODEL_TAG"])
          digest=str(row["digest"]).removeprefix("sha256:")
          if not digest.startswith(os.environ["OLLAMA_MODEL_DIGEST_PREFIX"]):
              raise SystemExit(f"model digest drift: {digest}")
          PY

      - name: Run bounded prospective OpenWorker rep and project native events
        shell: bash
        run: |
          set -euo pipefail
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY OLLAMA_API_KEY DEEPSEEK_API_KEY GROQ_API_KEY NVIDIA_API_KEY OPENROUTER_API_KEY; do
            unset "$key" || true
          done

          work="$RUNNER_TEMP/owt-p1-work"
          out="$GITHUB_WORKSPACE/.rdte/owt-p1"
          raw="$RUNNER_TEMP/owt-p1-stdout.log"
          stderr_file="$RUNNER_TEMP/owt-p1-stderr.log"
          time_file="$RUNNER_TEMP/owt-p1-time.env"
          mkdir -p "$work" "$out"
          printf 'BROKEN\n' > "$work/value.txt"
          cat > "$work/instruction.txt" <<'EOF'
          In the current workspace, use the available file tools to change value.txt so its entire contents are exactly READY followed by a newline. Perform the edit; do not merely describe it.
          EOF

          set +e
          (
            cd "$work"
            /usr/bin/time               -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kbytes=%M\ncpu_percent=%P\nmajor_page_faults=%F\nminor_page_faults=%R\nvoluntary_context_switches=%w\ninvoluntary_context_switches=%c'               -o "$time_file"               timeout --signal=TERM --kill-after=5s 120s               "$OPENWORKER_VENV/bin/python"               "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"               < instruction.txt > "$raw" 2> "$stderr_file"
          )
          candidate_rc=$?
          set -e

          python "$GITHUB_WORKSPACE/qualification/rdte/retrospective/project_openworker_stdout.py"             "$raw"             --source-ref "ephemeral:owt-p1/run-${GITHUB_RUN_ID}/raw-stdout"             --output "$out/trace.json" >/dev/null

          CANDIDATE_RC="$candidate_rc"           RAW_STDOUT="$raw"           STDERR_FILE="$stderr_file"           TIME_FILE="$time_file"           WORKDIR="$work"           TRACE="$out/trace.json"           OUTPUT="$out/run-summary.json"           python3 - <<'PY'
          import json, os
          from pathlib import Path

          metrics={}
          for line in Path(os.environ["TIME_FILE"]).read_text(encoding="utf-8", errors="replace").splitlines():
              if "=" not in line:
                  continue
              key,value=line.split("=",1)
              if key=="cpu_percent":
                  metrics[key]=value
              else:
                  try:
                      metrics[key]=float(value) if "." in value else int(value)
                  except ValueError:
                      metrics[key]=None

          trace=json.loads(Path(os.environ["TRACE"]).read_text())
          final=Path(os.environ["WORKDIR"],"value.txt").read_text(encoding="utf-8",errors="replace")
          summary={
              "record_type":"openworker-prospective-rdte-run",
              "schema_version":1,
              "treatment":{
                  "harness":"openworker",
                  "harness_revision":os.environ["OPENWORKER_UPSTREAM_SHA"],
                  "harness_artifact_ref":os.environ["HARNESS_ARTIFACT_REF"],
                  "harness_admission_ref":os.environ["HARNESS_ADMISSION_REF"],
                  "model_provider":"ollama",
                  "model":os.environ["OLLAMA_MODEL_TAG"],
                  "model_digest_prefix":os.environ["OLLAMA_MODEL_DIGEST_PREFIX"],
                  "runtime":"github-actions/ubuntu-24.04",
              },
              "execution":{
                  "candidate_exit_code":int(os.environ["CANDIDATE_RC"]),
                  "state_changed":final!="BROKEN\n",
                  "verifier_pass":final=="READY\n",
                  "raw_stdout_bytes":Path(os.environ["RAW_STDOUT"]).stat().st_size,
                  "stderr_bytes":Path(os.environ["STDERR_FILE"]).stat().st_size,
                  "raw_stdout_retained":False,
                  "stderr_retained":False,
              },
              "resources":metrics,
              "trace_summary":trace["summary"],
              "qualification_state_changed":False,
          }
          Path(os.environ["OUTPUT"]).write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "candidate_exit_code":summary["execution"]["candidate_exit_code"],
              "state_changed":summary["execution"]["state_changed"],
              "verifier_pass":summary["execution"]["verifier_pass"],
              "raw_stdout_bytes":summary["execution"]["raw_stdout_bytes"],
              "event_count":summary["trace_summary"]["event_count"],
              "model_call_started_count":summary["trace_summary"]["model_call_started_count"],
              "provider_observation_count":summary["trace_summary"]["provider_observation_count"],
              "tool_name_counts":summary["trace_summary"]["tool_name_counts"],
              "max_rss_kbytes":summary["resources"].get("max_rss_kbytes"),
              "wall_seconds":summary["resources"].get("wall_seconds"),
          },sort_keys=True))
          PY

          rm -f "$raw" "$stderr_file" "$time_file" "$work/instruction.txt"

          python3 - <<'PY'
          import json
          from pathlib import Path
          trace=json.loads(Path(".rdte/owt-p1/trace.json").read_text())
          summary=json.loads(Path(".rdte/owt-p1/run-summary.json").read_text())
          assert trace["summary"]["sensitive_content_retained"] is False
          assert trace["summary"]["hidden_reasoning_inferred"] is False
          assert trace["summary"]["event_count"] > 0
          assert trace["summary"]["model_call_started_count"] > 0
          assert summary["execution"]["raw_stdout_retained"] is False
          assert summary["execution"]["stderr_retained"] is False
          assert summary["qualification_state_changed"] is False
          PY

      - name: Upload privacy-safe RDT&E projection
        uses: actions/upload-artifact@v4
        with:
          name: owt-p1-prospective-trace
          path: .rdte/owt-p1
          if-no-files-found: error
          retention-days: 14
