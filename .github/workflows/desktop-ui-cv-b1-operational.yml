name: Desktop UI CV B1 Operational Interview

on:
  push:
    branches:
      - exp/desktop-ui-cv-b1-operational
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-cv-b1-operational-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-and-operational:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[desktop-ui-cv-b1]')
    environment: hosted-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENWORKER_SHA: '5bc10d928e0b64aae74313349a3b17bd19643ae2'
      ACTOR_ID: 'openworker-deepseek-flash-ubuntu24-repo-edit-v1'
      CONTROL_EXPERIMENT: 'openworker-deepseek-repo-edit-bounded-replace-control'
      OP_EXPERIMENT: 'openworker-deepseek-desktop-ui-cv-b1-operational'
      TASK_ID: 'desktop-ui-cv-dataset-integrity-v0'
      MODEL_SPELUNKER_MODEL: 'deepseek:deepseek-flash'
      MODEL_SPELUNKER_REASONING_EFFORT: 'none'
      MODEL_SPELUNKER_MAX_TOKENS: '4096'
      MODEL_SPELUNKER_MAX_ITERATIONS: '12'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install verifier dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet             numpy==2.2.6 opencv-python-headless==4.12.0.88 pytest==8.4.2

      - name: Hydrate exact product baseline and calibrate verifier
        run: |
          set -euo pipefail
          task="qualification/tasks/$TASK_ID"
          python3 "$task/prepare_fixture.py"
          python3 "$task/verify.py" --self-test
          python3 "$task/verify.py" --calibrate-baseline "$task/fixture"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("qualification/tasks/desktop-ui-cv-dataset-integrity-v0/fixture/source_manifest.json").read_text())
          assert manifest["source_commit"] == "6c35202f84584e68957d053cb888b50a5e3353b6"
          task=json.loads(Path("qualification/tasks/desktop-ui-cv-dataset-integrity-v0/task.json").read_text())
          actor=json.loads(Path("qualification/actors/openworker-deepseek-flash-ubuntu24-repo-edit-v1.json").read_text())
          exp=json.loads(Path("qualification/experiments/openworker-deepseek-desktop-ui-cv-b1-operational.json").read_text())
          assert task["allowed_write_paths"] == [
              "src/desktop_ui_cv/dataset/generator.py",
              "tests/test_dataset_integrity.py",
          ]
          assert actor["toolset"] == [
              "list_files","search_files","read_file_lines","replace_in_file","write_file"
          ]
          assert actor["configuration"]["max_tokens"] == 4096
          assert actor["configuration"]["max_iterations"] == 12
          assert exp["experimental_role"] == "operational"
          print("PASS frozen desktop-ui-cv B1 contracts")
          PY

      - name: Clone and install pinned OpenWorker
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$RUNNER_TEMP/openworker"
          git -C "$RUNNER_TEMP/openworker" checkout --quiet --detach "$OPENWORKER_SHA"
          test "$(git -C "$RUNNER_TEMP/openworker" rev-parse HEAD)" = "$OPENWORKER_SHA"
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          "$RUNNER_TEMP/openworker-venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/openworker-venv/bin/python" -m pip install --quiet -e "$RUNNER_TEMP/openworker"
          "$RUNNER_TEMP/openworker-venv/bin/python" - <<'PY'
          import aisuite as ai
          names=[getattr(f,"__name__","") for f in ai.toolkits.files(root=".",allow_write=True)]
          for required in ("search_files","read_file_lines","replace_in_file","write_file"):
              assert required in names, (required,names)
          print("PASS pinned bounded repository-edit tool surface")
          PY
          echo "OPENWORKER_VENV=$RUNNER_TEMP/openworker-venv" >> "$GITHUB_ENV"

      - name: Stage DeepSeek credential and admission
        env:
          SELECTED_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SELECTED_API_KEY:-}" || { echo 'QUALIFICATION_BOUNDARY=missing-DEEPSEEK_API_KEY'; exit 78; }
          umask 077
          keyfile="$RUNNER_TEMP/deepseek.key"
          printf '%s' "$SELECTED_API_KEY" > "$keyfile"
          KEYFILE="$keyfile" python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          key=Path(os.environ["KEYFILE"]).read_text()
          req=urllib.request.Request("https://api.deepseek.com/user/balance",headers={"Accept":"application/json","Authorization":"Bearer "+key})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          assert data.get("is_available") is True
          PY
          echo "DEEPSEEK_KEY_FILE=$keyfile" >> "$GITHUB_ENV"

      - name: Run same-config bounded-edit reference
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-ui-cv-b1"
          mkdir -p "$out"
          export DEEPSEEK_API_KEY="$(cat "$DEEPSEEK_KEY_FILE")"
          set +e
          python3 qualification/run_task.py             --task-commit "$GITHUB_SHA"             --substrate-profile-id gha-linux-x64-openworker-hosted-api             --substrate-profile-commit "$GITHUB_SHA"             --experiment "qualification/experiments/$CONTROL_EXPERIMENT.json"             --diagnostics "$out/reference-diagnostics.json"             --candidate-env-mode minimal             --projected-tools-source candidate             --pass-env DEEPSEEK_API_KEY             --pass-env MODEL_SPELUNKER_MODEL             --pass-env MODEL_SPELUNKER_REASONING_EFFORT             --pass-env MODEL_SPELUNKER_MAX_TOKENS             --pass-env MODEL_SPELUNKER_MAX_ITERATIONS             qualification/tasks/bounded-multi-file-replace-v0             "qualification/actors/$ACTOR_ID.json"             "$out/reference-receipt.json"             -- "$OPENWORKER_VENV/bin/python" "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e
          RC="$rc" RECEIPT="$out/reference-receipt.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["RECEIPT"]))
          o=r["observation"]
          print("B1_REFERENCE_RESULT="+("PASS" if o["success"] else "FAIL"))
          print("B1_REFERENCE_TERMINATION="+str(o.get("termination_class")))
          assert int(os.environ["RC"]) == (0 if o["success"] else 1)
          assert o["success"] is True, "same-config reference must pass"
          PY

      - name: Run real desktop-ui-cv B1 operational work sample
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-ui-cv-b1"
          export DEEPSEEK_API_KEY="$(cat "$DEEPSEEK_KEY_FILE")"
          set +e
          python3 qualification/run_task.py             --task-commit "$GITHUB_SHA"             --substrate-profile-id gha-linux-x64-openworker-hosted-api             --substrate-profile-commit "$GITHUB_SHA"             --experiment "qualification/experiments/$OP_EXPERIMENT.json"             --diagnostics "$out/operational-diagnostics.json"             --snapshot-dir "$out/operational-output"             --candidate-env-mode minimal             --projected-tools-source candidate             --pass-env DEEPSEEK_API_KEY             --pass-env MODEL_SPELUNKER_MODEL             --pass-env MODEL_SPELUNKER_REASONING_EFFORT             --pass-env MODEL_SPELUNKER_MAX_TOKENS             --pass-env MODEL_SPELUNKER_MAX_ITERATIONS             "qualification/tasks/$TASK_ID"             "qualification/actors/$ACTOR_ID.json"             "$out/operational-receipt.json"             -- "$OPENWORKER_VENV/bin/python" "$GITHUB_WORKSPACE/qualification/adapters/openworker_projected.py"
          rc=$?
          set -e
          unset DEEPSEEK_API_KEY

          test -s "$out/operational-receipt.json"
          RC="$rc" RECEIPT="$out/operational-receipt.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["RECEIPT"]))
          o=r["observation"]
          assert int(os.environ["RC"]) == (0 if o["success"] else 1)
          print("B1_OPERATIONAL_RESULT="+("PASS" if o["success"] else "FAIL_VALID_OBSERVATION"))
          print("B1_OPERATIONAL_TERMINATION="+str(o.get("termination_class")))
          print("B1_OPERATIONAL_FAILURE_CLASS="+str(o.get("failure_class")))
          print("B1_OPERATIONAL_MODEL_CALLS_STARTED="+str((o.get("workload") or {}).get("model_calls_started")))
          print("B1_OPERATIONAL_MODEL_ROUNDS="+str((o.get("workload") or {}).get("model_rounds")))
          print("B1_OPERATIONAL_TOOL_CALLS="+str(o.get("tool_calls")))
          print("B1_OPERATIONAL_WALL_SECONDS="+str(o.get("wall_seconds")))
          PY
          exit 0

      - name: Upload immutable B1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-ui-cv-b1-operational-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/desktop-ui-cv-b1/**
          if-no-files-found: warn
          retention-days: 30

      - name: Remove credential
        if: always()
        run: rm -f "${DEEPSEEK_KEY_FILE:-}" || true
