name: experiment-0002-r19-demonym-context

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.ci/run-experiment-0002-r19'

permissions:
  contents: read

jobs:
  r19-demonym-context:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-shot arm
        id: arm
        run: |
          if [ -f .ci/run-experiment-0002-r19 ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m py_compile tools/jspace_interventions.py
          python -m py_compile tools/run_qwen35_4b_context_invariance.py
          python -m py_compile tools/run_qwen35_4b_demonym_context_invariance.py

      - name: Install CPU PyTorch
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install causal dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install -r requirements-experiment-0001.txt
          python -m pip install 'git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e'
          rm -rf ~/.cache/pip

      - name: Run R19 held-out demonym context
        if: steps.arm.outputs.armed == 'true'
        run: python tools/run_qwen35_4b_demonym_context_invariance.py

      - name: Summarize R19
        if: steps.arm.outputs.armed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/experiment-0002-qwen35-4b-demonym-context-invariance/summary.json')
          s = json.loads(p.read_text())
          print('experiment', s['experiment'])
          print('baseline_valid_cases', s['baseline_valid_cases'])
          print('causal_executed', s['causal_executed'])
          if s['causal_executed']:
              print('jspace_target_specificity_hits', s['jspace_target_specificity_hits'])
              print('jspace_strong_switches', s['jspace_strong_switches'])
              print('casewise_jspace_gain_exceeds_max_random', s['casewise_jspace_gain_exceeds_max_random'])
              print('jspace_mean_target_gain', s['jspace_mean_target_gain'])
              print('max_seed_mean_random_target_gain', s['max_seed_mean_random_target_gain'])
          print('context_invariance_pass', s['context_invariance_pass'])
          PY

      - name: Upload R19 evidence
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-r19-demonym-context-${{ github.run_id }}
          path: artifacts/experiment-0002-qwen35-4b-demonym-context-invariance
          if-no-files-found: error
          retention-days: 14
