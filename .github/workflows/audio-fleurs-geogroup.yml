name: Faster Whisper FLEURS Seven-Geogroup Rep

on:
  push:
    branches:
      - impl/audio-asr-portability-stage
    paths:
      - "experiments/mvp/acquire_fleurs_multilingual.py"
      - "experiments/mvp/run_audio_fleurs_geogroup.py"
      - "experiments/mvp/validate_audio_fleurs_geogroup.py"
      - ".github/workflows/audio-fleurs-geogroup.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  LOGICAL_ID: asr/faster-whisper/tiny
  EXPECTED_DIGEST: sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42

jobs:
  rep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Model Spelunker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact approved Foundry revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/model-artifact-foundry
          ref: 6622753fd5914be87fb1b6d987ceb7cae46c7ff5
          path: foundry
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Derive exact ASR runtime cache key
        id: runtime-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out fixture/fleurs
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          print(f"python_tag={sys.implementation.cache_tag}")
          PY

      - name: Restore exact ASR runtime
        id: runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .asr-venv
          key: model-spelunker-faster-whisper-tiny-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.python_tag }}-fw1.2.1-ct2-4.6.0

      - name: Build exact CPU ASR runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .asr-venv
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input \
            "faster-whisper==1.2.1" \
            "ctranslate2==4.6.0"

      - name: Record exact runtime identity
        shell: bash
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY' | tee out/runtime.json
          import importlib.metadata, json, os, platform
          import numpy
          print(json.dumps({
              "cache_hit": os.environ.get("CACHE_HIT") == "true",
              "python": platform.python_version(),
              "numpy": numpy.__version__,
              "faster_whisper": importlib.metadata.version("faster-whisper"),
              "ctranslate2": importlib.metadata.version("ctranslate2"),
          }, sort_keys=True))
          PY

      - name: Acquire bounded FLEURS seven-geogroup panel
        shell: bash
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          set -euo pipefail
          .asr-venv/bin/python experiments/mvp/acquire_fleurs_multilingual.py \
            --output-dir fixture/fleurs \
            --manifest fixture/fleurs-manifest.json | tee out/fleurs-acquisition.log

      - name: Verify exact approved Foundry selector
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path("foundry/catalog/approved.json").read_text())
          entry = catalog["artifacts"][os.environ["LOGICAL_ID"]]
          assert entry["approved_digest"] == os.environ["EXPECTED_DIGEST"]
          assert entry["upstream_exact_revision"] == "d90ca5fe260221311c53c58e660288d3deb8d356"
          assert entry["license_spdx_id"] == "MIT"
          PY

      - name: Authenticate bounded Foundry read
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Hydrate approved model and prove offline reuse
        id: hydrate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/model-spelunker-fleurs-asr
          START_NS="$(date +%s%N)"
          MODEL1="$(.asr-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-fleurs-asr \
            --oras "$(command -v oras)" | tail -n1)"
          END_NS="$(date +%s%N)"
          MODEL2="$(.asr-venv/bin/python foundry/tools/hydrate.py \
            --catalog foundry/catalog/approved.json \
            --id "${LOGICAL_ID}" \
            --cache-root /tmp/model-spelunker-fleurs-asr \
            --oras /bin/false | tail -n1)"
          test "${MODEL1}" = "${MODEL2}"
          test -d "${MODEL2}"
          echo "model_dir=${MODEL2}" >> "$GITHUB_OUTPUT"
          echo "hydrate_seconds=$(python3 -c "print((${END_NS}-${START_NS})/1e9)")" >> "$GITHUB_OUTPUT"

      - name: Run FLEURS geogroup falsifier
        shell: bash
        env:
          MODEL_DIR: ${{ steps.hydrate.outputs.model_dir }}
        run: |
          set -euo pipefail
          /usr/bin/time -v .asr-venv/bin/python experiments/mvp/run_audio_fleurs_geogroup.py \
            --model-dir "${MODEL_DIR}" \
            --corpus-manifest fixture/fleurs-manifest.json \
            --audio-dir fixture/fleurs \
            --output out/audio-fleurs-geogroup.json \
            2>&1 | tee out/run.log

      - name: Validate evidence independently
        shell: bash
        run: |
          set -euo pipefail
          .asr-venv/bin/python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          .asr-venv/bin/python experiments/mvp/validate_audio_fleurs_geogroup.py \
            out/audio-fleurs-geogroup.json | tee out/validation.log

      - name: Summarize descriptive result
        shell: bash
        env:
          HYDRATE_SECONDS: ${{ steps.hydrate.outputs.hydrate_seconds }}
        run: |
          set -euo pipefail
          .asr-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads(Path("out/audio-fleurs-geogroup.json").read_text())
          d=b["derived_metrics"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as f:
              f.write("## FLEURS seven-geogroup audio falsifier\n\n")
              f.write(f"- FLEURS revision: `{b['observations']['corpus_manifest']['dataset']['revision']}`\n")
              f.write(f"- LangID: `{d['baseline_auto_language_id_correct']}/7`\n")
              f.write(f"- mean CER surfaces: `{d['mean_normalized_character_error_rate']}`\n")
              f.write(f"- transcript-change counts: `{d['transcript_changed_from_forced_baseline']}`\n")
              f.write(f"- encoder frame distances: `{d['mean_encoder_frame_cosine_distance_from_baseline']}`\n")
              f.write(f"- hydration: `{float(os.environ['HYDRATE_SECONDS']):.3f} s`\n")
              f.write(f"- science: `{b['cost']['experiment_seconds']:.3f} s`, RSS: `{b['cost']['peak_rss_mib']:.1f} MiB`\n")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-spelunker-audio-fleurs-geogroup-${{ github.run_id }}
          path: |
            out/audio-fleurs-geogroup.json
            out/runtime.json
            out/fleurs-acquisition.log
            out/validation.log
            out/run.log
            fixture/fleurs-manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
