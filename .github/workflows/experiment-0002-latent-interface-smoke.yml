name: experiment-0002-latent-interface-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latent-interface-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_id: pythia-70m
            model: EleutherAI/pythia-70m
          - model_id: qwen3-0.6b-base
            model: Qwen/Qwen3-0.6B-Base
    name: latent-interface-${{ matrix.model_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TORCH_NUM_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-experiment-0001.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'

      - name: Install experiment dependencies
        run: python -m pip install -r requirements-experiment-0001.txt

      - name: Run latent read-write smoke
        run: |
          python tools/run_latent_interface_smoke.py \
            --model '${{ matrix.model }}' \
            --train-fixture fixtures/experiment-0001/reciprocity-semantic-smoke.jsonl \
            --heldout-fixture fixtures/experiment-0001/reciprocity-semantic-heldout.jsonl \
            --output-dir 'artifacts/experiment-0002-${{ matrix.model_id }}'

      - name: Summarize evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/experiment-0002-${{ matrix.model_id }}/summary.json')
          summary = json.loads(path.read_text(encoding='utf-8'))
          for key in (
              'model',
              'model_class',
              'num_layers',
              'chosen_layer',
              'chosen_train_accuracy',
              'chosen_heldout_accuracy',
              'direction_norm',
              'intervention_probe_count',
              'mean_positive_alpha_concept_delta',
              'mean_positive_alpha_random_delta',
          ):
              print(f'{key}={summary[key]}')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0002-${{ matrix.model_id }}-${{ github.run_id }}
          path: artifacts/experiment-0002-${{ matrix.model_id }}
          if-no-files-found: error
          retention-days: 14
