# Upstream TrueNAS iX-lib source-render fixture only.
# Source-only image digests in ix_values.yaml are deliberate non-pullable markers.
resources:
  limits:
    cpus: 3.0
    memory: 6144
controller:
  ui_origin: https://conditioning.example.invalid
worker:
  mode: cpu
models:
  enable_hydration: true
  logical_id: "asr/faster-whisper/tiny"
  approved_digest: "sha256:f2d664ae986b0b0598037a9f0b929fd0b0b748871474a06c84658c1f2a1a4b42"
network:
  web_port:
    bind_mode: exposed
    port_number: 31095
ix_volumes:
  jobs: /opt/tests/mnt/conditioning-lab/jobs
  approved-models: /opt/tests/mnt/conditioning-lab/approved-models
storage:
  jobs:
    type: ix_volume
    ix_volume_config:
      dataset_name: jobs
      create_host_path: true
      acl_enable: false
  models:
    type: ix_volume
    ix_volume_config:
      dataset_name: approved-models
      create_host_path: true
      acl_enable: false
  secrets_dir: /opt/tests/mnt/conditioning-lab/secrets
  approval_dir: /opt/tests/mnt/conditioning-lab/approval
