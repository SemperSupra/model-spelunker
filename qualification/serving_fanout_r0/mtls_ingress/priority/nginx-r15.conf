worker_processes 1;
pid /tmp/model-spelunker-r15-priority-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;

    # This is synthetic CA-signed certificate role mapping, not production
    # tenant identity governance or certificate issuance/rotation.
    map "$ssl_client_verify:$ssl_client_s_dn" $r15_role {
        default unknown;
        "SUCCESS:CN=r13-public-alpha" interactive;
        "SUCCESS:CN=r13-public-beta" batch;
    }
    map $r15_role $r15_batch_counter {
        default "";
        batch "batch";
    }
    limit_conn_zone $server_name zone=r15_global_baseline:1m;
    limit_conn_zone $server_name zone=r15_global_reserved:1m;
    limit_conn_zone $r15_batch_counter zone=r15_batch_reserved:1m;

    # Baseline: same global capacity, no class reservation.
    server {
        listen 127.0.0.1:18444 ssl;
        server_name localhost;
        ssl_certificate /tmp/model-spelunker-r13-certs/server.crt;
        ssl_certificate_key /tmp/model-spelunker-r13-certs/server.key;
        ssl_client_certificate /tmp/model-spelunker-r13-certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        if ($r15_role = unknown) { return 403; }
        limit_conn r15_global_baseline 2;
        limit_conn_status 503;
        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-Class "";
            proxy_set_header X-Tenant "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 180s;
        }
    }

    # Reuse nginx map + limit_conn to keep one of two budget slots from batch.
    server {
        listen 127.0.0.1:18445 ssl;
        server_name localhost;
        ssl_certificate /tmp/model-spelunker-r13-certs/server.crt;
        ssl_certificate_key /tmp/model-spelunker-r13-certs/server.key;
        ssl_client_certificate /tmp/model-spelunker-r13-certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        if ($r15_role = unknown) { return 403; }
        limit_conn r15_global_reserved 2;
        limit_conn r15_batch_reserved 1;
        limit_conn_status 503;
        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-Class "";
            proxy_set_header X-Tenant "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 180s;
        }
    }
}
