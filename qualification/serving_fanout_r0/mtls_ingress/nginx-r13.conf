worker_processes 1;
pid /tmp/model-spelunker-r13-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    # SSL client fingerprint is derived from the verified peer certificate,
    # unlike caller-supplied X-Tenant or X-Forwarded-User headers.
    limit_conn_zone $ssl_client_fingerprint zone=per_cert_r13:1m;
    limit_conn_zone $server_name zone=global_r13:1m;
    server {
        listen 127.0.0.1:18443 ssl;
        server_name localhost;

        ssl_certificate /tmp/model-spelunker-r13-certs/server.crt;
        ssl_certificate_key /tmp/model-spelunker-r13-certs/server.key;
        ssl_client_certificate /tmp/model-spelunker-r13-certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        limit_conn global_r13 4;
        limit_conn per_cert_r13 2;
        limit_conn_status 503;

        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-Tenant "";
            proxy_set_header X-Forwarded-User "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
