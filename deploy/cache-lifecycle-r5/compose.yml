# Public fixture only. A production release must supply an admitted immutable image.
services:
  inference:
    image: ${CACHE_IMAGE:?required}
    pull_policy: never
    user: "${CACHE_UID:?required}:${CACHE_GID:?required}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - type: bind
        source: ${CACHE_MODEL:?required}
        target: /model.gguf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CACHE_STATE:?required}
        target: /slots
        bind:
          create_host_path: false
    command: ["-m", "/model.gguf", "-c", "512", "-np", "1", "-t", "2", "--host", "0.0.0.0", "--port", "18081", "--slot-save-path", "/slots"]
